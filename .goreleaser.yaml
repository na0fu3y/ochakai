# Prebuilt binaries for people without a Go toolchain. The CLI is the
# recommended interface for agents, so `go install` and the container
# image alone leave non-Go teams with no way in.
#
# Deliberately no `dockers:`/`docker_manifests:` here. The image is
# already published by .github/workflows/release.yaml through buildx,
# with an SBOM and SLSA provenance attached to the manifest; goreleaser
# would have to rebuild it per-architecture and stitch the manifest
# itself, losing those. Two publishers for one image is worse than one
# good one.
version: 2
project_name: ochakai

before:
  hooks:
    - go mod download

builds:
  - id: ochakai
    # The repository ships exactly one binary.
    main: ./cmd/ochakai
    binary: ochakai
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Without this the binaries carry the build's wall clock, so the same
    # tag rebuilt tomorrow produces different archives and a different
    # checksums.txt — and "verify the checksum yourself" stops being
    # something a reader can act on. The commit's own timestamp is the one
    # value that is a property of the tag rather than of the runner.
    # -trimpath above removes the other half, the build machine's paths.
    mod_timestamp: "{{ .CommitTimestamp }}"
    # main.version is the only variable the source lets us stamp; see
    # cmd/ochakai/main.go. .Tag rather than .Version because .Version
    # strips the leading "v", and every other path that reports a
    # version — the Dockerfile's VERSION build arg, and the module
    # version debug.ReadBuildInfo yields for `go install …@v0.13.0` —
    # keeps it. Users comparing `ochakai version` across install
    # methods should not see two spellings of one release.
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

# One macOS binary that runs on both Intel and Apple Silicon, for the MCP
# bundle (scripts/mcpb). A bundle's manifest can vary its command by
# operating system and not by CPU, so the architecture has to be settled
# before packing — and shipping the amd64 build alone would need Rosetta,
# which recent macOS does not install by itself.
#
# It is not archived and not released: `archives` below takes `ids: [ochakai]`,
# so this stays a plain Binary artifact in dist/, which the release pipe
# does not upload. The six archives people download are unchanged.
universal_binaries:
  - id: ochakai-macos
    ids: [ochakai]
    replace: false
    name_template: ochakai

archives:
  - ids: [ochakai]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      # The bundles the README tells you to import, and the hooks it tells
      # you to install. `ochakai import` takes a directory or a tar.gz and
      # not a URL, and the container image carries only the binary, so
      # without these the sole way to reach examples/bigquery-catalog was
      # to clone the repository for a bundle whose whole point is that it
      # runs outside the server.
      #
      # The directory, not a glob: `examples/**/*` silently drops the files
      # sitting directly in it — examples/README.md, which is the page that
      # says what the bundles are, and examples/golden-query.md, which the
      # same page hands to `ochakai put -f`.
      - examples

checksum:
  name_template: checksums.txt

# One SPDX SBOM per archive, attached to the release beside it. The
# container image already carries an SBOM in its manifest (release.yaml
# builds it with `sbom: true`); these are for people who deploy the CLI
# archives instead, and for the dependency scanners an OSS review points
# at release assets. goreleaser shells out to syft, which release.yaml
# installs right before it runs.
sboms:
  - artifacts: archive

# The release notes are written by hand in CHANGELOG.md and assembled by
# .github/release.yml. A generator here would compete with both.
changelog:
  disable: true

release:
  # This job's output is the archives, not the prose. If a release for
  # the tag already exists — drafted by hand, or by GitHub's generated
  # notes — attach to it and leave its body alone.
  mode: keep-existing
  # Leave it a draft; the workflow publishes it as its last step, once
  # the MCP bundle, the notes and the provenance are all on it.
  #
  # A published release in this repository is immutable: GitHub answers
  # HTTP 422 to an asset upload against one. The workflow used to
  # publish here and add the rest afterwards, which worked until
  # immutability was on — then v0.21.0 shipped without its bundle,
  # without its notes and without archive attestations, because the
  # upload failed and `set -e` took the three steps behind it down too.
  # A draft accepts assets, so the order is: assemble, then publish.
  draft: true

# Homebrew is off until the maintainer opts in: publishing a formula
# needs a second repository (na0fu3y/homebrew-tap) and a PAT, because
# GITHUB_TOKEN cannot write across repositories — and a long-lived
# token in CI is exactly the secret this project otherwise refuses to
# hold (docs/design/0002, 0003).
#
# To turn it on: create na0fu3y/homebrew-tap, store a PAT with `contents:
# write` on it as the HOMEBREW_TAP_TOKEN secret, then uncomment the
# block below and pass that secret to the goreleaser step in
# .github/workflows/release.yaml.
#
# brews:
#   - repository:
#       owner: na0fu3y
#       name: homebrew-tap
#       token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
#     homepage: https://github.com/na0fu3y/ochakai
#     description: Knowledge store for data-analysis agents
#     license: MIT
