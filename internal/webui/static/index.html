<!doctype html>
<!-- The bundled web UI for the ochakai REST API (api/openapi.yaml).
     No build step, no framework, no CDN: this page and the ES modules
     under js/ are served as they are written, and the browser is the
     only thing that assembles them.
     Served by `ochakai ui` (loopback) and `ochakai serve-ui` (deployed) —
     both proxy /api/v1 to ochakai, and the page always talks to its own
     origin (design doc 0006). It covers the human-facing API surface —
     a persistent knowledge tree as the primary navigation (an entry's id
     is its path, design docs 0014/0016), directory index pages (each
     tree level rendered like the OKF export's index.md — subdirectories
     with counts, entries with descriptions), search, entry details with
     usage, revision history, backlinks, files, create/edit with
     the draft → verified workflow, move with reference rewriting (a Move
     action and tree drag & drop), the draft review queue (sort=usage),
     the two feeds that empty by verifying — reported wrong (sort=failed)
     and verification age (sort=verified_at), reachable from the review
     queue and #/search/reported-wrong — a quick-open palette (Ctrl+K)
     over the same search, an outline with heading anchors on long
     bodies, revision diffs in the history tab, how much each queue is holding,
     how the loop is going over a period and under a path, and what it
     could not answer (design doc 0069), the access policy for an
     administrator — who may read and write under which directory
     (design doc 0109) — and OKF export.
     A starting point for building your own UI. -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ochakai</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <button id="side-toggle" title="ナレッジツリーを開閉します" aria-label="サイドバーの開閉">☰</button>
  <a class="brand" href="#/">🍵 ochakai</a>
  <nav class="topnav" id="topnav" aria-label="メインナビゲーション">
    <a href="#/search" data-route="search">検索</a><a href="#/review" data-route="review">レビュー<span class="waiting" id="nav-waiting" hidden></span></a>
    <!-- Shown once the server answers for it: reading the access policy
         is an administrator's operation, and a tab that can only 403 is
         a lie the same way a button that can only 403 is. -->
    <a href="#/access" data-route="access" id="nav-access" hidden>アクセス</a>
  </nav>
  <span class="spacer"></span>
  <!-- The door documentation services keep: jump to an entry from
       anywhere. The button is the discoverable half; the shortcut it
       names is the fast one, and palette.js swaps the hint to ⌘K where
       the keyboard has one. -->
  <button id="palette-btn" class="palette-btn" title="どこからでもナレッジを検索して開けます" aria-label="クイックオープン"><span aria-hidden="true">🔍</span><kbd>Ctrl+K</kbd></button>
</header>
<div class="shell" id="shell">
  <aside class="sidebar">
    <details id="side-details">
      <summary>ナレッジツリー</summary>
      <div class="side-head">
        <span class="lbl">ナレッジ</span>
        <button class="btn small" id="tree-refresh" title="ツリーを読み込み直します" aria-label="ツリーを再読み込み">↻</button>
        <a class="btn small write-only" href="#/new" title="ナレッジを新規作成します" aria-label="ナレッジを新規作成">＋</a>
      </div>
      <div id="tree" class="browse"><div class="empty">…</div></div>
    </details>
  </aside>
  <!-- The divider between tree and content is draggable: the tree holds
       names the user chose, so no fixed width can be right for every
       bundle. Absolutely positioned, so the grid still has exactly two
       cells. Pointer-only by design — the default width needs no
       adjustment to use the page, so it carries no keyboard surface. -->
  <div class="side-resize" id="side-resize" aria-hidden="true" title="ドラッグで幅を調整、ダブルクリックで元に戻します"></div>
  <!-- The banners are content, not a column. Left as siblings of <main>
       they were grid items of their own: a displayed one took the
       content cell and pushed the view into the second row of the
       sidebar's column, where a sticky sidebar covered it. Anything
       page-wide added later belongs in here for the same reason. -->
  <div class="content">
    <!-- OCHAKAI_MODE=dev: authentication is off, so a ruling records
         whoever asked to be recorded. The mode's own documentation says
         not to deploy it, which is why the page says it too — the
         deployments that need telling are the ones that did it anyway. -->
    <div class="dev-note" role="status">
      <strong>認証が無効です(<code>OCHAKAI_MODE=dev</code>)。</strong>開発専用です。
    </div>
    <div class="sandbox-note" role="status">
      <strong>ここはサンドボックスです。</strong>誰でも書き込めて、全体が定期的に初期化されます。<strong>失って困るものは置かないでください。</strong>
    </div>
    <!-- tabindex="-1" so the router can move focus here after a
       navigation: the view is replaced in place, and without it a
       keyboard or screen-reader user stays where the last click left
       them while the page around them changes. -->
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<!-- The quick-open palette (palette.js). A native <dialog>, because
     showModal() is the focus trap and the Esc handling — the page has no
     framework to reimplement either in. Empty until opened; the list is
     written by the module from /api/v1/search. -->
<dialog id="palette" aria-label="クイックオープン">
  <input type="text" id="palette-q" placeholder="ナレッジを検索して移動…" autocomplete="off"
         role="combobox" aria-expanded="true" aria-autocomplete="list" aria-controls="palette-list" aria-label="ナレッジを検索">
  <div id="palette-list" role="listbox" aria-label="候補"></div>
  <div class="palette-hint">↑↓ で選択 · Enter で開く · Esc で閉じる</div>
</dialog>
<!-- Every save, refusal and failure is announced here, so it is a live
     region: a screen reader gets told what a sighted reader sees flash
     past. polite, not assertive — it reports, it does not interrupt. -->
<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
