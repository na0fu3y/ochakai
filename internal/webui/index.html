  revealInTree(id); // in parallel with the entry fetch; harmless on 404
  view.innerHTML = '<div class="empty">…</div>';
  let entry, observed, document_;
  try {
    // A read is {id, document, summary, observed, files} (design
    // doc 0043 §3.5). The summary is flattened onto entry so the header
    // reads one object; the document is the entry itself.
    const v = await api(conceptURL(id));
    entry = Object.assign({ id: v.id, files: v.files || [] }, v.summary);
    observed = v.observed || {};
    document_ = v.document || '';
  } catch (e) {
    view.innerHTML = `<div class="error-banner">${esc(id)} を読み込めませんでした: ${esc(e.message)}</div>`;
    return;
  }
  // The body, cut from the document at the closing delimiter. Cutting on
  // a delimiter is not parsing: nothing here reads a frontmatter value
  // (design doc 0044 §2.3).
  const docBody = (() => {
    const m = document_.match(/^---\r?\n[\s\S]*?\r?\n---\r?\n([\s\S]*)$/);
    return (m ? m[1] : document_).trim();
  })();

  const prov = [
    observed.created_by && observed.created_by.name ? `created by ${actorStr(observed.created_by)} ${fmtDate(entry.created_at)}` : `created ${fmtDate(entry.created_at)}`,
    lastVerification(observed)
      ? `verified by ${actorStr(lastVerification(observed).by)} ${fmtDate(lastVerification(observed).at)}`
        + ((observed.verified || []).length > 1 ? ` (${observed.verified.length} verifications)` : '')
      : '',
    observed.rejection ? `rejected by ${actorStr(observed.rejection.by)} ${fmtDate(observed.rejection.at)}` : '',
    // updated_by is OKF's generated.by: who the content stands by now,
    // which is not always who created it (design doc 0036 §3.3).
    entry.updated_at && entry.updated_at !== entry.created_at
      ? ((observed.generated || {}).by && observed.generated.by.name
          ? `updated by ${actorStr(observed.generated.by)} ${fmtDate(entry.updated_at)}`
          : `updated ${fmtDate(entry.updated_at)}`)
      : '',
  ].filter(Boolean).join(' · ');

  // A passed stale_after is a prompt to re-check, never a claim the entry
  // is wrong (OKF SPEC §5.5) — the comparison is a plain date one.
  const staleNote = entry.stale_after
    ? (entry.stale_after <= new Date().toISOString().slice(0, 10)
        ? `<div class="status-note">Stale since ${esc(entry.stale_after)} — due for a re-check.</div>`
        : `<div class="provenance">stale after ${esc(entry.stale_after)}</div>`)
    : '';

  const tags = (entry.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join(' ');
  const atts = entry.files || [];

  view.innerHTML = `
    <nav class="crumbs mono">${crumbTrail(entry.id.split('/').slice(0, -1))} <span class="badge">${esc(entry.type)}</span></nav>
    <div class="detail-head">
      <span class="type-ico" style="font-size:1.4rem">${icon(entry.type)}</span>
      <h1>${esc(displayTitle(entry))}</h1>
      <span class="badge status-pick ${esc(entry.status)}" title="ステータスを変える">
        <span aria-hidden="true">${esc(entry.status)}</span>
        <select class="write-only" id="act-status" aria-label="ステータス">
          ${STATUSES.map(s => `<option value="${s}" ${s === entry.status ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </span>
      ${isVerified(entry) ? `<span class="badge verified-mark" title="検証台帳から OKF が導く trust の段(SPEC §5.3)">✓ ${trustOf(entry)}</span>` : ''}
      ${entry.rejected ? '<span class="badge rejected-mark" title="レビューされ、受け入れられなかった">rejected</span>' : ''}
      ${tags}
      <span class="actions write-only">
        <a class="btn small" href="#/edit/${idPath(entry.id)}">編集</a>
        <details class="menu" id="more-menu">
          <summary class="btn small" title="その他の操作" aria-label="その他の操作">⋯</summary>
          <div class="menu-body">
            <button id="act-verify" title="${isVerified(entry)
              ? 'もう一度確かめて、やはり正しい — 検証を追記する。レビューのフィードが片付くのはこれによる'
              : 'この concept を確認する — あなたによる検証として記録されます'}">${isVerified(entry) ? '再検証' : '検証'}</button>
            ${entry.rejected
              ? `<button id="act-withdraw" title="裁定を取り下げ、concept を通常の扱いに戻す">却下を取り下げる</button>`
              : `<button class="danger" id="act-reject" title="レビューして受け入れなかった — 検索から隠れ、理由は次のエージェントのために残る">却下…</button>`}
            <button id="act-move" title="別のパスへ移す(参照は書き換えられる)">移動…</button>
            <button class="danger" id="act-delete">削除…</button>
          </div>
        </details>
      </span>
    </div>
    <div class="provenance">${esc(prov)}</div>
    ${observed.rejection && observed.rejection.note
      ? `<div class="status-note">Rejected: ${esc(observed.rejection.note)}</div>` : ''}
    <div id="move-panel" style="display:none;margin-top:.7rem">
      <div class="toolbar" style="margin-bottom:0">
        <input type="text" id="move-to" class="mono" list="move-dirs" value="${esc(entry.id)}"
               style="max-width:28rem" aria-label="新しいパス">
        <datalist id="move-dirs"></datalist>
        <button class="btn small primary" id="move-go">移動</button>
        <button class="btn small" id="move-cancel">キャンセル</button>
      </div>
      <p class="provenance" style="margin-top:.3rem">concept の新しいパスです。ここを指している参照は
      書き換えられ、リビジョン・利用回数・ファイルも concept に付いていきます。</p>
    </div>
    ${entry.status_note ? `<div class="status-note">${esc(entry.status_note)}</div>` : ''}
    ${staleNote}
    ${entry.resource ? `<div class="provenance">resource: ${resourceHTML(entry.resource)}</div>` : ''}
    <div class="tabs" id="tabs">
      <button data-tab="overview" class="active">概要</button>
      <button data-tab="document">ドキュメント</button>
      <button data-tab="links">Links${entry.links && entry.links.length ? ' (' + entry.links.length + ')' : ''}</button>
      <button data-tab="files">Files${atts.length ? ' (' + atts.length + ')' : ''}</button>
      <button data-tab="linked">ここを指しているもの</button>
      <button data-tab="usage">利用</button>
      <button data-tab="history">履歴</button>
    </div>
    <div id="tab-body"></div>`;

  // File paths and image resolution (design doc 0008). Body links
  // are OKF bundle references: relative to the entry document's directory
  // (the id's parent), or bundle-root when they start with "/".
  const lastSeg = entry.id.split('/').pop();
  const docDir = entry.id.includes('/') ? entry.id.slice(0, entry.id.lastIndexOf('/')) : '';
  // A file is addressed by the path it lives at (design doc 0046 §3.3).
  // Writing one from here puts it at the entry's canonical <id>/<name>;
  // reading one follows the path the entry reported, which is where an
  // imported file actually is.
  const attPath = path => '/api/v1/bundle/' + idPath(path);
  const attURL = path => BASE + attPath(path);
  const canonicalPath = name => entry.id + '/' + name;
  const normalize = p => {
    const out = [];
    for (const seg of p.split('/')) {
      if (!seg || seg === '.') continue;
      if (seg === '..') out.pop(); else out.push(seg);
    }
    return out.join('/');
  };
  const resolveFile = ref => {
    const p = normalize(ref.startsWith('/') ? ref : (docDir ? docDir + '/' : '') + ref);
    const canonical = a => entry.id + '/' + a.name;
    let hit = atts.find(a => p === a.path || p === canonical(a));
    // Forgiving fallback: names are unique within the entry, so a filename
    // match resolves references written against a layout we don't know.
    hit = hit || atts.find(a => a.name === ref.split('/').pop());
    return hit ? attURL(hit.path || canonicalPath(hit.name)) : null;
  };
  // Links to other entries, resolved the way the server derives them from
  // this same body (design doc 0024): SPEC §6's two forms, bundle-absolute
  // "/x/y.md" and relative "./y.md" against the document's directory. A
  // reference to anything else — a file, an external URL, an
  // anchor, a URI scheme — is not an entry link and stays literal text.
  const resolveEntry = ref => {
    const target = String(ref).split(/[#?]/)[0];
    if (!target) return null;
    let id;
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(target)) return null; // a scheme: outside the bundle
    else if (!target.endsWith('.md')) return null; // a file, not an entry
    else {
      const rel = target.slice(0, -'.md'.length);
      id = normalize(rel.startsWith('/') ? rel : (docDir ? docDir + '/' : '') + rel);
    }
    return id ? '#/k/' + idPath(id) : null;
  };

  const tabs = {
    // Sources sit under the prose they support rather than in a tab of
    // their own: OKF's own model is body footnotes keyed to source ids, so
    // whoever is reading the body is exactly who needs the list.
    overview: () => `
      ${entry.description ? descHTML(entry.description, 'lead') : ''}
      ${docBody ? `<div class="md">${md(docBody, resolveFile, resolveEntry)}</div>` : ''}
      ${!entry.description && !docBody ? '<div class="empty">description も本文もありません。</div>' : ''}`,
    // The document, whole and unrendered. It replaced tabs that each
    // redrew a slice of the frontmatter in some other shape — which is
    // the duplication document-first exists to remove, and the reason
    // design doc 0044 puts the format itself in front of the reader.
    document: () => `
      <p class="provenance" style="margin:0 0 .8rem">ochakai が保存しているままの concept —
      OKF の frontmatter と markdown です。「編集」が開くのもこのテキストで、export が書き出すのもこれです。</p>
      <pre class="mono">${esc(document_)}</pre>`,
    // Read-only: links come from the body's markdown links (design doc
    // 0024), so the body editor is where they are changed.
    links: () => {
      const links = entry.links || [];
      if (!links.length) return '<div class="empty">本文はまだ他の concept を指していません。</div>';
      return `<p class="provenance" style="margin:0 0 .8rem">本文の markdown リンクから取られている — 変えるには本文を編集する。</p>`
        + '<table class="kv">' + links.map(l => {
        const target = String(l.target || '').replace(/^ochakai:\/\//, '');
        const href = target ? '#/k/' + idPath(target) : null;
        const text = l.text || target.split('/').pop() || target;
        return `<tr><td class="k">${esc(text)}</td>
          <td>${href ? `<a class="mono" href="${href}">${esc(target)}</a>` : `<span class="mono">${esc(target)}</span>`}</td></tr>`;
      }).join('') + '</table>';
    },
    files: () => {
      const cards = atts.map(a => {
        const isImage = (a.media_type || '').startsWith('image/');
        const thumb = isImage
          ? `<a class="thumb" href="${attURL(a.path)}" target="_blank" rel="noopener"><img src="${attURL(a.path)}" alt="${esc(a.name)}" loading="lazy"></a>`
          : `<a class="thumb thumb-file" href="${attURL(a.path)}" target="_blank" rel="noopener">${a.media_type === 'application/pdf' ? 'PDF' : 'TXT'}</a>`;
        const ref = isImage ? `![${esc(a.name)}](${esc(lastSeg)}/${esc(a.name)})` : `[${esc(a.name)}](${esc(lastSeg)}/${esc(a.name)})`;
        return `
        <div class="card att-card">
          ${thumb}
          <div class="att-meta">
            <span class="mono">${esc(a.name)}</span>
            <span class="meta">${esc(a.media_type || '')} · ${fmtSize(a.size)}${a.created_by && a.created_by.name ? ' · ' + esc(actorStr(a.created_by)) : ''}${a.created_at ? ' · ' + esc(fmtDate(a.created_at)) : ''}</span>
            <span class="meta">body reference: <code>${ref}</code></span>
            <button class="btn small danger write-only" data-remove-file="${esc(a.path)}" data-name="${esc(a.name)}">外す</button>
          </div>
        </div>`;
      }).join('');
      return `
        ${cards || '<div class="empty">ファイルはありません。</div>'}
        <div class="toolbar write-only" style="margin-top:1rem">
          <input type="file" id="att-file" accept="image/png,image/jpeg,image/webp,application/pdf,text/plain,.txt,.csv,.json" multiple hidden>
          <button class="btn small" id="att-choose">ファイルを選ぶ…</button>
          <span class="provenance" id="att-chosen" style="margin:0"></span>
          <button class="btn small primary" id="att-upload">ファイルを追加</button>
        </div>
        <p class="provenance write-only">Any file, max 5 MiB each. Reference a file from the
        body (<code>![alt](${esc(lastSeg)}/name.png)</code> or <code>[name](${esc(lastSeg)}/name.txt)</code>) so it is findable and survives OKF export.</p>`;
    },
    linked: () => '<div class="empty">…</div>',
    usage: () => '<div class="empty">…</div>',
    history: () => '<div class="empty">…</div>',
  };

  function wireFiles() {
    const fileInput = $('#att-file');
    $('#att-choose').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      $('#att-chosen').textContent = [...fileInput.files].map(f => f.name).join(', ');
    });
    $('#att-upload').addEventListener('click', async () => {
      const files = [...fileInput.files];
      if (!files.length) { toast('先にファイルを選んでください。'); return; }
      try {
        for (const f of files) {
          await api(attPath(canonicalPath(f.name)), { method: 'PUT', raw: f });
        }
        toast(files.length > 1 ? `Added ${files.length} files.` : 'Added.');
        viewDetail(entry.id);
      } catch (e) { toast('ファイルの追加に失敗しました: ' + e.message); }
    });
    body.querySelectorAll('[data-remove-file]').forEach(b => b.addEventListener('click', async () => {
      const path = b.dataset.removeFile;
      if (!confirm(`Remove ${b.dataset.name}? 変更はリビジョンとして残ります。`)) return;
      try {
        await api(attPath(path), { method: 'DELETE' });
        toast('Removed.');
        viewDetail(entry.id);
      } catch (e) { toast('Remove failed: ' + e.message); }
    }));
  }

  const body = $('#tab-body');
  // Lazily loaded tabs: fetch once on first open, then re-render from the
  // cached template. A failed fetch shows in place and retries next open.
  const lazy = {
    usage: async () => {
      const u = await api('/api/v1/usage/' + idPath(entry.id));
      return () => `
        <div class="stat-tiles">
          <div class="tile"><div class="num">${u.search_hits ?? 0}</div><div class="lbl">search hits</div></div>
          <div class="tile"><div class="num">${u.fetches ?? 0}</div><div class="lbl">fetches</div></div>
          <div class="tile"><div class="num">${u.worked ?? 0}</div><div class="lbl">worked</div></div>
          <div class="tile"><div class="num">${u.failed ?? 0}</div><div class="lbl">failed</div></div>
        </div>
        <p class="provenance">${u.last_used_at ? 'last used ' + esc(fmtDate(u.last_used_at)) : 'never used'}</p>`;
    },
    linked: async () => {
      const { hits: entries = [] } = await api('/api/v1/search?links_to=' + encodeURIComponent(entry.id) + '&limit=100');
      return () => (entries && entries.length)
        ? `<p class="provenance" style="margin:0 0 .8rem">ここを指しているリンクを持つ concept — この concept 自身のリンクはリンクのタブにある。</p>`
          + entries.map(hitCard).join('')
        : '<div class="empty">この concept を指しているものは、まだありません。</div>';
    },
    history: async () => {
      // ?history is the object's own ledger, at the object's own address
      // (design doc 0046 §3.5); the log.md beside it is the directory's.
      const { revisions } = await api('/api/v1/bundle/' + idPath(entry.id) + '.md?history&limit=200');
      const rows = (revisions || []).map(r => `
        <tr>
          <td class="k mono">#${r.rev}</td>
          <td>
            <div><strong>${esc(r.change)}</strong> · ${esc(actorStr(r.changed_by))} · ${esc(fmtDate(r.changed_at))}</div>
            <details><summary style="cursor:pointer;color:var(--muted);font-size:.84rem">document</summary>
              <pre>${esc(r.document || '')}</pre></details>
          </td>
        </tr>`).join('');
      return () => `
        <p class="provenance" style="margin:0 0 .8rem">Every change, newest first — who made it and the concept as of that change.</p>
        <table class="kv">${rows}</table>`;
    },
  };
  async function showTab(name) {
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    body.innerHTML = tabs[name]();
    if (name === 'files') wireFiles();
    if (lazy[name]) {
      try {
        tabs[name] = await lazy[name]();
        delete lazy[name];
        if (document.querySelector('#tabs button.active')?.dataset.tab === name) body.innerHTML = tabs[name]();
      } catch (e) {
        if (document.querySelector('#tabs button.active')?.dataset.tab === name) {
          body.innerHTML = `<div class="error-banner">Could not load ${esc(name)}: ${esc(e.message)}</div>`;
        }
      }
    }
  }
  document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
  showTab('overview');

  // Status is a picker, not a row of transition buttons: any transition
  // the API allows is offered (provenance over authorization, design doc
  // 0002). It is the lifecycle value alone — confirming and rejecting are
  // rulings with their own actions in the ⋯ menu. Deprecating asks for a
  // reason; a cancelled prompt puts the picker back.
  const statusPick = $('#act-status');
  statusPick.addEventListener('change', async () => {
    const status = statusPick.value;
    try {
      if (await applyStatus(entry.id, status)) {
        toast(`Marked ${status}.`);
        refreshTree(); // the tree shows status badges
        viewDetail(entry.id);
        return;
      }
    } catch (e) { toast('Failed: ' + e.message); }
    statusPick.value = entry.status;
  });
  // The Move panel: a destination input seeded with the current path,
  // with every directory the tree has loaded (plus the root) offered as
  // a completion — pick one or edit the path directly.
  const closeMenu = () => { $('#more-menu').open = false; };
  $('#act-verify')?.addEventListener('click', async () => {
    closeMenu();
    try {
      await verifyEntry(entry.id);
      toast(isVerified(entry) ? 'Re-verified.' : 'Verified.');
      viewDetail(entry.id);
    } catch (e) { toast('Failed: ' + e.message); }
  });
  $('#act-reject')?.addEventListener('click', async () => {
    closeMenu();
    const note = prompt('なぜ受け入れないのか?(裁定として残るので、エージェントは同じ提案を繰り返さなくなる)', '');
    if (note === null) return;
    try {
      await rejectEntry(entry.id, note);
      toast('Rejected.');
      refreshTree(); // the tree hides rejected entries
      viewDetail(entry.id);
    } catch (e) { toast('Failed: ' + e.message); }
  });
  $('#act-withdraw')?.addEventListener('click', async () => {
    closeMenu();
    try {
      await liftRejection(entry.id);
      toast('Rejection withdrawn.');
      refreshTree();
      viewDetail(entry.id);
    } catch (e) { toast('Failed: ' + e.message); }
  });
  $('#act-move').addEventListener('click', () => {
    closeMenu();
    $('#move-panel').style.display = '';
    const last = entry.id.split('/').pop();
    $('#move-dirs').innerHTML = knownDirs().map(p => `<option value="${esc(p + last)}">`).join('');
    $('#move-to').focus();
  });
  $('#move-cancel').addEventListener('click', () => { $('#move-panel').style.display = 'none'; });
  $('#move-go').addEventListener('click', () => moveEntry(entry.id, $('#move-to').value.trim()));
  $('#move-to').addEventListener('keydown', e => {
    if (e.key === 'Enter') moveEntry(entry.id, $('#move-to').value.trim());
  });
  $('#act-delete').addEventListener('click', async () => {
    closeMenu();
    if (!confirm(`Soft-delete ${entry.id}? リビジョンの履歴は残ります。`)) return;
    try {
      await api(conceptURL(entry.id), { method: 'DELETE' });
      toast('Deleted.');
      refreshTree();
      location.hash = '#/';
    } catch (e) { toast('Failed: ' + e.message); }
  });
}

// withFrontmatterKey returns doc with one scalar frontmatter key set: the
// line replaced when the document has one, and appended to the
// frontmatter when it does not. A writer who named no value leaves the
// key absent, and the server does not fill it in (design doc 0046 §3.9) —
// so an edit that only replaced would report success and change nothing.
//
// Still a line edit rather than a parser (design doc 0044 §2.1 refuses
// the parser; this refuses to need one), which is why it is only ever
// asked for scalars — a repeating structure is what would need the
// parser 0072 §3.1 turned down. The alternative, rebuilding a document
// from the fields the page holds, is what erased data before: the page
// holds the projection, and a document assembled from it would drop
// everything the projection does not carry — the citations, the
// contract, the body (design doc 0035 §4 is the same bug with fewer
// fields).
//
// One implementation because there are two callers now, and two copies
// of an append path only one of which gets a fix is how the type
// vocabulary drifted before.
function withFrontmatterKey(doc, key, value) {
  const line = key + ': ' + value;
  const re = new RegExp('^' + key + ':.*$', 'm');
  if (re.test(doc)) return doc.replace(re, line);
  // Append inside the frontmatter block: after the opening delimiter's
  // line, before the closing one. A document with no frontmatter is not
  // one this UI can write, so it is handed back untouched and the PUT
  // fails with the server's own message.
  const m = doc.match(/^(---\r?\n[\s\S]*?)(---\r?\n[\s\S]*)$/);
  return m ? m[1] + line + '\n' + m[2] : doc;
}

function withStatus(doc, status) {
  return withFrontmatterKey(doc, 'status', status);
}

// Apply a status transition (full-replacement PUT), prompting for a
// status_note when the transition needs a recorded reason. Returns true on
// success, false if the user cancelled the note prompt. Throws on API
// failure so callers can toast it. Shared by the detail view and the
// review queue; the entry may be a full Knowledge or a SearchHit (which
// embeds one), since both carry the writable fields.
async function applyStatus(id, status) {
  // Read the document, change the one line, write it back. The read is
  // what makes this safe: the page never holds the whole entry, only the
  // projection, so anything assembled from what it holds would be missing
  // the rest of the document.
  const v = await api(conceptURL(id));
  await api(conceptURL(id), {
    method: 'PUT', doc: withStatus(v.document || '', status),
  });
  return true;
}

// The two rulings. Neither edits the document: confirming an entry and
// turning it down are judgments about it, so they have their own
// endpoints and leave the lifecycle status alone (design doc 0043
// §§3.2-3.3). Verifying is an append, so the first confirmation and the
// tenth re-check are the same call.
async function verifyEntry(id) {
  await api('/api/v1/review/' + idPath(id), { method: 'POST', body: { ruling: 'verified' } });
  refreshQueues();
  return true;
}
async function rejectEntry(id, note) {
  await api('/api/v1/review/' + idPath(id), { method: 'POST', body: { ruling: 'rejected', note } });
  refreshQueues();
  return true;
}
async function liftRejection(id) {
  await api('/api/v1/review/' + idPath(id), { method: 'POST', body: { ruling: 'withdrawn' } });
  refreshQueues();
  return true;
}

/* ============================== review queues ============================== */

// How much work the three queues hold, as one call rather than three
// listings (design doc 0049). The web UI is where the reviewing happens,
// so the count belongs on the tab that leads to it: a queue going quiet
// and a queue being empty look identical until somebody opens it.
//
// Refreshed at boot, when the review queue is opened, and after every
// ruling or save — verifying, rejecting and editing are what move a
// count (each queue empties differently: design doc 0049 §1).
let waiting = null;

async function refreshQueues() {
  try {
    // The queue depths live on the stats face; the address they had of
    // their own is gone (design doc 0049 §3.1).
    waiting = (await api('/api/v1/stats')).queues;
  } catch {
    waiting = null; // a nudge that cannot load must not become an error banner
  }
  const badge = $('#nav-waiting');
  const total = waiting ? waiting.drafts + waiting.failed + waiting.stale_after : 0;
  badge.textContent = total;
  badge.hidden = !total;
  badge.title = total ? `${total} waiting: ${waiting.drafts} drafts, ${waiting.failed} reported wrong, ${waiting.stale_after} past their expiry` : '';
  const strip = $('#queue-strip');
  if (strip) strip.innerHTML = queueStrip();
}

// The same three numbers as links into the feed each one counts. Zero is
// worth printing here (unlike on the tab): on the review page it is the
// answer to "is there anything else", and it is an answer nothing gave
// before.
function queueStrip() {
  if (!waiting) return '';
  return [
    ['#/review', waiting.drafts, waiting.drafts === 1 ? 'draft' : 'drafts'],
    ['#/search/reported-wrong', waiting.failed, 'reported wrong'],
    ['#/search/stale', waiting.stale_after, 'past expiry'],
  ].map(([href, n, label]) =>
    `<a class="badge${n ? ' draft' : ''}" href="${href}">${n} ${label}</a>`).join(' ');
}

/* ============================== review queue ============================== */

// A draft with zero search hits, older than this, is flagged stale — the
// inventory case (nobody's finding it; a candidate to drop). Sort=usage
// already sinks these to the bottom; the toggle isolates them.
const STALE_DAYS = 14;
// loaded and cursor walk the draft queue a page at a time (design doc
// 0050 §2.1): the queue is a ledger, so it has an end rather than a cap.
const review = { staleOnly: false, loaded: [], cursor: '' };

function viewReview() {
  view.innerHTML = `
    <div class="section-title">draft のレビューキュー</div>
    <div class="read-only-note">この ochakai は read-only なので、レビューの操作は
    表示されません。キューそのものは本物です — 書き込めるデプロイのレビュアーが
    片付けていくのが、これと同じ列です。</div>
    <p style="color:var(--muted);max-width:48rem">エージェントが書き戻した draft を、求められている順に — 検索ヒット数と、
    その draft が実際に検索で浮いた回数で順位が付きます。正しいものは検証し、そうでないものは却下します
    (理由は status_note として残るので、エージェントは同じ提案を繰り返さなくなります)。一度も使われていない
    draft は下に沈みます。<em>stale</em> を切り替えると、その仕分けができます。</p>
    <p style="color:var(--muted);font-size:.9rem;max-width:48rem">検証済みのナレッジには、それ自身の二つのキューがある:
    <a href="#/search/reported-wrong">間違いと報告された</a>(失敗の報告に応えていない concept)と、
    <a href="#/search/verification-age">検証の古さ</a>(検証が古い順)です。検証すると、その concept は両方から消えます。
    A third, <a href="#/search/stale">stale</a>, lists concepts past the expiry their author declared — that one is cleared by
    editing the concept, not by verifying.</p>
    <div id="loop-stats"></div>
    <div class="toolbar">
      <label class="check"><input type="checkbox" id="r-stale" ${review.staleOnly ? 'checked' : ''}>
        stale only (0 hits, ≥ ${STALE_DAYS} days old)</label>
      <span class="grow"></span>
      <span id="queue-strip" style="display:flex;gap:.35rem">${queueStrip()}</span>
    </div>
    <div id="review-results"><div class="empty">…</div></div>`;
  $('#r-stale').addEventListener('change', () => { review.staleOnly = $('#r-stale').checked; runReview(); });
  refreshQueues();
  runReview();
  loadLoopStats();
}

// The loop as the instance sees it (design doc 0051), on the page where
// the person who runs it already is. Four numbers and the questions that
// came back empty — not a dashboard: what a curator can act on this
// morning, which is what the queues below are for.
//
// Failure to load is silent. Stats are a help, and a review queue that
// refuses to draw because a tally is unavailable would be worse than one
// with no tally.
async function loadLoopStats() {
  const out = $('#loop-stats');
  if (!out) return;
  let s;
  try { s = await api('/api/v1/stats'); } catch (e) { return; }
  if (out !== $('#loop-stats')) return;
  const trust = s.concepts?.trust || {};
  const confirmed = (trust['human-reviewed'] || 0) + (trust['machine-confirmed'] || 0);
  const gaps = s.misses?.recording ? (s.misses.queries || []) : [];
  // Shown only when it happened. The tiles above are the always-there
  // numbers; this is a fault in the measurement behind them, and a
  // permanent "0 lost" line would be one more thing to read past.
  const dropped = (s.dropped?.events ?? 0) + (s.dropped?.misses ?? 0);
  // Same rule, same reason: a fault in what search can see, drawn only
  // where it exists. A permanent "0 truncated" is one more line to read
  // past, and this one is worth stopping at — nothing else on any
  // surface says a concept is half in the index (design doc 0088).
  const truncated = s.embedding?.enabled ? (s.embedding.truncated ?? 0) : 0;
  out.innerHTML = `
    <div class="stat-tiles" style="max-width:52rem;margin:.2rem 0 1rem">
      <div class="tile"><div class="num">${s.concepts?.total ?? 0}</div><div class="lbl">concepts</div></div>
      <div class="tile"><div class="num">${confirmed}</div><div class="lbl">confirmed by somebody</div></div>
      <div class="tile"><div class="num">${s.review?.verifications ?? 0}</div><div class="lbl">verified in ${s.window_days} days</div></div>
      <div class="tile"><div class="num">${s.misses?.recording ? (s.misses.count ?? 0) : '–'}</div>
        <div class="lbl">searches that found nothing</div></div>
      <div class="tile"><div class="num">${s.outcomes?.concepts_reported ?? 0}/${s.outcomes?.concepts_used ?? 0}</div>
        <div class="lbl">used concepts reported back on</div></div>
    </div>` + (dropped ? `
    <p style="max-width:48rem;margin:0 0 1.2rem;color:var(--muted);font-size:.9rem">
      ${dropped} observation${dropped === 1 ? '' : 's'} were recorded and then lost in these
      ${s.window_days} days, so the numbers above undercount by at least that much. Usage is
      buffered in memory and written in batches; an instance that went away took what it was
      holding with it.</p>` : '') + (truncated ? `
    <p style="max-width:48rem;margin:0 0 1.2rem;color:var(--muted);font-size:.9rem">
      ${truncated} 件の concept が、埋め込みモデルの入力窓に収まらず<strong>前半だけ</strong>
      ベクトル検索に載っています(全 ${s.embedding.vectors} 件中)。後半に書かれていることでは
      見つかりません — 語句そのものが含まれていれば字句検索は当てます。長すぎる concept を
      分けるか、より広い窓のモデルに移すかのどちらかです。</p>` : '') + (gaps.length ? `
    <details style="max-width:48rem;margin:0 0 1.2rem">
      <summary style="cursor:pointer;color:var(--muted)">Asked for, not found — what to write next</summary>
      <p style="color:var(--muted);font-size:.9rem;margin:.5rem 0">直近 ${s.window_days} 日の検索
      that returned nothing, most-asked first. Not a queue anything empties: it stops appearing when the answer exists.</p>
      ${gaps.map(g => `<div style="display:flex;gap:.6rem;align-items:baseline;padding:.25rem 0">
        <span class="badge">${g.count}×</span>
        <a href="#/search" class="mono" data-gap="${esc(g.query)}">${esc(g.query)}</a></div>`).join('')}
    </details>` : '');
  // A gap is a question; clicking it asks it again, which is how a
  // curator sees what is there before writing what is not.
  out.querySelectorAll('[data-gap]').forEach(a => a.addEventListener('click', () => {
    explore.q = a.dataset.gap;
    explore.failedFeed = explore.ageFeed = explore.expiredFeed = false;
  }));
}

function isStaleDraft(h) {
  const age = daysSince(h.created_at);
  return ((h.usage && h.usage.search_hits) || 0) === 0 && age !== null && age >= STALE_DAYS;
}

// append reads the next page of the queue and keeps the cards already on
// screen; every other call starts it over.
async function runReview(append = false) {
  const out = $('#review-results');
  if (!out) return;
  const my = runReview._seq = (runReview._seq || 0) + 1;
  const limit = 100;
  let url = '/api/v1/search?sort=usage&status=draft&limit=' + limit;
  if (append && review.cursor) url += '&cursor=' + encodeURIComponent(review.cursor);
  else { review.loaded = []; review.cursor = ''; }
  try {
    const page = await api(url);
    if (my !== runReview._seq || out !== $('#review-results')) return; // stale response
    const hits = review.loaded = review.loaded.concat(page.hits || []);
    review.cursor = page.cursor || '';
    let list = hits;
    if (review.staleOnly) list = list.filter(isStaleDraft);
    if (!list.length) {
      out.innerHTML = `<div class="empty">${review.staleOnly ? '放置された draft はありません。' : 'レビュー待ちの draft はありません。'}</div>`;
      return;
    }
    out.innerHTML = list.map(reviewCard).join('')
      + (review.cursor
        ? `<div class="truncation-note">Showing ${list.length} drafts ·
             <a href="#" id="review-more">load more</a></div>`
        : '');
    $('#review-more')?.addEventListener('click', e => { e.preventDefault(); runReview(true); });
    wireReviewActions(out);
  } catch (e) {
    if (my !== runReview._seq || out !== $('#review-results')) return;
    out.innerHTML = `<div class="error-banner">レビューキューを読み込めませんでした: ${esc(e.message)}</div>`;
  }
}

function reviewCard(h) {
  const u = h.usage || {};
  const tags = (h.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join(' ');
  const who = actorStr(h.created_by);
  const age = daysSince(h.created_at);
  const usageBits = (u.search_hits || u.fetches)
    ? `🔍 ${u.search_hits || 0} hits · fetched ${u.fetches || 0}`
    : 'no usage yet';
  const outcomeBits = (u.worked || u.failed)
    ? `${u.failed ? '⚠️ ' : ''}worked ${u.worked || 0} · failed ${u.failed || 0}`
    : '';
  const meta = [
    who ? esc(who) : '',
    age !== null ? 'created ' + esc(fmtAge(age)) : '',
    usageBits,
    outcomeBits,
  ].filter(Boolean).join(' · ');
  return `<article class="card" data-id="${esc(h.id)}" data-href="${entryHash(h)}">
    <div class="head">
      <span class="type-ico" title="${esc(h.type)}">${icon(h.type)}</span>
      <a class="title" href="${entryHash(h)}" title="ochakai://${esc(h.id)}">${esc(displayTitle(h))}</a>
      <span class="badge draft">draft</span>
      ${isStaleDraft(h) ? '<span class="badge" title="検索ヒット 0 で動きもない — 落とす候補">🕸️ stale</span>' : ''}
      ${tags}
      <span class="actions write-only" style="margin-left:auto;display:flex;gap:.45rem">
        <button class="btn small primary" data-act="verify">✓ 検証</button>
        <button class="btn small danger" data-act="reject">却下</button>
      </span>
    </div>
    <div class="meta">${meta}</div>
    ${h.description ? descHTML(h.description) : ''}
    ${cardThumbs(h)}
  </article>`;
}

function wireReviewActions(container) {
  container.querySelectorAll('[data-act]').forEach(btn => btn.addEventListener('click', async () => {
    const card = btn.closest('[data-id]');
    const id = card.dataset.id;
    // Both are rulings against the entry as it stands, so neither needs
    // the entry's current content — there is no full-replacement PUT here
    // to clobber a body edited since the queue loaded.
    try {
      if (btn.dataset.act === 'verify') {
        await verifyEntry(id);
        toast('Verified.');
      } else {
        const note = prompt('なぜ受け入れないのか?(裁定として残るので、エージェントは同じ提案を繰り返さなくなる)', '');
        if (note === null) return;
        await rejectEntry(id, note);
        toast('Rejected.');
      }
      refreshTree(); // the tree shows status badges (and hides rejected)
      runReview();
    } catch (e) { toast('Failed: ' + e.message); }
  }));
}

/* ============================== editor ============================== */

// Templates for a new entry, one per recommended type (design doc 0038),
// so a create starts from a shape rather than an empty textarea.
//
// The two halves are separated because they travel differently. REQUIRED
// is what the write path refuses the type without — an Attested
// Computation with no runtime is rejected by the server — so a type
// change carries it into a document somebody is already writing. SEED is
// illustrative: a sample parameter, a resource spelled out so a fresh
// template shows the shape. Pasting an example `year` parameter into a
// half-written document would be putting words in its writer's mouth,
// so seeds only ever open an empty one.
const TYPE_REQUIRED = {
  'Attested Computation': 'runtime: bigquery\n',
};
const TYPE_SEED = {
  'Attested Computation': 'parameters:\n    - name: year\n      type: integer\n      required: true\n',
  'BigQuery Dataset': 'resource: bigquery://project/dataset\n',
  'BigQuery Table': 'resource: bigquery://project/dataset/table\n',
  Reference: 'resource: https://example.com/the-original\n',
};

function templateDocument(type, title) {
  const extra = (TYPE_REQUIRED[type] || '') + (TYPE_SEED[type] || '');
  return '---\ntype: ' + type + '\n'
    + (title ? 'title: ' + JSON.stringify(title) + '\n' : '')
    + 'description: ""\nstatus: draft\n' + extra
    + '---\n\n';
}

// withType returns doc with its type line set, plus any key the new type
// is refused without and the document does not already name. Setting the
// type alone would hand back a document the server rejects — the one
// place a type is held to a schema is an Attested Computation's runtime
// (design doc 0036 §5) — and reporting success for that is worse than
// doing nothing, which is what this dropdown used to do.
//
// A key the writer already named is theirs, not the template's to
// overwrite. Keys the *previous* type wanted are left where they stand:
// no per-type rule rejects them, and removing a line its writer wrote is
// not this page's to do (design doc 0044 §2.1 is the same posture).
function withType(doc, type) {
  let out = withFrontmatterKey(doc, 'type', type);
  for (const req of (TYPE_REQUIRED[type] || '').split('\n')) {
    const i = req.indexOf(':');
    if (i < 0) continue;
    const key = req.slice(0, i);
    if (!new RegExp('^' + key + ':', 'm').test(out)) {
      out = withFrontmatterKey(out, key, req.slice(i + 2));
    }
  }
  return out;
}

// prefix (create only) seeds the ID field — the per-directory ＋
// in the tree routes here as #/new/<prefix>/.
//
// Editing is editing the document (design doc 0044). The row editors for
// sources and parameters are gone: filling them meant parsing YAML in the
// browser, and a hand-written parser whose failure mode is silently
// dropping a producer key is the one thing 0043 §3.6 had just decided
// against. What comes back instead is a parse check before save and a
// template per type.
async function viewEditor(id, prefix = '') {
  const editing = id !== null;
  let doc = templateDocument('Insight', '');
  let entryID = prefix;
  if (editing) {
    try {
      const v = await api(conceptURL(id));
      doc = v.document || '';
      entryID = v.id;
    } catch (e) {
      view.innerHTML = `<div class="error-banner">${esc(id)} を読み込めませんでした: ${esc(e.message)}</div>`;
      return;
    }
  }

  // The id is one field, the way the address is one string (design doc
  // 0016) and the way the Move panel already takes it. Its last segment
  // is the entry's name unless a title overrides it (design doc 0022).
  const idField = `
        <div class="field">
          <label class="top" for="e-id">ID</label>
          <input type="text" id="e-id" class="mono" value="${esc(entryID)}"
                 placeholder="sales/monthly-revenue"
                 ${editing ? 'disabled' : 'required'}>
          <div class="hint">${editing
            ? 'concept の置き場所(移動は concept のページから)。'
            : 'ディレクトリを「/」で区切ったフルパス。最後の区切りが concept の名前(例: 売上、monthly-revenue)。一緒に読まれるべきものは一緒に置く。'}</div>
        </div>`;

  view.innerHTML = `
    <div class="section-title">${editing ? `${esc(entryID)} を編集` : '新しいナレッジの concept'}</div>
    <form class="form" id="editor">
      <div class="row">
        ${idField}
        ${editing ? '' : `
        <div class="field">
          <label class="top" for="e-type">型</label>
          <select id="e-type">${KNOWN_TYPES.map(t =>
            `<option value="${t}"${t === 'Insight' ? ' selected' : ''}>${t}</option>`).join('')}</select>
          <div class="hint">Sets <code>type:</code> in the document below, with any key that type is refused without.
          ドキュメントを編集するまでは全体が入れ直され、編集した後はその行だけが変わります。
          保存されるのはこのドキュメントです。</div>
        </div>`}
      </div>
      <div class="field">
        <label class="top" for="e-doc">ドキュメント</label>
        <textarea id="e-doc" rows="26" class="mono" spellcheck="false" required>${esc(doc)}</textarea>
        <div class="hint">OKF frontmatter between <code>---</code> lines, then markdown.
        他の concept へは、そのパスへの markdown リンクで結ぶ — <code>[revenue](/metrics/revenue.md)</code> —
        and it becomes a link both ways. ochakai が定義していないキーは書いたまま保たれます。
        サーバーが持つキー(<code>generated</code>・<code>verified</code>・<code>created_by</code>)は
        are not yours to set and are ignored if present.</div>
      </div>
      <div id="editor-error"></div>
      <div class="toolbar" style="justify-content:flex-end">
        <a class="btn" href="${editing ? '#/k/' + idPath(entryID) : '#/search'}">キャンセル</a>
        <button class="btn primary write-only" type="submit">${editing ? 'Save' : 'Create'}</button>
      </div>
    </form>`;

  let dirty = false;
  $('#editor').addEventListener('input', () => { dirty = true; });
  const typeSel = $('#e-type');
  if (typeSel) {
    // Two modes, and the question that picks between them is the document
    // itself — not the form's dirty flag, which a <select> raises with its
    // own `input` before this `change` ever runs, so gating on it made the
    // dropdown do nothing at all, ever.
    //
    // Untouched, the document is still the one this seeded, and reseeding
    // it whole costs nothing. Written in, it is the writer's, so the
    // dropdown edits the type line and leaves the rest — the same line
    // edit the detail page's status change makes.
    let seeded = $('#e-doc').value;
    typeSel.addEventListener('change', () => {
      const doc = $('#e-doc').value;
      if (doc === seeded) {
        seeded = templateDocument(typeSel.value, '');
        $('#e-doc').value = seeded;
        return;
      }
      $('#e-doc').value = withType(doc, typeSel.value);
    });
  }
  window.onbeforeunload = () => (dirty ? '' : undefined);

  $('#editor').addEventListener('submit', async ev => {
    ev.preventDefault();
    const errBox = $('#editor-error');
    errBox.innerHTML = '';
    const entryId = editing ? entryID : $('#e-id').value.trim().replace(/^\/+|\/+$/g, '');
    if (!entryId) {
      errBox.innerHTML = '<div class="error-banner">ID は必須です。</div>';
      return;
    }
    const document_ = $('#e-doc').value;
    // Say what is wrong here rather than waiting for the 400. The server
    // stays the only judge of a document; this just saves a round trip on
    // the mistake a text editor makes most (design doc 0044 §2.3).
    if (!/^---\r?\n[\s\S]*?\r?\n---/.test(document_.trim())) {
      errBox.innerHTML = '<div class="error-banner">ドキュメントには YAML frontmatter が要ります: <code>---</code> の行、キー、そして閉じる <code>---</code> の行。</div>';
      return;
    }
    try {
      const saved = await api(conceptURL(entryId), {
        method: 'PUT', doc: document_, onlyIfAbsent: !editing,
      });
      dirty = false;
      toast(editing ? 'Saved.' : 'Created.');
      refreshTree();
      refreshQueues(); // an edit is what clears the past-expiry queue (design doc 0037 §2.2)
      location.hash = '#/k/' + idPath((saved && saved.id) || entryId);
      if (editing) route(); // hash may be unchanged; re-render
    } catch (e) {
      // The id is taken. This asked the sentence for as long as there
      // was nothing else to ask — and the sentence it matched is one the
      // server rewrote twice since, once to name what holds the id and
      // what to do about it. The condition arrives as a code now, on a
      // 412 rather than a 409 because the page writes with If-None-Match
      // and that is a precondition failing (design doc 0083).
      const dupLink = !editing && e.code === 'already_exists'
        ? ` — <a href="#/k/${idPath(entryId)}">view the existing ${esc(entryId)}</a> (edit it, or pick another ID)`
        : '';
      errBox.innerHTML = `<div class="error-banner">${editing ? 'Save' : 'Create'} failed: ${esc(e.message)}${dupLink}</div>`;
    }
  });
}

/* ============================== boot ============================== */

// The sidebar disclosure mirrors the filter bar: forced open on wide
// screens (its summary is hidden there), collapsed by default on mobile.
const sideDetails = $('#side-details');
sideDetails.open = matchMedia('(min-width: 801px)').matches;
matchMedia('(min-width: 801px)').addEventListener('change', e => { if (e.matches) sideDetails.open = true; });

// Desktop sidebar toggle — the collapsed choice persists per browser.
const shell = $('#shell');
if (localStorage.getItem('ochakai.sidebar') === 'collapsed') shell.classList.add('side-collapsed');
$('#side-toggle').addEventListener('click', () => {
  const collapsed = shell.classList.toggle('side-collapsed');
  localStorage.setItem('ochakai.sidebar', collapsed ? 'collapsed' : 'open');
});

refreshTree();
refreshQueues();
markSandbox();
route();
</script>
</body>
</html>
