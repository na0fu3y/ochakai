# Local development harness. ochakai itself targets Google Cloud
# (design doc 0003); this compose file exists for hacking on ochakai and
# trying it out — hence OCHAKAI_MODE=dev.
services:
  ochakai:
    image: ghcr.io/na0fu3y/ochakai:latest
    build:
      context: ..
    ports:
      # Loopback, not every interface. OCHAKAI_MODE=dev below authenticates
      # nobody and refuses nothing, so a published 8080 is an anonymous,
      # writable knowledge base offered to whatever network the machine is
      # on — a comment saying "local only" is not what keeps it local.
      # http://localhost:8080 is unchanged for whoever is running it.
      - "127.0.0.1:8080:8080"
    environment:
      OCHAKAI_DATABASE_URL: postgres://ochakai:ochakai@db:5432/ochakai?sslmode=disable
      OCHAKAI_MODE: dev # local only: all requests act as human:anonymous
      OCHAKAI_URL: http://localhost:8080 # read by client commands only; lets `exec ochakai /ochakai import ...` work with no Go toolchain
    volumes:
      - ../examples:/examples:ro
    depends_on:
      db:
        condition: service_healthy
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ochakai
      POSTGRES_PASSWORD: ochakai
      POSTGRES_DB: ochakai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ochakai"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
