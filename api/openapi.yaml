                        rejected: false
                        links:
                          - { target: metrics/revenue, text: Revenue }
                        content_hash: 15c8e3097b6d2a41f0c85b3ed729a4f6108c5d3b7e2a094f6c1b8d503a7e2f94
                        created_at: "2026-07-21T06:14:55.402881Z"
