  /api/v1/verify/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The entry's id; slashes are real path separators.
        schema: { type: string }
    post:
      operationId: verifyKnowledge
      summary: Record a verification against the entry as it stands
      description: >
        Appends the caller and the current time to the entry's
        verifications ledger, whether this is the first confirmation or
        the tenth re-check. Re-checking is why the endpoint exists: PUT
        writes nothing at all when the content is unchanged, so "checked
        again, still right" could not be recorded — and both review feeds
        (sort=verified_at, sort=failed) had no exit (design doc 0025 §6).
        It does not touch the document: the entry's status, updated_at and
        ETag all stay put, because confirming knowledge and publishing it
        are different acts (design doc 0043 §3.2). Promoting a draft to
        stable is a PUT.
        A rejection is cleared. Not an MCP tool: verification is the human
        ruling the write-back loop turns on. Lives at its own top-level
        path for the same reason /usage does — a suffix after the
        hierarchical id could be confused with an ID segment.
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
      responses:
        "200":
          description: The verified entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Knowledge" }
              examples:
                promoted:
                  summary: POST /api/v1/verify/insights/revenue-seasonality
                  description: >
                    A verification by the caller is appended. Nothing else
                    moves: the status is whatever the writer set, and
                    updated_at (the ETag, and OKF's generated.at) is
                    untouched, because the document did not change.
                  value:
                    type: Insight
                    id: insights/revenue-seasonality
                    title: Reading revenue month over month
                    description: Why a December spike and a January drop are normal.
                    tags: [finance]
                    status: stable
                    stale_after: "2027-01-31"
                    created_by: { kind: process, name: analyst@example.iam.gserviceaccount.com }
                    updated_by: { kind: process, name: analyst@example.iam.gserviceaccount.com }
                    verifications:
                      - by: { kind: human, name: tanaka@example.co.jp }
                        at: "2026-07-27T00:41:12.905337Z"
                    links:
                      - { target: metrics/revenue, text: Revenue }
                    body: |
                      [Revenue](/metrics/revenue.md) is seasonal: December runs
                      well above the trailing median and January falls back
                      below it.
                    created_at: "2026-07-21T06:14:55.402881Z"
                    updated_at: "2026-07-27T00:41:12.905337Z"
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/reject/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The entry's id; slashes are real path separators.
        schema: { type: string }
    post:
      operationId: rejectKnowledge
      summary: Record that an entry was reviewed and not accepted
      description: >
        Writes the caller, the time and the reason as the entry's live
        ruling, replacing any earlier one. Rejected entries drop out of
        searches that did not ask for them (rejected=true), which is how
        an agent checks whether a proposal was already turned down before
        making it again — the memory of no the write-back loop is built on
        (design doc 0001 §9.1).
        Like verify it is a ruling and not an edit: the document keeps its
        lifecycle status, its updated_at and its ETag (design doc 0043
        §3.3). Verifications are not cleared — somebody vouched for this
        and somebody later ruled against it is exactly the history worth
        keeping. Not an MCP tool.
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
      requestBody:
        required: false
        description: Omit the body entirely to reject without a stated reason.
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  description: Why it was not accepted, up to 2000 bytes.
            example: { note: "double-counts refunds; see policies/revenue-recognition" }
      responses:
        "200":
          description: The entry, carrying its new rejection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Knowledge" }
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: liftKnowledgeRejection
      summary: Withdraw a rejection
      description: >
        Deletes the live ruling, returning the entry to the ordinary pool.
        A 404 when the entry carries no rejection: lifting nothing is a
        mistake worth reporting rather than a silent success.
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
      responses:
        "200":
          description: The entry, with no rejection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Knowledge" }
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/usage/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The entry's id; slashes are real path separators.
        schema: { type: string }
    get:
      operationId: getKnowledgeUsage
      summary: Usage totals for one knowledge entry
      description: >
        How often the entry was actually used: appeared in search results,
        fetched individually, and how it was reported to have worked. The measure of
        the write-back loop — evidence for promoting drafts, and a staleness
        signal for verified entries that stopped being used.
      responses:
        "200":
          description: Usage totals.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
              examples:
                totals:
                  summary: GET /api/v1/usage/queries/monthly-revenue
                  description: >
                    search_hits and fetches are recorded by reads;
                    worked and failed only by report_outcome. An entry never
                    reported on has both at zero — which is not the same
                    signal as one that failed.
                  value:
                    search_hits: 412
                    fetches: 168
                    worked: 23
                    failed: 2
                    last_used_at: "2026-07-26T23:58:07.336114Z"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: reportOutcome
      summary: Report an outcome (worked/failed) for a knowledge entry
      description: >
        The last edge of the write-back loop: after acting on knowledge
        (running a golden query, running SQL written from an entry), report whether
        the result was correct. Reports feed the entry's usage totals;
        failed counts against verified entries flag them for
        re-verification. The caller's identity is recorded with each
        report; the optional note travels with the raw event.
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [worked, failed]
                  description: worked = acting on the entry gave a correct result; failed = wrong or unusable.
                note:
                  type: string
                  maxLength: 2000
                  description: What was run, what went wrong. Recorded with the raw event (pruned with it after 180 days).
            examples:
              worked:
                summary: The golden query gave the right answer
                value:
                  outcome: worked
                  note: Ran it for FY2025; the total matched the finance close to the yen.
              failed:
                summary: It did not
                description: >
                  A failed report against a verified entry puts it on the
                  re-verification feed (sort=failed), where it stays until
                  someone verifies it again.
                value:
                  outcome: failed
                  note: >-
                    Double-counts orders split across two shipments since the
                    2026-07 fulfilment change.
      responses:
        "200":
          description: Updated usage totals.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
              examples:
                afterReport:
                  summary: The totals with this report counted
                  value:
                    search_hits: 412
                    fetches: 168
                    worked: 23
                    failed: 3
                    last_used_at: "2026-07-27T02:07:44.291508Z"
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/revisions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The entry's id; slashes are real path separators.
        schema: { type: string }
    get:
      operationId: listKnowledgeRevisions
      summary: Change history for one knowledge entry
      description: >
        Every change — create, update, verify, delete, move, attach,
        detach — newest first, each with
        who made it, when, and the full snapshot as of that change — the
        read surface behind "every change kept as a revision". Works for
        soft-deleted entries too: the audit trail is most interesting
        exactly when the entry is gone.
      parameters:
        - name: limit
          in: query
          description: >
            Default 50, max 200. Out-of-range values fall back to the
            default; non-integer values are a 400.
          schema: { type: integer }
      responses:
        "200":
          description: Revisions, newest first (never empty — create writes rev 1).
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  revisions:
                    type: array
                    items: { $ref: "#/components/schemas/Revision" }
              examples:
                history:
                  summary: GET /api/v1/revisions/insights/revenue-seasonality
                  description: >
                    Newest first, and never empty — the create is rev 1. Each
                    revision carries the whole entry as it stood after that
