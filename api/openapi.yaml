openapi: 3.1.0
info:
  title: ochakai REST API
  description: >
    ochakai is a context provider for data agents: semantic models, metric
    definitions, verified golden queries, interpretation knowledge, glossary
    terms, dataset and table catalog entries, and references (mirrors of
    external material) in one knowledge base. The REST API is a superset
    of the MCP tools — the same operations plus bulk export, the
    human-facing reverse lookups, deletion, a concept's usage totals and
    file writes — so users can build their own web UIs. ochakai executes
    no SQL and uses no LLM.

    Why an operation is shaped the way it is, and what was considered and
    declined, is in the design records, cited below as "design doc NNNN":
    https://github.com/na0fu3y/ochakai/tree/main/docs/design


    **One address for an object.** A concept and a file are both objects
    of one bundle, and `/api/v1/bundle/{path}` is where they live — a
    concept at `<id>.md` (design doc 0075 §4). What is not an object of
    the bundle does not live there: a ranking is ochakai's own rather
    than something the bundle holds, so the list face is
    `/api/v1/search`, with `links_to=` and `source=` as its reverse
    lookups, and an archive is the bundle at a path
    (`Accept: application/gzip`, the root being the whole base).


    **An unrecognized query parameter is a 400, naming it** (design doc
    0064) — never a silent no-op. This is what makes it safe to add a
    parameter after the freeze: a client built against an older version
    of this contract finds out at the point of the call, rather than
    having the parameter quietly ignored. The one exception is `fm.`, and
    only on the one operation that declares `fm.{key}` below (search):
    there, its keys are validated against the concept's own OKF
    frontmatter (design doc 0074 §4) rather than against a fixed name list.
    Every other operation has no such downstream check and rejects `fm.*`
    like any other unrecognized parameter.

    **An unrecognized JSON body key is a 400, naming it** (design doc
    0064), the same rule applied to the body: `POST /api/v1/move`,
    `POST /api/v1/review/{id}`, `POST /api/v1/usage/{id}` and
    `PUT /api/v1/access` reject a key their schema does not declare.
    **The comparison is exact** (design doc 0125): `RULING` is not
    `ruling`, so it is an unrecognized key like any other.

    **A repeated JSON body key is a 400, naming it** (design doc 0125) —
    the sibling of the repeated query key below. A body may name each key
    once; `{"ruling":"verified","ruling":"rejected"}` has no answer that
    is what was asked, and answering for the last of them would decide
    silently which of the two the caller meant.


    **`Accept` is read as a set of names, not as a ranking** (design doc
    0064 §22). An address has one default representation and at most two
    media types that select another: `application/gzip` for the subtree
    under it, and the object's own alternative form (`application/json`
    for `index.md`, `log.md` and a file; `text/markdown` for a concept).
    Naming one selects it, `application/gzip` first where both are named;
    `*/*`, an unrecognized type and no header at all all leave the
    default. The comparison is on the media type alone — parameters are
    dropped and the match is case-insensitive, so
    `text/markdown; charset=utf-8` selects the document and
    `text/markdown-x` is simply a different type.

    **`q` is dropped with the other parameters, `q=0` included.** RFC 9110
    reads `q=0` as "not this one"; ochakai does not implement it, so
    `application/gzip;q=0` still gets the archive. This is written down
    rather than left to be discovered, because it is the one place
    ochakai knowingly answers a standard header by a rule of its own.

    **A repeated query key is a 400, naming it** (design doc 0064 §20.2) —
    unless the parameter is declared as an array, which is how a caller
    spells a set: `?type=Metric&type=Policy` asks for either, and `type`,
    `status`, `trust`, `tag` and `prefix` are the five that work this
    way. Every other key takes one value, and `?limit=10&limit=50` has no
    answer that is what was asked.

    **REST is frozen at `/api/v1`** (design doc 0064,
    docs/compatibility.md): this contract is the address list a client can
    hold onto, and the only thing that can still break it after this point
    is a security defect, shipped in the next release with no deprecation
    window (SECURITY.md). MCP, the CLI and the stored shape stay unstable
    while the major version is 0 and may still change in a minor release.
  version: 0.27.2
  license:
    name: MIT
servers:
  - url: /
security:
  - GoogleIDToken: []
  - {}
# Authentication is a bearer identity token, and which party verifies it
# is the deployment's choice (design doc 0086). On Cloud Run it is IAM:
# Google checks the token before a request reaches ochakai, and the
# process reads the claims IAM already vouched for. A deployment that
# names its own OIDC issuer (OCHAKAI_OIDC_ISSUER / OCHAKAI_OIDC_AUDIENCE)
# verifies signature, issuer, audience and expiry in-process against the
# issuer's published keys — still no secret to hold (design docs 0065 §1,
# 0003). Either way there is no authorization: the identity is read to
# record provenance, not to gate what a caller may do. The scheme below
# (components/securitySchemes/GoogleIDToken) documents the token; the
# empty alternative beside it is the anonymous postures — a deployment
# with OCHAKAI_MODE=public or dev answers with no Authorization header at
# all (design doc 0066 §1). A request that needs an identity and carries
# none the deployment can accept is a 401 from ochakai itself, in the
# same envelope as every other error here — declared on every operation
# (components/responses/Unauthorized). See
# docs/guides/rest-integration.md (Japanese) for a walkthrough of minting
# a token and what it takes to embed this API in your own service. An
# application on the delegator allowlist may forward the end user it
# acts for with Ochakai-On-Behalf-Of (design doc 0065 §3) — the header is
# honored on every call; it is declared below
# (components/parameters/OnBehalfOf) on the operations that record
# provenance.
paths:
  /api/v1/search:
    get:
      operationId: searchConcepts
      summary: Search knowledge (lexical, plus hybrid vector search when configured)
      description: >
        Rejected concepts are excluded unless rejected=true is passed (so
        agents can check for already-rejected proposals). Whether a concept
        was confirmed is asked with trust, independently of the status
        filter — status is the lifecycle value alone (design doc 0075
        §4.1).
        With sort=verified_at the endpoint lists concepts by verification age
        (oldest first, never-verified last) instead of searching — the feed
        for golden query canary runs (docs/guides/golden-query-canary.md).
        With sort=usage it lists by demand (most fetches first, never-read
        oldest-first at the bottom) and each hit carries its usage totals —
        the draft review/promotion feed.
        With sort=failed it lists concepts whose failure reports
        (report_outcome failed) are still unanswered, worst first, and each
        hit carries its usage totals — the re-verification feed. A concept
        drops out once it is verified after its last failure report
        (POST /api/v1/review/{id} with ruling: verified), so a base that
        is kept up shows an empty feed.
        With sort=stale_after it lists concepts whose author declared a
        stale_after that has now passed, most overdue first — the feed for
        knowledge dated by whoever wrote it (design doc 0069 §2.2).
        Concepts whose expiry has not come due are not listed. Unlike the
        two feeds above, verifying does not clear this one: the date is
        the writer's declaration, so a concept leaves only when someone
        edits it to declare a new expiry (or removes the declaration).
        Exactly one of q and sort is required: combining them is a 400,
        and so is omitting both (searching needs a query to rank by).
        source and prefix are filters rather than modes, so they compose
        with either.
        A listing — any sort, or source with no q — pages: it answers
        with a cursor when more concepts follow, and walks past the limit
        one page at a time (design doc 0068 §2.1). A search does not: it is
        bounded by limit, and passing a cursor with q is a 400.
      parameters:
        - name: q
          in: query
          description: Search text. Required unless sort is set.
          schema: { type: string }
        - name: sort
          in: query
          description: Mutually exclusive with q.
          schema: { type: string, enum: [verified_at, usage, failed, stale_after] }
        - name: type
          in: query
          schema: { type: array, items: { $ref: "#/components/schemas/Type" } }
          explode: true
        - name: status
          in: query
          schema: { type: array, items: { $ref: "#/components/schemas/Status" } }
          explode: true
        - name: trust
          in: query
          description: >
            Filter by who confirmed the concept — OKF's own trust tiers
            (SPEC §5.3), derived from the verification ledger. Repeatable
            and OR-ed, so "anything somebody confirmed" is two values.
            Omit to leave the question unasked. Independent of status: a
            draft may be human-reviewed and a stable concept unverified
            (SPEC §§5.3-5.4).
          schema: { type: array, items: { $ref: "#/components/schemas/Trust" } }
          explode: true
        - name: fm.{key}
          in: query
          description: >
            Filter by an OKF frontmatter key, exactly:
            `fm.resource=bigquery://p.d.t` finds the concepts whose
            frontmatter names that resource, matching a scalar or a
            member of a list. Repeat with different keys to AND them.

            A value is text, and one that spells a number or a boolean
            also matches the typed value a document wrote: YAML types
            frontmatter, so `fm.required=true` finds `required: true` and
            `fm.usage_count=5` finds `usage_count: 5`, as well as the
            concepts that quoted them. Text that only looks numeric stays
            text — `fm.code=007` finds `code: "007"`.

            This is the filter that does not need a migration. A key OKF
            adds in a later version is askable as soon as ochakai knows
            the spelling: the whole frontmatter is indexed, so there is
            no column to add and no data to move (design doc 0074
            §4). Exact match and list membership are the only two
            comparisons: ranges and boolean expressions are the doorway
            to a query language, and what ochakai returns is knowledge
            rather than rows.

            The filter vocabulary is OKF's, and `fm.` carries the OKF
            keys nothing else asks about: `attester`, `computation`,
            `description`, `executor`, `parameters`, `resource`,
            `runtime`, `title`, `usage_window`. A key a producer
            invented is stored and handed back exactly as written (SPEC
            §4.1) but is not part of the query vocabulary — including
            the two ochakai itself writes into a bundle, `id` and
            `status_note`, which OKF does not define. `fm.type`,
            `fm.status`, `fm.tags`, `fm.sources` and `fm.stale_after`
            are read through columns that answer a different question —
            `status=stable` matches a document that says nothing, since
            OKF's default is stable, and `fm.status` never would. Use
            `type`, `status`, `tag`, `source` and `sort=stale_after`
            for those. Everything else is a 400 (design doc 0074 §4).
          schema: { type: string }
        - name: rejected
          in: query
          description: >
            true to list only concepts a human turned down. Omitted, or
            false, keeps them out of results — asking for them is opt-in,
            which is how an agent checks whether a proposal was already
            rejected.
          schema: { type: boolean }
        - name: tag
          in: query
          schema: { type: array, items: { type: string } }
          explode: true
        - name: source
          in: query
          description: >
            Only concepts citing this resource — the reverse of
            sources[].resource, for "this material changed, what derives
            from it?" (design doc 0069 §2.3). Matched exactly: no prefix
            or substring matching, and sources[].id is not consulted
            because it keys a document's own footnotes rather than
            identifying an artifact across concepts. Single-valued, unlike
            tag. Composes with q and with any sort.
          schema: { type: string }
        - name: links_to
          in: query
          description: >
            Only concepts whose body links at this id — the reverse edge
            of links (design doc 0074 §2): the insight that explains a
            metric links to the metric, not the other way round. This is
            what `/api/v1/backlinks/{id}` was, folded into the face that
            already had the other reverse lookup (design doc 0075 §4).
            A single concept's read carries the head of this same answer
            as its `linked_from` rows (design doc 0106).

            Single-valued, like source. Composes with q and with any
            sort; on its own it lists in address order and answers with a
            cursor, which the endpoint it replaces could not do. Rejected
            concepts are excluded unless `rejected=true`, as everywhere
            else — the endpoint it replaces did not exclude them.
          schema: { type: string }
        - name: prefix
          in: query
          description: >
            Only concepts addressed under this path. An id is an address
            (design doc 0075 §2), so this scopes a search to a subtree:
            prefix=metrics covers metrics itself and everything under
            metrics/, and does not match metrics-legacy/churn — matching
            is on segment boundaries, not raw string prefixes (design doc
            0075 §6). A trailing slash is optional and the empty value
            is the root, which narrows nothing. Repeatable and OR-ed,
            unlike source: "my team's scope and the company-wide one" is
            the ordinary question, and two calls would produce two
            rankings that cannot be merged. Composes with q and with any
            sort. This is a filter, not an access control — any caller may
            pass any prefix, and passing none returns the whole base
            (design doc 0065 §1).
          schema: { type: array, items: { type: string } }
          explode: true
          # A path is segments joined by "/", so the separator travels
          # literally rather than percent-encoded — as it does for the
          # path of GET /api/v1/bundle/{path}.
          allowReserved: true
        - name: limit
          in: query
          description: >
            Searching: default 10, max 50. With any sort the feed reads
            more per page:
            default 100, max 1000. 0 or absent is the default; anything
            else outside that range is a 400, the same as a non-integer
            value (design doc 0064).

            For a listing this bounds the page, not the answer — walk the
            rest with cursor.
          schema: { type: integer }
        - name: cursor
          in: query
          description: >
            Resume a listing where the previous page ended: pass back the
            cursor that page returned, with the same sort and the same
            filters (design doc 0068 §2.1). Listings are the sort feeds
            and the source lookup — the modes with a total order to
            resume from.

            The value is opaque: it carries the position in that order
            and nothing else. One from a different listing is a 400, and
            so is one this server did not hand out. The filters are not
            in it, so changing them mid-walk asks a new question from an
            old position.

            **A search refuses it with a 400.** Relevance is a fused
            window rather than an order, so a ranking has no page two:
            50 hits are the whole contract, and the way past them is a
            narrower question (design doc 0068 §2.2).

            A cursor is a position, not a snapshot. The feeds are live,
            so a concept that moves while you walk may be missed or seen
            twice; what a cursor promises is that the listing does not
            stop at a cap.
          schema: { type: string }
      responses:
        "200":
          description: >
            Scored hits, verified concepts boosted. With sort=verified_at,
            hits are in verification-age order and carry score 0. With
            sort=usage or sort=failed, hits carry score 0 and each
            populates the usage object (demand order, resp. worst-failed
            first).

            A listing carries cursor when more concepts follow this page.
            Its absence is the end of the listing — that is the only
            count given, since an exact one over a filtered feed costs a
            second scan of it (design doc 0068 §2.1).
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits:
                    type: array
                    items: { $ref: "#/components/schemas/SearchHit" }
                  cursor:
                    type: string
                    description: >
                      Where the next page of this listing resumes. Absent
                      on the last page, and on every search.
                  degraded:
                    type: boolean
                    enum: [true]
                    description: >
                      This ranking is worse than this deployment
                      ordinarily gives: the query could not be embedded,
                      so only the lexical list ranked it and a concept
                      that matches by meaning rather than by word is
                      missing from `hits` (design doc 0114). Present only
                      when that happened — a deployment with no embedder
                      configured ranks lexically every time, which is its
                      answer rather than a fallback from one, and never
                      sets this. A listing never sets it either: there is
                      no query to embed.
                required: [hits]
              examples:
                search:
                  summary: GET /api/v1/search?q=monthly+revenue&limit=3
                  description: >
                    A hit names a concept and says what ranked it; it does
                    not hand the concept over. Read the ones worth reading
                    with GET /api/v1/bundle/{id}.md.
                    File metadata rides along (filled in one batch),
                    which is what lets a UI render thumbnails from a search.
                  value:
                    hits:
                      - id: queries/monthly-revenue
                        type: Attested Computation
                        description: Monthly net revenue for the last 12 complete months.
                        tags: [finance]
                        status: stable
                        trust: human-reviewed
                        verified_at: "2026-07-10T01:52:16.774301Z"
