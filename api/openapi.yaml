  /api/v1/attachments/{path}:
    parameters:
      - name: path
        in: path
        required: true
        description: >
          "{id}/{name}" — the entry's id (its bundle path) followed by
          the attachment filename. The final segment is always the
          filename; everything before it is the id
          (PUT /api/v1/attachments/insights/revenue-reading/weekly.png).
        schema: { type: string }
    put:
      operationId: putAttachment
      summary: Attach a file to a knowledge entry
      description: >
        Stores the raw request body as an attachment, replacing any
        attachment of the same name (kept as a revision). The media type
        is sniffed from the bytes — png, jpeg, webp, pdf, and plain
        text are accepted (never text/html or image/svg+xml: they can
        carry scripts), at most 5 MiB and 20 attachments per entry.
        Reference the file from the entry's markdown body
        (`![baseline](<id last segment>/weekly.png)` or
        `[seeds](<id last segment>/seeds.txt)`) so it is findable and
        survives OKF export/import (design docs 0008, 0013). Requires the
        server to have GCS configured (OCHAKAI_GCS_BUCKET); without it
        the request fails with 501.
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
        - name: okf_path
          in: query
          required: false
          description: >
            Bundle path a foreign OKF import carried this file at
            (clean, bundle-relative). Export writes the file back there
            so the original body links keep working. Omit for
            attachments born in ochakai.
          schema: { type: string }
      requestBody:
        required: true
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Attachment metadata (bytes are fetched with GET).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
              examples:
                stored:
                  summary: PUT /api/v1/attachments/metrics/revenue/revenue-2026h1.png
                  description: >
                    The media type was sniffed from the bytes, not taken from
                    the request. sha256 is the content address and the ETag a
                    later GET answers If-None-Match with.
                  value:
                    name: revenue-2026h1.png
                    media_type: image/png
                    size: 48213
                    sha256: 9f2c1d0a7b3e5648c1d9f0a2b7e4c8d63f5a1b2c9e0d7a4f6b3c8e1d5a0f7b29
                    created_by: { kind: human, name: tanaka@example.co.jp }
                    created_at: "2026-06-02T04:20:11.663210Z"
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
    get:
      operationId: getAttachment
      summary: Fetch attachment bytes
      description: >
        Returns the file bytes with the stored (sniffed) media type; the
        ETag is the content's SHA-256, and a matching If-None-Match gets
        a 304 answered from metadata alone (no blob read, so repeat
        renders in a UI cost nothing). Cache-Control is private,
        no-cache: names are mutable (replace-by-name), so clients
        revalidate every time. Fetching the bytes records a usage event
        against the owning entry; a 304 revalidation does not.
      responses:
        "200":
          description: The attachment bytes.
          content:
            "*/*":
              schema: { type: string, format: binary }
        "304": { description: Not modified (If-None-Match matched the content hash). }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAttachment
      summary: Detach a file from a knowledge entry
      description: >
        Removes the attachment (kept as a revision; the content-addressed
        bytes remain referenced by history).
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
      responses:
        "204": { description: Detached. }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/export:
    get:
      operationId: exportOKF
      summary: Export the knowledge base as an OKF bundle
      description: >
        Streams a tar.gz of the whole knowledge base in Open Knowledge
        Format (markdown + YAML frontmatter, one concept per entry, with
        index.md files), attachment files included. Your knowledge is
        yours.


        Written as it is read — indexes first, then entries in batches,
        then one attachment at a time — so the server never holds the
        whole bundle in memory. Because the response starts before the
        last file is read, a failure mid-export can only truncate the
        stream: verify a backup by reading the archive, not by the status
        code. The server logs every such failure at error level, naming
        the file it stopped on.


        There is no matching import endpoint, and that is deliberate
        (design doc 0015 §3.2): importing a bundle is a loop over the
        endpoints already here, so a server-side version would add a
        second path to the same outcome without adding a capability.
        To write your own importer against any OKF bundle: walk the
        tar.gz, POST each `<id>.md` to /api/v1/knowledge (PUT to
        /api/v1/knowledge/{id} if it exists), and PUT each non-markdown
        file to /api/v1/attachments/{id}/{name}, attributing it to the
        entry whose directory it sits in or whose body links to it.
        `index.md` files are generated on export and are not entries.
        Frontmatter keys the server owns — `generated`, `verified`,
        `created_by`, `rejected_by`, `rejected_at`, and the pre-v0.2
        spellings `timestamp` / `verified_by` / `verified_at` — are
        ignored on write; provenance comes from the caller's identity
        (design docs 0009, 0036 §3.2). The one exception is that the
        presence of a `verified` key decides how OKF's `stable` status
        maps onto ochakai's (design doc 0036 §3.4). `ochakai import` is
        exactly this loop.
      parameters:
        - name: attachments
          in: query
          description: >
            `false` exports the markdown only. Attachment bytes live in
            GCS, so a periodic backup can copy them from there directly
            instead of pulling them through this endpoint. A value that
            is neither `true` nor `false` is a 400.
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: OKF bundle.
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/reembed:
    post:
      operationId: reembedKnowledge
      summary: Embed entries that have no vector for the configured model
      description: >
        Vectors are written when an entry is written, so a knowledge base
        loaded before `OCHAKAI_VERTEX_PROJECT` was set has none, and
        hybrid search stays quietly lexical-only until every entry
        happens to be rewritten. Changing the embedding model has the
        same shape: the old vectors sit in a space nothing queries any
        more (design doc 0020). This fills the gap.


        Attachment vectors are covered too: only `attach` writes them, so
        a corpus loaded before semantic search — or one whose embedding
        tables were dropped to change dimensions — has files that are
        findable by name alone until this runs. Entries go first and
        attachments fill the rest of the pass.


        Bounded per call — repeat while `missing` is above zero, passing
        the previous response's `cursor` back each time; the CLI
        (`ochakai reembed`) does that for you. One item is one call to
        the embedding provider and the calls are sequential, so the
        default pass is sized to finish well inside a request timeout
        (Cloud Run's default is 300s); raise `limit` only if you know
        yours. A provider failure on one item is counted, not fatal. 501
        when semantic search is not configured.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 200, maximum: 5000 }
        - name: cursor
          in: query
          description: >
            Resume position from a previous response. Omit to start from
            the beginning. Without it, a pass whose every item the
            provider refuses returns the same window forever and the rest
            of the corpus is never attempted.
          schema: { type: string }
      responses:
        "200":
          description: What the pass did.
          content:
            application/json:
              schema:
                type: object
                properties:
                  embedded:
                    description: Knowledge entries embedded by this pass.
                    type: integer
                  attachments:
                    description: Attachments embedded by this pass.
                    type: integer
                  failed: { type: integer }
                  missing:
                    description: >
                      Entries and attachments still unembedded once the
                      pass was over — counted after the fact, so items
                      this pass failed on are included.
                    type: integer
                  cursor:
                    description: >
                      Where the next pass resumes. Absent once nothing is
                      missing; unchanged from the one sent in means the
                      corpus is exhausted and what remains only fails.
                    type: string
              examples:
                partial:
                  summary: A pass with work still left
                  description: >
                    missing is above zero, so call again with this cursor.
                    The cursor is opaque — it carries the entry and the
                    attachment position in one token; pass it back unchanged
                    rather than parsing it.
                  value:
                    embedded: 200
                    attachments: 0
                    failed: 0
                    missing: 613
                    cursor: "metrics/revenue\u0000"
                done:
                  summary: The last pass
                  description: Nothing is missing, so no cursor comes back.
                  value:
                    embedded: 13
                    attachments: 4
                    failed: 0
                    missing: 0
        "400": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
components:
  headers:
    ETag:
      description: >
        The entry's version — its updated_at in RFC3339Nano, quoted. A
        client echoes it in If-Match on a later update to write only if
        nothing changed meanwhile (design doc 0030).
      schema: { type: string }
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >
        Optimistic-concurrency precondition (design doc 0030): the
        entry's version — its updated_at in RFC3339Nano, as a prior read
        or write returned it in the ETag response header (quotes
        optional; the JSON body's updated_at field is the same value).
        Every response carrying an entry carries the header. The write
        happens only if the entry still has this version; an entry
        changed since it was read is a 412 and nothing is written.
        Absent or "*" means no precondition — last write wins. A value
        that is neither is a 400.
      schema: { type: string }
    OnBehalfOf:
      name: X-Ochakai-On-Behalf-Of
      in: header
      required: false
      description: >
        Delegated end-user identity (design doc 0027): "kind:identity",
        kind human or agent, no whitespace in the identity, at most 320
        bytes — e.g. "human:tanaka@example.co.jp". An application on the
        delegator allowlist (OCHAKAI_DELEGATING_CALLERS) forwards who it
        is acting for; the forwarded identity is recorded as the actor
        and the caller is kept as Actor.via — never dropped. A caller
        not permitted to delegate is a 403 and a malformed value a 400 —
        an error, not a silent downgrade, and in the same JSON envelope
        as every other error here, so the message reaches the caller.
        Honored on every call; declared on the operations that record
        provenance.
      schema: { type: string, maxLength: 320 }
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
  schemas:
    Type:
      type: string
      description: >
        The OKF type vocabulary, verbatim — the built-ins (Semantic Model,
        Metric, Golden Query, Attested Computation, Insight, Glossary Term,
        BigQuery Dataset, BigQuery Table, Reference) are recommendations,
        not a closed set, and no server behavior hangs off any of them
        (design docs 0023, 0028 §3, 0036 §3.6). Any
        single-line value works as a type; OKF registers no taxonomy, so
        the spelling is the meaning and it round-trips unchanged. Matching
        is case-insensitive; the spelling you write is the one stored.
      examples: [Semantic Model, Metric, Golden Query, Attested Computation, Insight, Glossary Term, BigQuery Dataset, BigQuery Table, Reference, Data Contract]
      pattern: "^[^/\\r\\n]{1,128}$"
    Status:
      type: string
      description: >
        deprecated means "was correct, no longer recommended"; rejected
        means "was never accepted" — the record keeps agents from
        re-proposing the same knowledge.
      enum: [draft, verified, deprecated, rejected]
    Actor:
      type: object
      description: >
        Who acted. Resolved from the caller's Google identity, never from
        the request payload (design doc 0009).
      properties:
        kind: { type: string, enum: [human, agent] }
        name: { type: string }
        via:
          description: >
            The delegating caller, when an application forwarded an end
            user's identity with X-Ochakai-On-Behalf-Of (design doc
            0027) — e.g. "agent:app@project.iam.gserviceaccount.com" on
            an entry whose actor is the person who used that application.
            Absent when the caller acted as itself. Recorded rather than
            replaced: a write made through an application must stay
            distinguishable from one the person made directly.
          type: string
    Link:
      type: object
      description: >
        An edge to another entry, derived from a markdown link in the body.
        Links are untyped: OKF SPEC §5 leaves the kind of relationship to the
        surrounding prose.
      properties:
        target: { type: string, description: The target entry's id (its bundle path). }
        text:
          type: string
          description: >
            The anchor text the body used. Absent for a bare ochakai:// reference,
            in which case the target's last segment reads as the name.
    UsageWindow:
      type: object
      description: >
        The date range a set of usage_count values was counted over (OKF
        SPEC §5.1). "5000 uses" means nothing without it. ochakai records
        the window and never computes or checks one.
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
    Source:
      type: object
      description: >
        One piece of external material an entry derives from (OKF SPEC
        §5.1, design doc 0036). ochakai records sources: it never fetches
        resource, checks that it resolves, or turns the credibility signals
        into a score — §5.1 leaves weighing raw signals to the consumer.
        The spec's keys are modeled exhaustively; a key OKF does not define
        is dropped on bundle import with a note.
      required: [resource]
      properties:
        resource:
          type: string
          description: >
            The artifact this cites — an external URL, a bundle-relative
            path, or a scope descriptor. Required: a source that names no
            artifact is not a citation.
        id:
          type: string
          description: >
            Stable key for per-claim attribution — markdown footnotes in
            body cite it (e.g. "[^rev-policy]").
        title: { type: string, description: Human-readable label. }
        author:
          type: string
          description: Who produced the source, in the actor convention (SPEC §7). The source's author, not the entry's.
        usage_count:
          type: integer
          minimum: 0
          description: >
            How often the source was exercised over the usage window — a
            liveness signal. Absent and 0 differ on purpose: no count at
            all versus a source exercised zero times. Unrelated to
            ochakai's own usage totals, which count reads of the entry
            rather than uses of the source; the two are never converted.
        last_modified: { type: string, format: date, description: When the source itself last changed (YYYY-MM-DD). }
        usage_window:
          allOf: [{ $ref: "#/components/schemas/UsageWindow" }]
          description: Overrides the entry's usage_window for this source.
    Parameter:
      type: object
      description: >
        One declared input of an Attested Computation (OKF SPEC §10.2). An
        agent supplies parameter values; authoring or editing the
        computation itself is not its to do — a rule for the consumer
        running it, which ochakai records rather than enforces.
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, description: "The parameter's data type, e.g. integer or string." }
        required: { type: boolean, description: Absent and false mean the same thing. }
    Executor:
      type: object
      description: >
        How an Attested Computation is run, and what a run must hand back
        as evidence (OKF SPEC §10.2). ochakai stores this and never runs
        it: executing the computation and checking the receipt belong to
        the consumer (SPEC §10.5, design docs 0001, 0036 §5).
      required: [resource, receipt]
      properties:
        resource: { type: string, description: Path to the run instructions or code. }
        receipt:
          type: array
          items: { type: string }
          description: "The fields a run must return as evidence, e.g. [job_id, executed_sql, result]."
    Attester:
      type: object
      description: >
        The deterministic, LLM-free checker that a run was performed
        correctly (OKF SPEC §10.2). As with Executor, ochakai records the
        path and never executes it.
      required: [resource]
      properties:
        resource: { type: string, description: Path to the attester code. }
    Knowledge:
      type: object
      required: [type, id]
      properties:
        type: { $ref: "#/components/schemas/Type" }
        id:
          type: string
          description: >
            The entry's bundle path — where it lives (the type says what
            it is): path segments separated by "/", the OKF concept ID
            (design docs 0016, 0019). OKF prescribes no character set,
            so only path safety constrains segments: no leading ".",
            no control characters, at most 128 bytes each (512 total).
            The final segment must not be "index" or "log"
            (OKF-reserved filenames). Stored NFC-normalized, as are
            link targets and attachment names (design doc 0022).
          pattern: "^[^./][^/]{0,127}(/[^./][^/]{0,127})*$"
        title:
          type: string
          description: >
            Display-name override; optional (design doc 0022). When
            empty or omitted, the id's last segment (the filename) is
            the entry's name.
        description: { type: string }
        resource:
          type: string
          description: >
            Canonical URI of the underlying asset (OKF recommended key): the
            table/dataset URI, or for references the external source URL.
            Empty for abstract concepts.
        tags: { type: array, items: { type: string } }
        sources:
          type: array
          items: { $ref: "#/components/schemas/Source" }
          description: >
            The external material this entry derives from (OKF SPEC §5.1).
            Writable, unlike links: a PUT is a full replacement, so an
            omitted sources clears them. Give each source an id and body
            footnotes can attribute single claims to it.
        usage_window:
          allOf: [{ $ref: "#/components/schemas/UsageWindow" }]
          description: The range the sources' usage_count values were counted over. Individual sources may override it.
        status: { $ref: "#/components/schemas/Status" }
        status_note:
          type: string
          description: Free-form reason for the current status (why rejected/deprecated).
        stale_after:
          type: string
          format: date
          description: >
            Absolute date (YYYY-MM-DD) on and after which the entry is
            stale — OKF's lifecycle date (SPEC §5.5, design doc 0036
            §3.9). A date rather than a TTL so staleness is a plain
            comparison against today. Advisory: nothing hides a stale
            entry and search ranking never reads it — a passed date means
            due for a re-check, not wrong. The one surface that reads it
            is sort=stale_after, the feed of entries whose declared date
            has passed (design doc 0037 §2.1).
        runtime:
          type: string
          description: >
            The execution environment of an Attested Computation — e.g.
            bigquery, postgres, dbt, python (OKF SPEC §10.2). It is what
            gives the parameters their meaning, so it is required when the
            type is "Attested Computation" and free to be empty otherwise:
            the one place ochakai holds a type to a schema (design doc
            0036 §3.4).
        parameters:
          type: array
          items: { $ref: "#/components/schemas/Parameter" }
          description: The inputs an agent may fill in when running the computation.
        computation:
          type: string
          description: >
            Path to the file holding the computation. Empty means the
            computation is inline, in body's "# Computation" fence
            (SPEC §10.6).
        executor: { $ref: "#/components/schemas/Executor" }
        attester: { $ref: "#/components/schemas/Attester" }
        created_by: { $ref: "#/components/schemas/Actor", readOnly: true }
        updated_by:
          allOf: [{ $ref: "#/components/schemas/Actor" }]
          readOnly: true
          description: >
            Who last changed the content — exported as OKF's
            generated.by (design doc 0036 §3.3). Not created_by: after
            somebody else edits an entry, the creator is no longer who
            the content stands by. Verifying does not change it.
        verified_by: { $ref: "#/components/schemas/Actor", readOnly: true }
        verified_at: { type: string, format: date-time, readOnly: true }
        rejected_by: { $ref: "#/components/schemas/Actor", readOnly: true }
        rejected_at: { type: string, format: date-time, readOnly: true }
        links:
          type: array
          items: { $ref: "#/components/schemas/Link" }
          readOnly: true
          description: >
            Derived from the markdown links in body, recomputed on every write —
            sending links has no effect. Bundle-absolute (/metrics/revenue.md),
            relative (./revenue.md), and ochakai:// targets are all read;
            http(s) URLs and non-.md files are not (the latter are attachments).
        attrs:
          type: object
          description: >
            Producer-defined extension keys (OKF SPEC §4.1) — e.g.
            question/sql for a Golden Query, spec for a Semantic Model.
            Kept verbatim and written back at the top level of the exported
            frontmatter. Every key OKF v0.2 itself defines is a field of
            its own above; naming one here is rejected rather than stored
            where nothing reads it (design doc 0036 §3.5).
        body:
          type: string
          description: >
            Markdown body. Links to other entries live here: write a markdown link
            to the target's path and it becomes an edge, and a backlink the other way.
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
          readOnly: true
          description: >
            Attachment metadata (no bytes — fetch them via
            /api/v1/attachments/{id}/{name}). Managed through the
            attachment endpoints, never through create/update payloads.
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    Attachment:
      type: object
      description: >
        A file attached to a knowledge entry — a dashboard screenshot, an
        ER diagram, a seeds file (design docs 0008, 0013). Metadata
        travels with the entry; bytes are a separate, deliberate fetch so
        agent context is never flooded with base64.
      properties:
        name: { type: string, description: Filename, unique within the entry. }
        media_type: { type: string, enum: [image/png, image/jpeg, image/webp, application/pdf, text/plain] }
        size: { type: integer }
        sha256: { type: string, description: Content hash; attachments are content-addressed and immutable. }
        okf_path:
          type: string
          description: >
            Bundle path a foreign OKF import carried this file at; export
            writes it back there so body links keep working. Absent for
            attachments born in ochakai (exported to "<id>/<name>").
        created_by: { $ref: "#/components/schemas/Actor", readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
    Usage:
      type: object
      properties:
        search_hits: { type: integer, description: Times the entry appeared in search results. }
        fetches: { type: integer, description: Times the entry was fetched individually. }
        worked: { type: integer, description: Outcome reports saying the entry led to a correct result. }
        failed: { type: integer, description: Outcome reports saying the entry led to a wrong or unusable result. }
        last_used_at: { type: string, format: date-time }
    SearchHit:
      description: >
        One search or listing result. REST hits carry attachment
        metadata (filled in batch) so UIs can render image previews
        without a fetch per entry; MCP search results omit it to keep
        agent context lean (design doc 0015).
      allOf:
        - $ref: "#/components/schemas/Knowledge"
        - type: object
          properties:
            score: { type: number }
            usage:
              allOf: [ { $ref: "#/components/schemas/Usage" } ]
              readOnly: true
              description: >
                Usage totals, present in the sort=usage listing (the draft
                review feed) and the sort=failed listing (the re-verification
                feed); absent for search results and the verified_at feed.
    ContextRank:
      type: object
      description: >
        One hit's place in the ranking behind a context pack. The knowledge
        itself travels once, under `entries` — a rank that repeated it would
        double the response and leave the byte budget governing one of the
        copies (design doc 0033). Search results keep their full hits: there
        the entries are the answer, not a duplicate of one.
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/Type" }
        title:
          description: The display title — the entry's own, or its filename.
          type: string
        status: { $ref: "#/components/schemas/Status" }
        score: { type: number }
    ContextOutline:
      type: object
      description: >
        An entry a context pack could not afford to deliver in full:
        enough to decide whether to spend a round trip fetching it by id,
        and nothing more.
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/Type" }
        title:
          description: The display title — the entry's own, or its filename.
          type: string
        description: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        bytes:
          description: What the full entry would have cost.
          type: integer
    Revision:
      type: object
      description: >
        One entry in a knowledge entry's change history: who changed it,
        how, when, and the full snapshot as of that change.
      properties:
        rev: { type: integer, description: 1-based, monotonically increasing per entry. }
        change: { type: string, enum: [create, update, verify, delete, move, attach, detach] }
        changed_by: { $ref: "#/components/schemas/Actor" }
        changed_at: { type: string, format: date-time }
        snapshot: { $ref: "#/components/schemas/Knowledge" }
