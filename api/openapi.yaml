openapi: 3.1.0
info:
  title: ochakai REST API
  description: >
    ochakai is a context provider for data agents: semantic models, metric
    definitions, verified golden queries, interpretation knowledge, glossary
    terms, dataset and table catalog entries, and references (mirrors of
    external material) in one knowledge base. The REST API is a superset
    of the MCP tools — the same operations plus bulk export, the
    human-facing browse/revisions/backlinks reads, and attachment writes —
    so users can build their own web UIs. ochakai executes no SQL and uses
    no LLM.
  version: 0.15.0
  license:
    name: MIT
servers:
  - url: /
# Authentication is Cloud Run IAM (Google identity), handled by the
# infrastructure before requests reach ochakai — there is no
# application-level auth scheme. ochakai reads the forwarded identity
# only to record provenance (design docs 0002/0003). An application on
# the delegator allowlist may forward the end user it acts for with
# X-Ochakai-On-Behalf-Of (design doc 0027) — the header is honored on
# every call; it is declared below (components/parameters/OnBehalfOf)
# on the operations that record provenance.
paths:
  /api/v1/knowledge:
    get:
      operationId: searchKnowledge
      summary: Search knowledge (lexical, plus hybrid vector search when configured)
      description: >
        Rejected entries are excluded unless rejected=true is passed (so
        agents can check for already-rejected proposals). Whether an entry
        was confirmed is asked with verified, independently of the status
        filter — status is the lifecycle value alone (design doc 0043
        §§3.2-3.3).
        With sort=verified_at the endpoint lists entries by verification age
        (oldest first, never-verified last) instead of searching — the feed
        for golden query canary runs (docs/guides/golden-query-canary.md).
        With sort=usage it lists by demand (most search_hits first, never-used
        oldest-first at the bottom) and each hit carries its usage totals —
        the draft review/promotion feed.
        With sort=failed it lists entries whose failure reports
        (report_outcome failed) are still unanswered, worst first, and each
        hit carries its usage totals — the re-verification feed. An entry
        drops out once it is verified after its last failure report
        (POST /api/v1/verify/{id}), so a base that is kept up shows an
        empty feed.
        With sort=stale_after it lists entries whose author declared a
        stale_after that has now passed, most overdue first — the feed for
        knowledge dated by whoever wrote it (design doc 0037 §2.1).
        Entries whose expiry has not come due are not listed. Unlike the
        two feeds above, verifying does not clear this one: the date is
        the writer's declaration, so an entry leaves only when someone
        edits it to declare a new expiry (or removes the declaration).
        Exactly one of q and sort is required: combining them is a 400,
        and so is omitting both (searching needs a query to rank by).
        source and prefix are filters rather than modes, so they compose
        with either.
      parameters:
        - name: q
          in: query
          description: Search text. Required unless sort is set.
          schema: { type: string }
        - name: sort
          in: query
          description: Mutually exclusive with q.
          schema: { type: string, enum: [verified_at, usage, failed, stale_after] }
        - name: type
          in: query
          schema: { type: array, items: { $ref: "#/components/schemas/Type" } }
          explode: true
        - name: status
          in: query
          schema: { type: array, items: { $ref: "#/components/schemas/Status" } }
          explode: true
        - name: trust
          in: query
          description: >
            Filter by who confirmed the entry — OKF's own trust tiers
            (SPEC §5.3), derived from the verification ledger. Repeatable
            and OR-ed, so "anything somebody confirmed" is two values.
            Omit to leave the question unasked. Independent of status: a
            draft may be human-reviewed and a stable entry unverified
            (SPEC §§5.3-5.4).
          schema: { type: array, items: { $ref: "#/components/schemas/Trust" } }
          explode: true
        - name: fm.{key}
          in: query
          description: >
            Filter by any frontmatter key, exactly: `fm.owner=finance`
            finds the entries whose frontmatter says owner is finance,
            matching a scalar or a member of a list. Repeat with
            different keys to AND them.

            This is the filter that does not need a release. A key OKF
            adds in a later version, or one a producer invented, is
            askable the day somebody writes it — the whole frontmatter is
            indexed, not the subset ochakai happens to name (design doc
            0046 §3.11). Exact match and list membership are the only two
            comparisons: ranges and boolean expressions are the doorway
            to a query language, and what ochakai returns is knowledge
            rather than rows.
          schema: { type: string }
        - name: rejected
          in: query
          description: >
            true to list only entries a human turned down. Omitted, or
            false, keeps them out of results — asking for them is opt-in,
            which is how an agent checks whether a proposal was already
            rejected.
          schema: { type: boolean }
        - name: tag
          in: query
          schema: { type: array, items: { type: string } }
          explode: true
        - name: source
          in: query
          description: >
            Only entries citing this resource — the reverse of
            sources[].resource, for "this material changed, what derives
            from it?" (design doc 0037 §2.3). Matched exactly: no prefix
            or substring matching, and sources[].id is not consulted
            because it keys a document's own footnotes rather than
            identifying an artifact across entries. Single-valued, unlike
            tag. Composes with q and with any sort.
          schema: { type: string }
        - name: prefix
          in: query
          description: >
            Only entries addressed under this path. An id is an address
            (design doc 0017), so this scopes a search to a subtree:
            prefix=metrics covers metrics itself and everything under
            metrics/, and does not match metrics-legacy/churn — matching
            is on segment boundaries, not raw string prefixes (design doc
            0041 §2.2). A trailing slash is optional and the empty value
            is the root, which narrows nothing. Repeatable and OR-ed,
            unlike source: "my team's scope and the company-wide one" is
            the ordinary question, and two calls would produce two
            rankings that cannot be merged. Composes with q and with any
            sort. This is a filter, not an access control — any caller may
            pass any prefix, and passing none returns the whole base
            (design doc 0002).
          schema: { type: array, items: { type: string } }
          explode: true
          # A path is segments joined by "/", so the separator travels
          # literally rather than percent-encoded — as it does for the
          # prefix of GET /api/v1/browse.
          allowReserved: true
        - name: limit
          in: query
          description: >
            Searching: default 10, max 50. With any sort the feed reads
            more per page:
            default 100, max 1000. Out-of-range values fall back to the
            default; non-integer values are a 400.
          schema: { type: integer }
      responses:
        "200":
          description: >
            Scored hits, verified entries boosted. With sort=verified_at,
            hits are in verification-age order and carry score 0. With
            sort=usage or sort=failed, hits carry score 0 and each
            populates the usage object (demand order, resp. worst-failed
            first).
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits:
                    type: array
                    items: { $ref: "#/components/schemas/SearchHit" }
              examples:
                search:
                  summary: GET /api/v1/knowledge?q=monthly+revenue&limit=3
                  description: >
                    A hit names an entry and says what ranked it; it does
                    not hand the entry over. Read the ones worth reading
                    with GET /api/v1/knowledge/{id}, or ask
                    GET /api/v1/context for the documents behind the top
                    hits in one call.
                    Attachment metadata rides along (filled in one batch),
                    which is what lets a UI render thumbnails from a search.
                  value:
                    hits:
                      - id: queries/monthly-revenue
                        type: Attested Computation
                        title: monthly-revenue
                        description: Monthly net revenue for the last 12 complete months.
                        tags: [finance]
                        status: stable
                        trust: human-reviewed
                        verified_at: "2026-07-10T01:52:16.774301Z"
                        rejected: false
                        links:
                          - { target: metrics/revenue, text: Revenue }
                        content_hash: 4d1f0a86c3b25e97d0a41f6b8c2e5307ab9d4f61c8e30257ba9f1d6c4e820b73
                        created_at: "2026-06-09T07:41:02.110945Z"
                        updated_at: "2026-07-10T01:52:16.774301Z"
                        score: 1.35
                      - id: metrics/revenue
                        type: Metric
                        title: Revenue
                        description: Net revenue from completed orders, excluding tax and shipping.
                        resource: bigquery://example-analytics.shop.orders
                        tags: [finance, core]
                        status: stable
                        stale_after: "2026-12-31"
                        trust: human-reviewed
                        verified_at: "2026-07-14T02:33:41.019778Z"
                        rejected: false
                        links:
                          - { target: glossary/completed-order, text: completed order }
                          - { target: tables/shop-orders, text: shop.orders }
                        content_hash: 8a3b71c0e5d24f96b1c8027ae4f35d6098b2c7e14d0a6f38b5c9e207d1a4f6b3
                        created_at: "2026-06-02T04:11:38.201044Z"
                        updated_at: "2026-07-14T02:33:41.019778Z"
                        attachments:
