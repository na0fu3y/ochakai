  /api/v1/backlinks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The entry's id; slashes are real path separators.
        schema: { type: string }
    get:
      operationId: listKnowledgeBacklinks
      summary: Entries whose links point at this entry
      description: >
        The reverse edge of links, most recently updated first: the insight
        that explains a metric links to the metric, not the other way
        round. get_context already follows this edge when packing
        companions; here it is exposed directly so UIs can show
        "linked from" next to an entry's own links. An entry with no
        backlinks returns an empty list (the target entry itself is not
        checked for existence).
      parameters:
        - name: limit
          in: query
          description: >
            Default 20, max 100. Out-of-range values fall back to the
            default; non-integer values are a 400.
          schema: { type: integer }
      responses:
        "200":
          description: Live entries linking to this one, most recently updated first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/Knowledge" }
              examples:
                linkedFrom:
                  summary: GET /api/v1/backlinks/metrics/revenue
                  description: >
                    The reverse edge: the insight and the golden query name
                    the metric in their bodies, so they link to it. The metric
                    does not link back — which is why a UI has to ask for this
                    side separately.
                  value:
                    entries:
                      - type: Insight
                        id: insights/revenue-seasonality
                        title: Reading revenue month over month
                        description: Why a December spike and a January drop are normal.
