  /api/v1/bundle/{path}:
    parameters:
      - name: path
        in: path
        required: true
        description: >
          The object's bundle path — "metrics/revenue.md",
          "metrics/revenue/chart.png", or a reserved "index.md" /
          "metrics/log.md". Slashes are real path separators.

          **The empty path is the bundle itself**: `/api/v1/bundle/`
          with `Accept: application/gzip` is the archive of everything,
          and with `Accept: application/json` the root `index.md` is at
          `/api/v1/bundle/index.md`. A path template parameter cannot
          be written as empty in OpenAPI, so this is said here rather
          than in the path — as with the slashes above, the prose is as
          precise as the format allows.

          **`.md` is mandatory and is part of a concept's bundle path**
          (design doc 0064), not a representation selector: dropping it
          does not fall back to `Accept: text/markdown` on the same
          concept, it stops finding the concept at all. `id` (used bare
          by `/api/v1/review/{id}` and `/api/v1/usage/{id}`) and
          `Summary.id` are the identifiers that are always bare — `.md`
          is never part of an id. `File.path` is bare in the sense of
          being a file's own real path, not in the sense of never
          carrying `.md`. `Change.path` is **not** bare either: it is
          the object's bundle path (see `BundleLog` above), and for a
          concept that includes `.md` the same way this address does.
          A single-target operation (this one, `/api/v1/review/{id}`,
          `/api/v1/usage/{id}`) addresses its concept with a path
          segment; `/api/v1/move`, which names two, addresses both in
          the body instead — not a second inconsistency, but the shape
          a two-target operation has to take.
        schema: { type: string }
    get:
      operationId: getBundlePath
      summary: Read what is at a bundle path
      description: >
        One object at its bundle path (design doc 0075 §4): a concept
        at `<id>.md`, a file at its own path, or one of the two names OKF
        reserves per directory — which are generated from the bundle
        rather than stored in it (design doc 0075 §4.2).

        A concept answers with a View, or with the document itself
        under `Accept: text/markdown`, and carries the ETag to echo back
        in `If-Match` on a later write.

        A file answers with its bytes, its content hash as the ETag, a
        `304` when `If-None-Match` matches it, and the headers that
        decide what a browser may do with them: an image, a PDF or plain
        text renders in place, everything else is a download under
        `Content-Security-Policy: sandbox`, and `nosniff` is always set
        (design doc 0075 §1).

        **`Accept: application/gzip` reads the path as a subtree** and
        streams it as an OKF bundle: a tar.gz of markdown + YAML
        frontmatter, the generated `index.md` and `log.md` of every
        directory, and every file under the path — including one no
        concept shows, because what enters the bundle leaves it (design
        doc 0075 §1). The history travels with it: each generated
        `log.md` inside the archive carries its newest 1000 lines, the
        same bound the address itself serves, and an import never reads
        it back. The root (`/api/v1/bundle/`) is the whole knowledge
        base. Your knowledge is yours.

        A path is a subtree or it is not: a concept's or a file's own
        address — `metrics/revenue.md` as much as a reserved name — is
        409, not an empty archive with a 200 on it, because nothing lives
        under an object's own address (design doc 0064 §4).

        Paths inside the archive are not re-rooted: an archive of
        `metrics/` carries `metrics/revenue.md` and imports back to where
        it came from, because this is a copy of a subtree rather than a
        move of one.


        **An archive of a subtree says it is one**, in the two places
        its reader meets it (design doc 0127): the root `index.md`
        carries `bundle_scope` in its frontmatter and a sentence naming
        what is missing, and the `Content-Disposition` filename is
        `ochakai-okf-<subtree>.tar.gz` rather than `ochakai-okf.tar.gz`.
        A subtree spelled outside ASCII is percent-encoded there and
        carried unescaped in `filename*` (RFC 6266), so the name never
        folds away to `ochakai-okf-.tar.gz` or to a wider subtree's.
        Deeper `index.md` files are unchanged — what a subtree archive
        lacks is above them, not below. A whole-base archive is exactly
        what it was.


        **Who may take it**: the whole bundle (the root) is an
        administrator's, and a subtree belongs to whoever may read it
        (design docs 0109 §3, 0127). A path outside the caller's read
        scope answers 404, as every other read of it does. Refusing a
        subtree bought nothing once the archive stopped being mistakable
        for a backup of the base: it carries what its caller could
        already fetch one concept at a time.

        Written as it is read — indexes first, then concepts in batches,
        then one file at a time — so the server never holds the whole
        bundle in memory. Because the response starts before the last
        file is read, a failure mid-archive can only truncate the stream:
        verify a backup by reading the archive, not by the status code.
        The server logs every such failure at error level, naming the
        file it stopped on.

        There is no matching import endpoint (design doc 0067 §5.2).
        To write your own importer against any OKF bundle: walk the
        tar.gz and PUT every member to `/api/v1/bundle/{path}` at the
        path it arrived at. One address takes both kinds — the bytes
        decide which — so there is nothing to attribute and nothing to
        route. `index.md` files are generated and are not concepts.
        Frontmatter keys the server owns
        — `generated`, `verified`, `created_by`, `rejected_by`,
        `rejected_at`, `rejected_note`, and the pre-v0.2 spellings
        `timestamp` / `verified_by` / `verified_at` — are ignored on
        write; provenance comes from the caller's identity (design docs
        0009, 0075 §3.1).
        There is no exception: a document's own `verified` key changes
        nothing about the write — it is kept under `received:` as the
        writer's claim, and this instance's trust ledger never reads it.

        `index.md` is one level of the tree — the subdirectories directly
        under the path, each with the count of concepts beneath, plus the
        concepts at that level (design doc 0075 §4.2). Rejected and
        deleted concepts are excluded, as in search; a level caps at 1000
        with truncated=true; listing records no usage.

        `log.md` is the update history under the path, newest first and
        grouped by date, as SPEC §9 writes one. It publishes an instance
        ledger: an import never reads it back, the same way it never
        reads back `generated` (design doc 0009). `limit` bounds it
        (default and maximum 1000).

        The representation follows Accept. `application/json` returns the
        listing or the changes; anything else returns the file the path
        names — two representations of one thing, at one address.

        **The JSON listing pages.** A level is a total order, so
        `index.md` read as JSON takes a `cursor` and hands back the next
        one until the level runs out (design docs 0068 §2.1, 0101). The
        page size is the server's, unchanged at 1000 rows of each kind,
        so a caller that fits under it sees what it has always seen —
        what has changed is that a wider directory can now be walked
        instead of ending at `truncated: true`. The document form does
        not page: SPEC §8 gives index.md no way to say "continued", so it
        keeps the truncation note and the JSON is where the walk lives.

        **`?history` is the ledger of the one object at this path**
        (design doc 0075 §4) — the history of a concept or of a file,
        because a revision is an event about an object and the ledger is
        keyed by path. A concept's carries each revision's whole
        document, so a diff between two revisions is a text diff; a
        file's carries the changes alone, having no document to carry.
        404 when nothing ever happened at the path.

        **It answers JSON whatever the Accept says** (design doc 0102).
        SPEC §9 defines one markdown history — the reserved `log.md`
        beside the objects — and this address used to render a second one
        from the same rows, which is what left one `?history&limit=500`
        with two answers. The format's own spelling is the one that
        stays; the ledger as structure is what has no place in it.

        PUT and DELETE against the two reserved names are 409: a
        generated file is not one anybody writes.
      parameters:
        - name: history
          in: query
          description: >
            The log.md of the object at this path rather than the object
            itself — its own changes, newest first (design doc 0075
            §4). Presence is the whole of it — `?history` — and a
            value is ignored, the way `Accept` decides a representation
            without being asked a question. A directory's history is the
            reserved `log.md` beside it. Combined with
            `Accept: application/gzip` it is a 400 rather than the
            archive silently winning: the two address different objects
            — this object's own history, not the archive's subtree
            (design doc 0064 §2).
          schema: { type: string }
          allowEmptyValue: true
        - name: limit
          in: query
          description: >
            log.md and ?history only — maximum rows, and a 400 naming
            the mode when sent anywhere else on this address (design doc
            0064 §2). A concept's own `?history` is 50 by default and 200
            at most: each row carries the whole document as it stood at
            that revision, so 1000 of them is the knowledge base several
            times over. log.md and a file's `?history` carry no document
            and are 1000 by default and at most (design doc 0064 §14.1).

            Each of the two now has one answer. Until design doc 0102 the
            same `?history&limit=500` on a concept was a 400 as JSON and a
            200 as markdown, because the markdown rendering read the
            other limit.
          schema: { type: integer }
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: cursor
          in: query
          description: >
            `index.md` as JSON only — resume the level where the previous
            page ended, and a 400 naming the mode anywhere else on this
            address, the document form included (design doc 0101). A page
            with rows behind it carries `cursor` in `BundleListing`; its
            absence is how a caller learns the level is done, which is the
            only count a listing gives (design doc 0068 §2.1). It is
            opaque, belongs to the directory it was issued for — one from
            another level is a 400 — and carries no filter, because a
            level has none.
          schema: { type: string }
        - name: files
          in: query
          description: >
            `Accept: application/gzip` only — `false` archives the
            markdown without any file bytes. They live in GCS, so a
            periodic backup can copy them from there directly instead of
            pulling them through here. A value that is neither `true` nor
            `false` is a 400, and so is sending it without
            `Accept: application/gzip` (design doc 0064 §2).
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: >
            The object: a concept's document or View, a file's bytes or
            (`Accept: application/json`) its metadata, a generated file
            and its structured form, or — under
            `Accept: application/gzip` — the subtree at this path as an
            OKF bundle.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
            ETag: { $ref: "#/components/headers/ETag" }
            Content-Disposition:
              description: Files and archives — inline for an image, a PDF or plain text; attachment otherwise (design doc 0075 §1).
              schema: { type: string }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" }
            Content-Security-Policy: { $ref: "#/components/headers/Sandbox" }
          content:
            application/gzip:
              schema: { type: string, format: binary, description: The subtree at this path as an OKF bundle. }
            "*/*":
              schema: { type: string, format: binary, description: A file's bytes, under the media type sniffed when it was stored. }
            text/markdown:
              schema: { type: string }
              example: |
                # metrics

                * [Revenue](revenue.md) - Net revenue from completed orders.
                * [Churn](churn.md) - Monthly logo churn.
            application/json:
              schema:
                description: >
                  Which shape arrives is decided by the path and the
                  query, not by a parameter of its own: a concept
                  answers with its View, `index.md` with the listing,
                  `log.md` with the history, `?history` on an object
                  with its revisions, a file with its metadata (design
                  doc 0064) — the only address that answers a file's
                  `sha256` without its bytes.

                  `anyOf` rather than `oneOf` because the five are not
                  disjoint as schemas — a listing level with no
                  subdirectories and no concepts is `{}`, which every
                  object satisfies. The path is the discriminator, and
                  it is one no JSON Schema keyword can read.
                anyOf:
                  - $ref: "#/components/schemas/View"
                  - $ref: "#/components/schemas/BundleListing"
                  - $ref: "#/components/schemas/BundleLog"
                  - $ref: "#/components/schemas/ObjectHistory"
                  - $ref: "#/components/schemas/File"
              examples:
                root:
                  summary: "GET /api/v1/bundle/index.md (Accept: application/json)"
                  description: The top-level segments of the ID hierarchy, with the concept count beneath each.
                  value:
                    dirs:
                      - { name: glossary, count: 18 }
                      - { name: insights, count: 24 }
                      - { name: metrics, count: 31 }
                      - { name: queries, count: 57 }
                      - { name: tables, count: 96 }
                level:
                  summary: "GET /api/v1/bundle/metrics/index.md (Accept: application/json)"
                  description: >
                    One level down. The projection carries no body — a
                    directory listing renders from the description.
                  value:
                    concepts:
                      - type: Metric
                        id: metrics/average-order-value
                        description: Revenue divided by completed orders, over the same window.
                        status: stable
                        updated_at: "2026-07-02T05:26:44.712009Z"
                      - type: Metric
                        id: metrics/revenue
                        title: Revenue
                        description: Net revenue from completed orders, excluding tax and shipping.
                        status: stable
                        updated_at: "2026-07-14T02:33:41.019778Z"
                log:
                  summary: "GET /api/v1/bundle/metrics/log.md (Accept: application/json)"
                  description: >
                    The other reserved name, as structure rather than as
                    SPEC §9 prose: what changed under the path, newest
                    first. Each row names its object by **path**, because
                    a revision is an event about an object and a file has
                    no concept id (design doc 0075 §1). The documents
                    are not here — a directory's history carrying every
                    past version of everything under it would be the
                    knowledge base several times over. `?history` on the
                    object is where those are.
                  value:
                    changes:
                      - path: metrics/revenue.md
                        title: Revenue
                        change: verify
                        changed_by: { kind: human, name: sato@example.co.jp }
                        changed_at: "2026-07-14T02:33:41.019778Z"
                      - path: metrics/revenue/chart.png
                        change: create
                        changed_by: { kind: human, name: sato@example.co.jp }
                        changed_at: "2026-07-13T11:02:07.401221Z"
                history:
                  summary: "GET /api/v1/bundle/metrics/revenue.md?history (Accept: application/json)"
                  description: >
                    One object's own history, at the object's own address
                    (design doc 0075 §4). A concept's carries the whole
                    concept as it stood at each change, so a diff between
                    two revisions is a text diff. A *file's* carries the
                    changes alone in the shape above, having no document
                    to carry. Which shape comes back is the address's
                    answer, since a `.md` holds a concept and nothing else
                    (design doc 0100).
                  value:
                    revisions:
                      - rev: 4
                        change: verify
                        changed_by: { kind: human, name: sato@example.co.jp }
                        changed_at: "2026-07-14T02:33:41.019778Z"
                        document: |
                          ---
                          type: Metric
                          title: Revenue
                          description: Net revenue from completed orders, excluding tax and shipping.
                          status: stable
                          ---

                          Revenue is the sum of `net_amount` over every
                          completed order.
        "304":
          description: >
            Not modified — a concept or a file whose If-None-Match
            matched its content hash (design doc 0064 §14.2: a concept
            answered this GET's `If-None-Match` parameter with a 200
            always, until now).
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501":
          description: >
            A file was asked for on an instance that holds no files
            (no OCHAKAI_GCS_BUCKET, design doc 0075 §1). Only for a path
            that is not a concept's: at `<id>.md` the answer is the
            concept's own 404, because what was asked about is the
            concept and not the deployment.

            An archive answers 501 for the same reason without a file
            having been named: the bundle under the requested path holds
            files, and one that omitted them would be a backup missing
            what it claims to carry. `?files=false` asks for the concepts
            alone and succeeds.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [unsupported] }
                required: [error, code]
              example:
                error: "files are not supported without GCS: set OCHAKAI_GCS_BUCKET (design doc 0013)"
                code: unsupported
        "409":
          description: >
            The path was read as a thing it is not. A reserved name was
            read as something other than the file it is: as an archive
            (`Accept: application/gzip`), or as an object's own
            `?history`. Both read the path as a thing the bundle stores —
            a directory to walk, an object with events — and a generated
            file is neither (design doc 0075 §4.2). The same refusal
            PUT and DELETE make at these two names, for the same reason.
            Reading the file itself is a 200: that is what generating it
            is for.

            The same status answers `Accept: application/gzip` on a
            concept's or a file's own address: dots are legal inside a
            path segment, so an object's address — `metrics/revenue.md`
            as much as a reserved name — normalizes as a legal, empty
            subtree unless it is refused here. Reading the object itself
            is still a 200; only reading it as an archive is refused.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [invalid] }
                required: [error, code]
              example:
                error: >
                  index.md is generated from the bundle, not stored in it
                  (design doc 0046 §§3.7-3.8), so there is no subtree here
                  to archive; ask the directory it sits in
                code: invalid
        "404":
          description: No object at this path.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [not_found] }
                required: [error, code]
              example:
                error: no object at this path
                code: not_found
        "405": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    put:
      operationId: putBundlePath
      summary: Write one object of the bundle
      description: >
        Stores the request body at the path (design doc 0075 §4). What
        it becomes is decided by the path, not by a parameter and not by
        the bytes (design doc 0100):

        A markdown path is a concept's address. OKF SPEC §3.1 says every
        non-reserved `.md` in a bundle is a concept document and §11 makes
        frontmatter with a non-empty `type` the condition of conformance,
        so a body with no `type` is a 400 here rather than a file stored
        at that address — write it at a path that does not end in `.md`.
        The write is create-or-replace and states what the concept should
        say; existence is expressed by the preconditions instead
        (`If-None-Match: *` for "only if the path is free", `If-Match` for
        "only if it still says this" — design doc 0030), and a body that
        matched what was stored answers `Ochakai-Unchanged`. A JSON body
        is a 415 naming the document form: the frontmatter is the
        metadata and the markdown is the body, and there is no typed
        write surface beside the format.

        Every other path is a file's, and its bytes are stored as they
        arrived. A markdown file is one of them — it just cannot be
        called `.md`.

        index.md and log.md are 409: they are generated from the bundle,
        so a write there is a conflict with what the address is.

        Writing a file needs the server to have GCS configured
        (OCHAKAI_GCS_BUCKET); without it an instance stores concepts and
        nothing else, and a write that is not a concept is a 501 (design
        doc 0075 §1). A concept is unaffected.

        `dry_run=true` asks what the write would do and stores nothing
        (design doc 0074 §5). Everything else is the same call — the same
        body, the same validation, the same read of what is there, the
        same 400s and 403s and 501s, the same `Ochakai-Note` headers —
        and the answer is `Ochakai-Plan`. Because it is the write path
        answering, a caller gating a sync on the dry run meets the same
        verdict when it writes for real; a caller that re-derived the
        verdict from its own copy of the bundle did not. The response is
        always 200 (nothing was created, so there is no 201) and carries
        no ETag (nothing was written, so there is no version to
        precondition on). Not accepted on DELETE, where it is a 400: a
        delete has no plan beside it, and ignoring the parameter would
        remove an object for a caller who believed they were asking.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/OnBehalfOf"
        - $ref: "#/components/parameters/Producer"
        - name: dry_run
          in: query
          description: >
            Answer with what the write would do, and store nothing. `true`
            or `false`; anything else is a 400 rather than a write,
            because the one wrong outcome here is writing for a caller who
            asked what would happen.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        description: >
          The bytes to store. They are the whole of what the object
          becomes: there is no typed write surface beside the format, and
          no parameter that overrides them.

          `text/markdown` is a concept — an OKF document, frontmatter and
          body. `application/octet-stream` is a file. The server accepts
          any other media type as a file too and records none of them:
          what a file is stored under is sniffed from the bytes, not
          taken from this header, because it is the header a caller most
          often gets wrong and a bundle has to serve what it holds. Those
          two are the spellings this contract names, and a generated
          client that sends one of them is always right.

          The media type follows the path: a `.md` address takes
          `text/markdown` and nothing else may be stored there, so
          `application/json` at one is a 415 naming the document form and
          `application/octet-stream` is a 400.
        content:
          text/markdown:
            schema: { type: string }
            example: |
              ---
              type: Metric
              title: Revenue
              description: Net revenue from completed orders, excluding tax and shipping.
              status: stable
              ---

              Revenue is the sum of `net_amount` over every completed order.
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: >
            The object as stored — a View for a concept, file metadata
            otherwise. With `dry_run=true`, the object as the write would
            have left it, and `Ochakai-Plan` says which write that was.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Ochakai-Note: { $ref: "#/components/headers/Note" }
            Ochakai-Plan: { $ref: "#/components/headers/Plan" }
            Ochakai-Unchanged:
              description: Concepts only — the payload matched what was stored, so nothing was written.
              schema: { type: string, enum: ["true"] }
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/View"
                  - $ref: "#/components/schemas/File"
            text/markdown:
              schema: { type: string }
        "201":
          description: >
            The path held nothing before this write — a concept (design
            doc 0064: a file answers 201 on creation too, matching this).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Ochakai-Note: { $ref: "#/components/headers/Note" }
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/View"
                  - $ref: "#/components/schemas/File"
            text/markdown:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: >
            `If-Match` named a version at a path where no concept lives.
            A precondition names a version, and a version the caller read
            cannot belong to a concept that does not exist, so the
            conditional write is an update and there is nothing to
            update. **404 rather than the 412 RFC 9110 prescribes**, and
            deliberately: 412 would conflate "it changed" with "it is
            gone", which are different things to a caller deciding
            whether to re-read or to create. Without `If-Match` this PUT
            creates, so this response cannot arise (design doc 0064
            §20.5).
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [not_found] }
                required: [error, code]
        "412":
          description: >
            An If-Match or If-None-Match "*" precondition failed — the
            concept changed since it was read, or (design doc 0064,
            matching RFC 9110) the path was already occupied when
            If-None-Match "*" asked for a create only. The code says
            which: `precondition_failed` for a stale `If-Match`,
            `already_exists` for the occupied path (design doc 0083).
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [already_exists, precondition_failed] }
                required: [error, code]
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
        "409":
          description: >
            A generated file is not one anybody writes — and an address
            already taken by the other kind of object is not free: a
            file PUT to a path where a live concept sits (or a concept
            PUT to a path a file holds) answers 409 naming which. The
            code says which: `invalid` for the reserved name,
            `already_exists` for the occupied address.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [already_exists, invalid] }
                required: [error, code]
              example:
                error: index.md is generated from the bundle, not stored in it (design doc 0046 §§3.7-3.8)
                code: invalid
        "405": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteBundlePath
      summary: Delete one object of the bundle
      description: >
        Removes the object at the path: a concept is soft-deleted — it
        disappears from reads, its history stays, and writing the same
        path revives it — and a file is removed (its bytes stay, named by
        the revisions that came before). index.md and log.md are 409 for
        the same reason PUT gives.

        With `purge=true` a concept that is *already* soft-deleted is
        hard-deleted instead: concept, revisions, usage and file metadata
        erased, the path freed for a move. Two calls, deliberately: the
        first is reversible, the second is not. Purging a live concept is
        a 409; delete it first. Content-addressed bytes are left in the
        blob store and nothing reclaims them afterwards. The purge itself
        is recorded — who destroyed which id, and how much history went
        with it — in the one table a purge does not touch (design doc
        0031). A file has no tombstone, so the parameter is a concept's:
        at a file's path it changes nothing and the file is removed, the
        way it is without the parameter. A 404 there would say a file was
        gone while it was still being served.

        **`If-Match` is honored on a concept** (design doc 0064, the same
        precondition PUT already took, design doc 0030): a stale version
        is a 412 and nothing is deleted. It is not honored on `purge=true`
        — purge is already the second, deliberate call in a two-step
        sequence, and asking for a fresh ETag on it would tax the common
        case with a round trip 0030 §3.5 avoids elsewhere — and a file has
        no version to precondition on, so the header is ignored there the
        way it is ignored on a bare-file GET.
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
        - $ref: "#/components/parameters/Producer"
        - $ref: "#/components/parameters/IfMatch"
        - name: purge
          in: query
          description: >
            Hard-delete an already soft-deleted concept. `true` or
            `false`; anything else is a 400 rather than a soft delete,
            because a 204 for a value meant as a purge would report a
            path freed that is not.
          schema: { type: boolean, default: false }
      responses:
        "204":
          description: Deleted.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: >
            Nothing lives at the path — whether the id never existed or
            was already deleted; the two are not distinguished (design doc
            0064). Repeating a DELETE therefore answers 404 the second
            time, deliberately: the end state (nothing live there) is the
            same either way, so retrying blindly stays safe.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [not_found] }
                required: [error, code]
        "409":
          description: >
            Two conditions, and the code says which: a generated file is
            not one anybody deletes (`invalid`), or `purge=true` named a
            concept that is still live — destruction takes the two steps
            design doc 0031 requires, delete before purge (`not_deleted`).
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [invalid, not_deleted] }
                required: [error, code]
        "412":
          description: >
            If-Match named a version the concept no longer has (design doc
            0064) — nothing was deleted.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [precondition_failed] }
                required: [error, code]
        "405": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/frontmatter:
    post:
      operationId: editFrontmatter
      summary: Read a document's frontmatter as structure, and write keys back into it
      description: >
        The structured face of an OKF document (design doc 0130 §3,
        which carries the reasoning). It takes a document and hands one
        back, reading its frontmatter as JSON on the way — and it stores
        nothing: no id, no ETag, no precondition. The concept is still
        the document, and this is a function over one. What it is for is
        a form, and both halves of one — parsing the YAML a producer
        wrote, and rendering YAML a person will read in a diff — are the
        format's business, so both are here rather than in a client.

        **A read** is a body with only `document`. The answer carries
        the same document back, `keys` in the order the document itself
        carries them (JSON objects have none), and `values`, the
        frontmatter mapping decoded to the shapes JSON has. Values are
        what YAML said: no envelope, no defaults filled in, no type
        coerced, a producer's extension key beside the ones the spec
        defines (SPEC §4.1), and a date in the spelling its writer used.

        **A write** adds `set` and `unset`. Each named key is replaced
        in place — its whole block, found by parsing rather than by
        scanning for `key:` at the start of a line — or removed, or
        appended when the document does not carry it. **Every other byte
        stays where it was**: key order, comments, blank lines, the
        quoting of every value the caller did not name, and the body.
        The answer's `values` are read back out of the document that is
        going back, not out of the values that went in, so a caller
        drawing a form and a caller storing the text cannot disagree
        about what a value became on the way through YAML.

        **The keys this instance owns are refused** — `generated`,
        `verified`, `created_by`, `rejected_*` and the pre-v0.2
        spellings — in `set` and in `unset` alike, with a 400 rather
        than a write nothing would read (design doc 0009). They are
        absent from a stored document, so a read never shows them.

        Nothing is stored, so a read-only deployment answers it. Text
        that is not an OKF document — no frontmatter, or a frontmatter
        block that is not a mapping — is a 400: there is nothing to
        project, and a caller filling a form has to be told that rather
        than shown an empty one.
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
        - $ref: "#/components/parameters/Producer"
      requestBody:
        required: true
        description: A key outside document/set/unset is a 400 naming it (design doc 0064).
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document:
                  type: string
                  description: The OKF document — YAML frontmatter, then markdown body.
                set:
                  type: object
                  additionalProperties: true
                  description: >
                    Top-level frontmatter keys to give these values. A
                    value is any JSON; it is rendered as the YAML a
                    person would have written.
                unset:
                  type: array
                  items: { type: string }
                  description: >
                    Top-level frontmatter keys to remove. A key the
                    document does not carry is not an error — the result
                    is a document without it either way.
            examples:
              read:
                summary: Read a document's frontmatter as structure
                value:
                  document: |
                    ---
                    type: Metric
                    title: Revenue
                    ---

                    Revenue is the sum of net_amount over completed orders.
              write:
                summary: Give the concept two sources and drop its expiry
                value:
                  document: |
                    ---
                    type: Metric
                    title: Revenue
                    stale_after: "2026-12-31"
                    ---

                    Revenue is the sum of net_amount over completed orders.
                  set:
                    sources:
                      - resource: bigquery://shop/analytics/orders
                        title: Orders
                  unset: [stale_after]
      responses:
        "200":
          description: The document, and its frontmatter as structure.
          content:
            application/json:
              schema:
                type: object
                required: [document, keys, values]
                properties:
                  document:
                    type: string
                    description: >
                      The document as it now stands — the same bytes on a
                      read, and the edited ones on a write. Store it with
                      PUT /api/v1/bundle/{path}; nothing was stored here.
                  keys:
                    type: array
                    items: { type: string }
                    description: The frontmatter's top-level keys, in the order the document carries them.
                  values:
                    type: object
                    additionalProperties: true
                    description: The frontmatter mapping, decoded to the shapes JSON has.
              example:
                document: |
                  ---
                  type: Metric
                  title: Revenue
                  ---

                  Revenue is the sum of net_amount over completed orders.
                keys: [type, title]
                values:
                  type: Metric
                  title: Revenue
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/move:
    post:
      operationId: moveConcept
      summary: Move (rename) a knowledge concept to a new id
      description: >
        The id is the address (design doc 0075 §2), so a move carries
        everything keyed by it along in one transaction — revisions,
        usage, files, embeddings — and rewrites inbound references (link
        targets in both of SPEC §6's forms, and the producer key `model`
        where a document carries one) so nothing breaks (design doc 0075
        §5). The destination must be a fresh id: a live or soft-deleted
        concept there already owns that address and its history — free
        an id held by a deleted concept with DELETE ...?purge=true.
        Lives at its own top-level path for the same reason /usage and
        /review do — a suffix after the hierarchical id could be
        confused with an ID segment.


        **Where an access policy exists, a move runs when its whole
        rewrite fits inside what the caller may write** — the concept,
        the destination, and everything that links at the concept. When
        one of them is outside, the move is refused whole rather than
        performed without the rewrites it may not make (design doc
        0129).
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
        - $ref: "#/components/parameters/Producer"
      requestBody:
        required: true
        description: A key outside from/to is a 400 naming it (design doc 0064).
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  type: string
                  description: The concept's current id.
                to:
                  type: string
                  description: The new id (bundle path).
            examples:
              rename:
                summary: Move a metric one level deeper
                value:
                  from: metrics/revenue
                  to: metrics/finance/revenue
      responses:
        "200":
          description: The moved concept, now at its new id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/View" }
              examples:
                moved:
                  summary: The concept at its new address
                  description: >
                    The id changed and nothing the document says did, so
                    content_hash — and the ETag — are what they were
                    before the move.
                  value:
                    id: metrics/finance/revenue
                    document: |
                      ---
                      type: Metric
                      resource: bigquery://example-analytics.shop.orders
                      title: Revenue
                      description: Net revenue from completed orders, excluding tax and shipping.
                      tags:
                          - finance
                          - core
                      status: stable
                      stale_after: "2026-12-31"
                      unit: JPY
                      grain: order
                      ---

                      Revenue is the sum of `net_amount` over every
                      [completed order](/glossary/completed-order.md) in
                      [shop.orders](/tables/shop-orders.md). Tax and shipping
                      are excluded.
                    summary:
                      id: metrics/finance/revenue
                      type: Metric
                      title: Revenue
                      description: Net revenue from completed orders, excluding tax and shipping.
                      resource: bigquery://example-analytics.shop.orders
                      tags: [finance, core]
                      status: stable
                      stale_after: "2026-12-31"
                      trust: human-reviewed
                      verified_at: "2026-07-14T02:33:41.019778Z"
                      rejected: false
                      links:
                        - { target: glossary/completed-order, text: completed order }
                        - { target: tables/shop-orders, text: shop.orders }
                      content_hash: 8a3b71c0e5d24f96b1c8027ae4f35d6098b2c7e14d0a6f38b5c9e207d1a4f6b3
                      created_at: "2026-06-02T04:11:38.201044Z"
                      updated_at: "2026-07-27T01:02:33.518604Z"
                    observed:
                      created_by: { kind: human, name: tanaka@example.co.jp }
                      generated:
                        by: { kind: human, name: tanaka@example.co.jp }
                        at: "2026-07-27T01:02:33.518604Z"
                      verified:
                        - by: { kind: human, name: sato@example.co.jp }
                          at: "2026-07-14T02:33:41.019778Z"
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/review/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The concept's id; slashes are real path separators.
        schema: { type: string }
    post:
      operationId: reviewConcept
      summary: Record a human's ruling on a concept
      description: >
        One ruling on the concept as it stands, by the caller, now. This
        replaced three endpoints — `POST /api/v1/verify/{id}`,
        `POST /api/v1/reject/{id}` and `DELETE /api/v1/reject/{id}` —
        which shared every structural property and differed only in the
        value they wrote (design doc 0068 §4).

        **None of them edits the concept.** The document, its lifecycle
        status, its `updated_at` and its ETag all stay put, because
        ruling on knowledge and publishing it are different acts (design
        doc 0075 §3.2). Promoting a draft to stable is a PUT. That
        shared property is what says these are one operation: a face that
        writes the document and a face that rules on it are different
        things, and three faces that all leave the document alone are the
        same thing said three times.

        Not an MCP tool: a ruling is what a person does, and it is the
        human judgment the write-back loop turns on. An agent that finds
        a verified concept wrong reports the outcome (`POST
        /api/v1/usage/{id}`) or drafts a replacement (design doc 0067
        §6).

        Lives at its own top-level path for the same reason `/usage`
        does — a suffix after the hierarchical id could be confused with
        an ID segment.
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
        - $ref: "#/components/parameters/Producer"
      requestBody:
        required: true
        description: A key outside ruling/note is a 400 naming it (design doc 0064).
        content:
          application/json:
            schema:
              type: object
              required: [ruling]
              properties:
                ruling:
                  type: string
                  enum: [verified, rejected, withdrawn]
                  description: >
                    `verified` appends the caller and the time to the
                    concept's verifications ledger, whether this is the
                    first confirmation or the tenth re-check — and clears
                    any rejection. Re-checking is why this exists at all
                    rather than being sugar over PUT: a PUT writes
                    nothing when the content is unchanged, so "checked
                    again, still right" could not be recorded and both
                    review feeds (`sort=verified_at`, `sort=failed`) had
                    no exit (design doc 0069 §2).

                    `rejected` writes the caller, the time and the reason
                    as the concept's live ruling, replacing any earlier
                    one. Rejected concepts drop out of searches that did
                    not ask for them (`rejected=true`), which is how an
                    agent checks whether a proposal was already turned
                    down before making it again — the memory of *no* the
                    write-back loop is built on (design doc 0081 §4).
                    Verifications are not cleared: somebody vouched for
                    this and somebody later ruled against it is exactly
                    the history worth keeping.

                    `withdrawn` removes the live rejection, returning the
                    concept to the ordinary pool. A live concept that
                    carries no rejection is a 409, not a 404 (design doc
                    0064): lifting nothing is a mistake worth reporting
                    rather than a silent success, and a missing concept is
                    a different mistake — a 404 stays that. It is spelled
                    as a ruling rather than as a DELETE because **nothing
                    is deleted** — the verifications stay, and the
                    withdrawal is its own row in the concept's history,
                    recorded with the same word the ruling uses,
                    `withdraw`.
                note:
                  type: string
                  maxLength: 2000
                  description: >
                    Why it was not accepted. `rejected` only: with any
                    other ruling it is a 400. A verification says the
                    concept is right as it stands, and anything to say
                    about it belongs in the concept; carrying a note there
                    would be a new thing to say rather than the same
                    three said once.

                    The rejecter's words, distinct from the concept's own
                    `status_note`, which belongs to whoever wrote it.
            examples:
              verify:
                summary: Confirm the concept as it stands
                description: >
                  The first confirmation and the tenth re-check are the
                  same call. A verification is appended to
                  `observed.verified` and `summary.trust` moves; nothing
                  else does — the concept is still the draft its writer
                  published, and `content_hash` (the ETag, and the
                  version an editor may be holding) is untouched.
                value:
                  ruling: verified
              reject:
                summary: Turn it down, with the reason
                value:
                  ruling: rejected
                  note: double-counts refunds; see policies/revenue-recognition
              withdraw:
                summary: Lift a rejection
                value:
                  ruling: withdrawn
      responses:
        "200":
          description: The concept, carrying the ruling.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/View" }
              examples:
                confirmed:
                  summary: 'POST /api/v1/review/insights/revenue-seasonality {"ruling":"verified"}'
                  description: >
                    A verification by the caller is appended to
                    observed.verified, and summary.trust flips. Nothing
                    else moves: the document is byte-for-byte what it
                    was, and the status is still draft — confirming
                    knowledge and publishing it are different acts.
                  value:
                    id: insights/revenue-seasonality
                    document: |
                      ---
                      type: Insight
                      title: Reading revenue month over month
                      description: Why a December spike and a January drop are normal.
                      tags:
                          - finance
                      status: draft
                      stale_after: "2027-01-31"
                      ---

                      [Revenue](/metrics/revenue.md) is seasonal: December runs
                      well above the trailing median and January falls back
                      below it.
                    summary:
                      id: insights/revenue-seasonality
                      type: Insight
                      title: Reading revenue month over month
                      description: Why a December spike and a January drop are normal.
                      tags: [finance]
                      status: draft
                      stale_after: "2027-01-31"
                      trust: human-reviewed
                      verified_at: "2026-07-27T00:41:12.905337Z"
                      rejected: false
                      links:
                        - { target: metrics/revenue, text: Revenue }
                      content_hash: 15c8e3097b6d2a41f0c85b3ed729a4f6108c5d3b7e2a094f6c1b8d503a7e2f94
                      created_at: "2026-07-21T06:14:55.402881Z"
                      updated_at: "2026-07-21T06:14:55.402881Z"
                    observed:
                      created_by: { kind: process, name: analyst@example.iam.gserviceaccount.com }
                      generated:
                        by: { kind: process, name: analyst@example.iam.gserviceaccount.com }
                        at: "2026-07-21T06:14:55.402881Z"
                      verified:
                        - by: { kind: human, name: tanaka@example.co.jp }
                          at: "2026-07-27T00:41:12.905337Z"
                turnedDown:
                  summary: 'POST /api/v1/review/metrics/gross-revenue {"ruling":"rejected"}'
                  description: >
                    The ruling is in observed.rejection, and
                    summary.rejected is how a row says so. The document is
                    untouched — a rejection is a judgment about the
                    concept, not a stage of it, and it could not
                    round-trip as a status because export would have to
                    fold it onto deprecated, which asserts the opposite
                    thing about the concept (design doc 0068 §4).
                  value:
                    id: metrics/gross-revenue
                    document: |
                      ---
                      type: Metric
                      title: Gross revenue
                      description: Order totals before refunds.
                      status: draft
                      ---

                      The sum of `gross_amount` over every order in
                      [shop.orders](/tables/shop-orders.md).
                    summary:
                      id: metrics/gross-revenue
                      type: Metric
                      title: Gross revenue
                      description: Order totals before refunds.
                      status: draft
                      trust: unverified
                      rejected: true
                      links:
                        - { target: tables/shop-orders, text: shop.orders }
                      content_hash: 7be31c85d0a629f4b17c08e35da4962f0b8c71e34d0a95f627b1c8e034da95f7
                      created_at: "2026-07-24T02:18:09.441027Z"
                      updated_at: "2026-07-24T02:18:09.441027Z"
                    observed:
                      created_by: { kind: process, name: analyst@example.iam.gserviceaccount.com }
                      generated:
                        by: { kind: process, name: analyst@example.iam.gserviceaccount.com }
                        at: "2026-07-24T02:18:09.441027Z"
                      rejection:
                        by: { kind: human, name: sato@example.co.jp }
                        at: "2026-07-27T02:05:44.812390Z"
                        note: double-counts refunds; see policies/revenue-recognition
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
        "400":
          description: Error.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [invalid] }
                required: [error, code]
              examples:
                unknownRuling:
                  summary: A ruling outside the vocabulary
                  value:
                    error: 'ruling must be one of verified, rejected, withdrawn, not "approved"'
                    code: invalid
                noteOnVerification:
                  summary: A note belongs to a rejection
                  value:
                    error: 'a verification carries no note: "verified" says the concept is right as it stands, and anything to say about it belongs in the concept. Use ruling=rejected to record a reason'
                    code: invalid
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: >
            `ruling: withdrawn` against a live concept that carries no
            rejection (design doc 0064) — nothing to lift.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [no_rejection] }
                required: [error, code]
              example:
                error: knowledge carries no rejection to withdraw
                code: no_rejection
        "413": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/usage/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The concept's id; slashes are real path separators.
        schema: { type: string }
    get:
      operationId: getConceptUsage
      summary: Usage totals for one knowledge concept
      description: >
        How often the concept was actually used: appeared in search results,
        fetched individually, and how it was reported to have worked. The measure of
        the write-back loop — evidence for promoting drafts, and a staleness
        signal for verified concepts that stopped being used.
      responses:
        "200":
          description: Usage totals.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
              examples:
                totals:
                  summary: GET /api/v1/usage/queries/monthly-revenue
                  description: >
                    search_hits and fetches are recorded by reads;
                    worked and failed only by report_outcome. A concept never
                    reported on has both at zero — which is not the same
                    signal as one that failed.
                  value:
                    search_hits: 412
                    fetches: 168
                    worked: 23
                    failed: 2
                    last_used_at: "2026-07-26T23:58:07.336114Z"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      operationId: reportOutcome
      summary: Report an outcome (worked/failed) for a knowledge concept
      description: >
        The last edge of the write-back loop: after acting on knowledge
        (running a golden query, running SQL written from a concept), report whether
        the result was correct. Reports feed the concept's usage totals;
        failed counts against verified concepts flag them for
        re-verification. The caller's identity is recorded with each
        report; the optional note travels with the raw event.
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
        - $ref: "#/components/parameters/Producer"
      requestBody:
        required: true
        description: A key outside outcome/note is a 400 naming it (design doc 0064).
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [worked, failed]
                  description: worked = acting on the concept gave a correct result; failed = wrong or unusable.
                note:
                  type: string
                  maxLength: 2000
                  description: What was run, what went wrong. Recorded with the raw event (pruned with it after 180 days).
            examples:
              worked:
                summary: The golden query gave the right answer
                value:
                  outcome: worked
                  note: Ran it for FY2025; the total matched the finance close to the yen.
              failed:
                summary: It did not
                description: >
                  A failed report against a verified concept puts it on the
                  re-verification feed (sort=failed), where it stays until
                  someone verifies it again.
                value:
                  outcome: failed
                  note: >-
                    Double-counts orders split across two shipments since the
                    2026-07 fulfilment change.
      responses:
        "200":
          description: Updated usage totals.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
              examples:
                afterReport:
                  summary: The totals with this report counted
                  value:
                    search_hits: 412
                    fetches: 168
                    worked: 23
                    failed: 3
                    last_used_at: "2026-07-27T02:07:44.291508Z"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/access:
    get:
      operationId: getAccessPolicy
      summary: Who may read and write under which directory
      description: >
        The access policy: one rule per grant, saying that a principal may
        read under a directory and — when `may_write` — write there too
        (design doc 0109).


        ochakai holds no authorization by default, and a deployment that
        has written no rule still holds none: every caller that reaches it
        reads and writes everything, which is what every deployment did
        before this address existed. The first rule turns the boundary on
        for everybody at once.


        Reading the policy is an administrator's operation, because the
        rules name people and the directories they may see. Administrators
        are named by the deployment's own configuration
        (`OCHAKAI_ADMINS`), not by a rule here — whoever may edit the
        policy may grant themselves anything, so the answer to who that is
        cannot live in the thing they are editing.


        What no rule grants is not readable, and a read of it answers
        **404 rather than 403**: whether something exists at an address is
        the boundary itself. A write to a directory the caller may read
        but not write is a 403, which says nothing they did not already
        know.
      responses:
        "200":
          description: The policy as stored.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
            ETag: { $ref: "#/components/headers/PolicyVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessPolicy" }
              examples:
                twoTeams:
                  summary: GET /api/v1/access
                  description: >
                    Two teams that curate their own subtree, a company
                    glossary everybody reads, and an application that
                    writes nowhere.
                  value:
                    rules:
                      - prefix: glossary
                        principal: "*"
                        may_write: false
                        granted_at: "2026-08-14T09:12:00Z"
                        granted_by: human:ops@example.co.jp
                      - prefix: teams/growth
                        principal: human:tanaka@example.co.jp
                        may_write: true
                        granted_at: "2026-08-14T09:12:00Z"
                        granted_by: human:ops@example.co.jp
                      - prefix: teams/sales
                        principal: human:sato@example.co.jp
                        may_write: true
                        granted_at: "2026-08-14T09:12:00Z"
                        granted_by: human:ops@example.co.jp
                    version: 6c2b0f1e9a3d5c7b8e4f0a1d2c3b4a59687766554433221100ffeeddccbbaa99
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: putAccessPolicy
      summary: Replace the access policy
      description: >
        Replaces every rule with the document sent, and answers with the
        policy as stored.


        Whole-document replacement rather than an operation per rule: a
        policy is read as a set — "who can see personnel/" is answered by
        looking at all of it — and an operator edits what they just read.
        It also keeps in version control, which is the review path a
        boundary deserves.


        `granted_at` and `granted_by` are the server's own record of who
        changed the policy and are ignored on the way in, and so is
        `version` — it is what a read hands a conditional write, and the
        precondition itself travels in `If-Match`.


        Because the document is replaced whole, two callers that each read
        it and add one rule would leave only the second one's rule. Send
        `If-Match` with the version the read returned and the second write
        fails with a 412 instead (design doc 0120). Absent means last
        write wins, as everywhere else. `If-None-Match` is a 400 here: the
        policy is one document that always exists, so there is no create
        to guard.


        Sending `{"rules": []}` removes every boundary and returns the
        deployment to the default, where whoever reaches it reads and
        writes everything. A deployment that names no administrator
        refuses to accept a first rule at all: a policy nobody could undo
        is one nobody should be able to write.
      parameters:
        - $ref: "#/components/parameters/IfMatchPolicy"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessPolicy" }
      responses:
        "200":
          description: The policy as stored.
          headers:
            ETag: { $ref: "#/components/headers/PolicyVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessPolicy" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "412":
          description: >
            The `If-Match` precondition failed: the policy changed since
            it was read, and nothing was written. Read it again, redo the
            edit on what is there now, and retry with the new version —
            the alternative this refuses is a save that silently removes
            the rules somebody else added (design doc 0120).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [precondition_failed] }
                required: [error, code]
  /api/v1/stats:
    get:
      operationId: getStats
      summary: The instance's own view of the improvement loop
      description: >
        Every other measurement here is per concept — how often this one was
        searched, fetched, reported worked. Those are counters, and running
        an improvement loop needs a trend: whether the verified share is
        growing, whether failure reports are being answered, and what people
        asked for and did not find. That is a question about the base as a
        whole, and this is the face that answers it (design doc 0069 §5).


        It carries the queue depths under `queues` (design doc 0069
        §5), and `prefix` narrows every number keyed by a concept.


        Two kinds of number come back. A *state* is how things stand now
        (how many concepts, how many are waiting for review); a *flow* is
        what happened inside `days` (created, verified, reported, missed).
        The schema says which is which per field.


        Computed on demand, with no rollup behind it — so the window cannot
        reach past the 180 days after which raw events and misses are
        pruned, and asking for more is a 400 rather than a quietly short
        answer.
      parameters:
        - name: days
          in: query
          description: >
            The flow window, 1–180 (default 30). Out-of-range values are a
            400: the raw events behind the outcome and miss counts are
            pruned after 180 days, so a longer window would answer with
            less than it was asked for.
          schema: { type: integer }
        - name: prefix
          in: query
          description: >
            Measure only what lives under this path, e.g. teams/growth —
            matched on segment boundaries, repeatable and OR-ed, as on
            search (design doc 0075 §6). This is how a team asks about its
            own knowledge on a deployment it shares: before this, it could
            count its own review queue and could not count its own
            concepts.

            Every number keyed by a concept honors it — the tallies, the
            queues, the verifications, the outcomes. **`misses` does
            not**, and cannot: a search that found nothing found it
            nowhere, so there is no id to scope by, and the questions this
            base could not answer stay the instance's whatever prefix is
            passed (design doc 0069 §5.1).
          schema: { type: array, items: { type: string } }
          explode: true
          allowReserved: true
      responses:
        "200":
          description: The loop as this instance sees it.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
              examples:
                loop:
                  summary: GET /api/v1/stats?days=30
                  description: >
                    A base being curated: two thirds of it confirmed, seven
                    verifications last month, four failure reports nobody has
                    answered — and eleven questions that found nothing, which
                    is the list of what to write next.
                  value:
                    at: "2026-07-28T02:07:44.291508Z"
                    window_days: 30
                    files: { enabled: true }
                    concepts:
                      total: 128
                      status: { draft: 31, stable: 92, deprecated: 5 }
                      trust: { unverified: 42, machine-confirmed: 19, human-reviewed: 67 }
                      rejected: 3
                      created: 12
                    queues:
                      drafts: 31
                      failed: 4
                      stale_after: 2
                    review:
                      verifications: 7
                    outcomes:
                      worked: 30
                      failed: 4
                    misses:
                      recording: true
                      count: 11
                      queries:
                        - query: "解約率の定義"
                          count: 5
                          last_at: "2026-07-27T23:58:07.336114Z"
                        - query: "arr by segment"
                          count: 3
                          last_at: "2026-07-26T08:11:02.104233Z"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/reembed:
    post:
      operationId: reembedConcepts
      summary: Embed concepts that have no vector for the configured model
      description: >
        Vectors are written when a concept is written, so a knowledge base
        loaded before semantic search was reachable has none, and hybrid
        search stays quietly lexical-only until every concept happens to
        be rewritten. Changing the embedding model leaves the same gap:
        the old vectors sit in a space nothing queries any more (design
        doc 0080 §3). This fills it.


        File vectors are covered too: only writing a file records one, so
        a corpus loaded before semantic search — or one whose embedding
        tables were dropped to change dimensions — has files that are
        findable by name alone until this runs. Concepts go first and
        files fill the rest of the pass.


        Bounded per call — repeat while `missing` is above zero, passing
        the previous response's `cursor` back each time; the CLI
        (`ochakai reembed`) does that for you. One item is one call to
        the embedding provider and the calls are sequential, so the
        default pass is sized to finish well inside a request timeout
        (Cloud Run's default is 300s); raise `limit` only if you know
        yours. A provider failure on one item is counted, not fatal. 501
        when semantic search is not configured.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 200, maximum: 5000 }
        - name: cursor
          in: query
          description: >
            Resume position from a previous response. Omit to start from
            the beginning. Without it, a pass whose every item the
            provider refuses returns the same window forever and the rest
            of the corpus is never attempted.
          schema: { type: string }
      responses:
        "200":
          description: What the pass did.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  concepts:
                    description: >
                      Knowledge concepts embedded by this pass — progress
                      of this pass, not a census of the corpus (design doc
                      0064): a later re-keying of how a file's vector is
                      stored changes what this counts without that being
                      a second breaking change.
                    type: integer
                  files:
                    description: Files embedded by this pass — the same "this pass" caveat as concepts.
                    type: integer
                  failed: { type: integer }
                  missing:
                    description: >
                      Concepts and files still unembedded once the
                      pass was over — counted after the fact, so items
                      this pass failed on are included. This is also
                      progress of this pass, not a census of the corpus
                      (design doc 0064): a later re-keying of how a
                      file's vector is stored changes what this counts
                      without that being a second breaking change.
                    type: integer
                  cursor:
                    description: >
                      Where the next pass resumes. Absent once nothing is
                      missing; unchanged from the one sent in means the
                      corpus is exhausted and what remains only fails.
                    type: string
                required: [concepts, files, failed, missing]
              examples:
                partial:
                  summary: A pass with work still left
                  description: >
                    missing is above zero, so call again with this cursor.
                    The cursor is opaque — it carries the concept and the
                    file position in one token; pass it back unchanged
                    rather than parsing it.
                  value:
                    concepts: 200
                    files: 0
                    failed: 0
                    missing: 613
                    cursor: "MQByZWVtYmVkAG1ldHJpY3MvcmV2ZW51ZQAA"
                done:
                  summary: The last pass
                  description: Nothing is missing, so no cursor comes back.
                  value:
                    concepts: 13
                    files: 4
                    failed: 0
                    missing: 0
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    GoogleIDToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        A Google-signed identity token, audience-bound to this service's
        URL, as `Authorization: Bearer <token>` (design docs 0065 §2,
        0003). Cloud Run IAM verifies it before a request reaches ochakai
        — the container reads the claims IAM already vouched for — while
        a deployment that names its own OIDC issuer (design doc 0086)
        verifies the token in-process instead, against that issuer's
        published keys; on OCHAKAI_MODE=public or dev nothing is checked
        and every caller is `human:anonymous` (design doc 0066 §1), which
        is the case the empty security requirement alongside this scheme
        covers. Mint one with
        `gcloud auth print-identity-token --audiences=$OCHAKAI_URL`, or
        from code with a client library's ID-token helper — see
        [Embedding the REST API](../docs/guides/rest-integration.md)
        (Japanese) for both, plus everything else an application calling
        this API directly needs.
  headers:
    PolicyVersion:
      description: >
        The access policy's version — the hash of its grants, quoted, and
        the same value as the body's `version` (design doc 0120). A client
        echoes it in `If-Match` to replace the policy only while it still
        says what was read. It covers the grants and nothing else, so a
        write that changes no rule leaves a held precondition valid.
        Treat it as opaque.
      schema: { type: string }
    ETag:
      description: >
        The concept's version — the hash of the document as stored,
        quoted, and the same value as the body's summary.content_hash
        (design doc 0075 §3.2). A client echoes it in
        If-Match on a later update to write only if nothing changed
        meanwhile (design doc 0030). It covers the document and nothing
        else, so verifying, rejecting or attaching a file all leave a
        held precondition valid — while reformatting the concept moves it,
        because the file did change (what the concept *says* did not, which
        is what observed.generated.at reports). Treat it as opaque.
      schema: { type: string }
    Note:
      description: >
        A value the server accepted but read differently than it was
        written — an unrecognized status, a date it could not parse, a
        trust family read as the document's own claim rather than as
        this instance's observation. Repeatable, one per reinterpretation. A reinterpretation is never
        silent (design doc 0075 §3.1).

        The same strings are in the body, as View's `notes` (design doc
        0113) — read them there. This header is what a response whose
        body is the document ("Accept: text/markdown") has instead, and
        it stays on the JSON answer too because a header name is inside
        the freeze (design doc 0082 §2): dropping it is 1.0's work.
      schema: { type: string }
    Plan:
      description: >
        What a `dry_run=true` write would have done (design doc 0074 §5):
        "created" when the path is free, "updated" when the object would
        change, "unchanged" when the body says exactly what is stored and
        the write would have written nothing. It replaces
        Ochakai-Unchanged on a dry run rather than joining it — unchanged
        is one of the three values, and two headers saying overlapping
        things is how a client ends up reading only one of them. Present
        only on a dry run: a plan header on a response to a real write
        would describe something that already happened.
      schema: { type: string, enum: [created, updated, unchanged] }
    ReadOnly:
      description: >
        Set to "true" on every /api/v1 response — reads, writes, and
        errors alike — when the deployment is read-only
        (OCHAKAI_MODE=read-only or public, design doc 0066 §2). It describes the
        deployment, not the outcome of the call. Absent means the
        deployment accepts writes, which is what every server predating
        the flag says. MCP announces read-only by not offering the write
        tools; REST has no such handshake, so it says so in a header, the
        way Ochakai-Unchanged reports that an update wrote nothing. A
        client reads it to stop offering writes that would only ever be
        refused with 403.
      schema: { type: string, enum: ["true"] }
    CacheControl:
      description: >
        `private, no-cache` on a file read — the bytes and the metadata
        alike. A file is content-addressed and its ETag never lies, so a
        cache may hold it; `no-cache` asks that it revalidate rather than
        serve a copy without asking, and `private` keeps a shared proxy
        out of bytes an IAP session was allowed to see. Also on the 304 a
        revalidation earns.
      schema: { type: string }
    NoSniff:
      description: >
        `nosniff`, on a file's bytes. The media type was decided here, by
        sniffing what was stored; a browser that overrode it from a
        filename or a guess would be deciding it a second time (design doc
        0075 §1).
      schema: { type: string, enum: [nosniff] }
    Sandbox:
      description: >
        `sandbox`, on a file that is not rendered in place — anything but
        an image, a PDF or plain text. The web UI is served from this
        origin, so a stored document that happens to carry script (an SVG,
        an HTML file) must have nowhere to run (design doc 0075 §1).
      schema: { type: string, enum: [sandbox] }
  parameters:
    IfMatchPolicy:
      name: If-Match
      in: header
      required: false
      description: >
        Optimistic-concurrency precondition on the access policy (design
        docs 0030, 0120): the version a prior read or write returned in
        the `ETag` header, quotes optional, and the same value as the
        body's `version`. The replacement happens only while the policy
        still has it; a policy changed since it was read is a 412 and
        nothing is written. Absent means no precondition — last write
        wins. `*` is a 400, for the reason the concept precondition gives.
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >
        Optimistic-concurrency precondition (design doc 0030): the
        concept's version, as a prior read or write returned it in the ETag
        response header (quotes optional; the JSON body's
        summary.content_hash field is the same value). Every response carrying a concept
        carries the header. The write happens only if the concept still has
        this version; a concept changed since it was read is a 412 and
        nothing is written. Absent means no precondition — last write wins.
        The version is opaque, so there is no format to reject: a value
        that never matched anything fails the precondition with a 412,
        which is what a merely stale one does too.

        **`*` is a 400.** RFC 9110 §13.1.1 gives it a meaning — "only if
        a representation exists", the update-only mirror of the
        create-only `If-None-Match: *` — that ochakai does not implement,
        and reading it as no precondition at all silently created for a
        caller who sent it to prevent exactly that. Naming it leaves the
        choice open: a 400 can be given RFC's meaning in a later release
        without breaking anyone, because no request that always failed
        can be relied on (design doc 0064 §20.1).
      schema: { type: string }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >
        The other precondition (design doc 0030). On a PUT to a concept,
        `*` means "only if the path is free": the write creates or fails
        with a 412, which is how a caller states that it is not replacing
        anything. On a GET, of a concept or a file, it is the ordinary
        cache validator — the content hash a prior read returned,
        answered with a 304 when it still matches (design doc 0064
        §14.2: a concept's GET did not compare it until now).

        **Each surface takes one of those two spellings and 400s the
        other** (design doc 0064 §20.4). A version on a PUT would mean
        "write only if this is *not* the version", which ochakai does not
        implement; `*` on a GET would mean "answer only if nothing is
        here", the opposite of the validator. Neither is ignored: an
        unconditioned write is what a caller sending a precondition least
        wants.

        **Neither is read where the path holds a file.** The contract
        declares both here because one address writes both kinds, but the
        version they name is a concept's; a file write takes no
        precondition and says so with a 400 rather than overwriting.
      schema: { type: string }
    OnBehalfOf:
      name: Ochakai-On-Behalf-Of
      in: header
      required: false
      description: >
        Delegated end-user identity (design doc 0065 §3): "kind:identity",
        kind human or process, no whitespace in the identity, at most 320
        bytes — e.g. "human:tanaka@example.co.jp". An application on the
        delegator allowlist (OCHAKAI_DELEGATING_CALLERS) forwards who it
        is acting for; the forwarded identity is recorded as the actor
        and the caller is kept as Actor.via — never dropped. A caller
        not permitted to delegate is a 403 and a malformed value a 400 —
        an error, not a silent downgrade, and in the same JSON envelope
        as every other error here, so the message reaches the caller.
        Honored on every call; declared on the operations that record
        provenance.
      schema: { type: string, maxLength: 320 }
    Producer:
      name: Ochakai-Producer
      in: header
      required: false
      description: >
        The software the caller is running, in OKF SPEC §7's
        "<producer>/<version>" form — e.g. "insightflow/1.4.0" (design doc
        0065 §4). One slash, both halves non-empty, no whitespace, no colon
        (the character §7 tells "human:"/"process:" apart by), at most 128
        bytes; a malformed value is a 400, not a silent drop.
        It is recorded as Actor.producer, beside the authenticated actor
        and never in place of it: this is the one value here the caller
        declares about itself, and a self-declared name is only meaningful
        while the identity that vouches for it stays in the record. No
        allowlist gates it — unlike a delegated identity it names nobody
        but the caller, and the caller is authenticated.
        Trust is unaffected: SPEC §5.3 reads the actor's human: prefix,
        which this does not touch.
        Honored on every call; declared on the operations that record
        provenance. Ignored on a public read-only deployment, where no
        caller is authenticated (design doc 0066 §3).
      schema: { type: string, maxLength: 128 }
  responses:
    Error:
      description: >
        Error. `error` is a sentence for a person and may be reworded in
        any release (docs/compatibility.md); `code` is the part a client
        branches on. Three conditions answer 409 — `already_exists`,
        `not_deleted`, `no_rejection` — and telling them apart used to
        mean matching the prose. Where the status already determines the
        condition the code repeats it, so a client never has to ask
        whether this particular failure carries one.
      headers:
        Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code:
                type: string
                enum:
                  [
                    already_exists,
                    forbidden,
                    internal,
                    invalid,
                    method_not_allowed,
                    no_rejection,
                    not_deleted,
                    not_found,
                    precondition_failed,
                    read_only,
                    too_large,
                    unsupported,
                  ]
            required: [error, code]
    Unauthorized:
      description: >
        No identity this deployment can accept — and answered by ochakai
        itself, not only by whatever infrastructure sits in front of it.
        The Cloud Run posture refuses a request whose forwarded token is
        missing or unreadable; a deployment that names its own OIDC
        issuer (design doc 0086) refuses a signature, issuer, audience
        or expiry the issuer will not vouch for. The anonymous postures
        (OCHAKAI_MODE=public or dev) never answer it, because they
        authenticate nobody. Same JSON envelope as every other error
        here; the code is `invalid`, because what failed is the
        request's credential rather than any condition of the knowledge.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code: { type: string, enum: [invalid] }
            required: [error, code]
          examples:
            noToken:
              summary: The Cloud Run posture, reached without a forwarded token
              value:
                error: "auth: no identity token; is the service non-public with Cloud Run IAM enforced? (for local development set OCHAKAI_MODE=dev)"
                code: invalid
    Forbidden:
      description: >
        Refused — the route exists and the request was understood, but
        this deployment declines it. Two things answer 403, and the
        message says which: a write against a read-only deployment
        (design doc 0066 §2 — 403 rather than 404, because the endpoint
        did not go away), and Ochakai-On-Behalf-Of from a caller that
        is not on the delegator allowlist (design doc 0065 §3, which refuses
        rather than silently downgrading to the caller's own identity).
        The second reaches every operation, since the header is honored
        on every call; the first only the writes. Same JSON envelope as
        every other error here; the code says which — `read_only` for
        the deployment posture, `forbidden` for the delegation refusal.
      headers:
        Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code: { type: string, enum: [forbidden, read_only] }
            required: [error, code]
          examples:
            readOnly:
              summary: A write against a read-only deployment
              value:
                error: "this ochakai is read-only: it serves knowledge but does not change it"
                code: read_only
            notADelegator:
              summary: Ochakai-On-Behalf-Of from a caller not permitted to delegate
              value:
                error: "auth: Ochakai-On-Behalf-Of: app@example.iam.gserviceaccount.com is not permitted to act on behalf of others (add it to OCHAKAI_DELEGATING_CALLERS)"
                code: forbidden
  schemas:
    AccessPolicy:
      type: object
      description: >
        The whole access policy. One key, so a rule can gain a field
        without the document changing shape.
      properties:
        rules:
          type: array
          items: { $ref: "#/components/schemas/AccessRule" }
        version:
          type: string
          readOnly: true
          description: >
            The policy's version — the same value the `ETag` response
            header carries, without the quotes. It is in the document so
            that what a client reads back carries everything a
            conditional replacement of it needs, the way a concept's
            `summary.content_hash` does; the precondition itself is the
            `If-Match` header, and this field is ignored in a request
            body rather than becoming a second spelling of it.


            It hashes the grants and nothing else, so a rewrite that
            changes no rule leaves a held precondition valid, and
            `granted_at` moving does not invalidate one. An empty policy
            has a version like any other — the first grant on a
            deployment with none is exactly the write two automated
            callers race for. Treat it as opaque.
          example: 6c2b0f1e9a3d5c7b8e4f0a1d2c3b4a59687766554433221100ffeeddccbbaa99
      required: [rules]
    AccessRule:
      type: object
      description: >
        One grant. There are no deny rules: what no rule grants is not
        readable, and a rule that had to be evaluated against an order
        nobody can see in the document would make "why can Tanaka not
        read this" a question about precedence rather than about a row
        that is present or absent.
      properties:
        prefix:
          type: string
          description: >
            A bundle path with no trailing slash, matched on segment
            boundaries as the search filter is (design doc 0075 §6):
            `sales` covers `sales/orders` and does not cover
            `sales-legacy/orders`. The empty string is the whole bundle.
          example: teams/growth
        principal:
          type: string
          description: >
            An actor as the ledger spells one — `human:<name>` or
            `process:<name>` (design doc 0065 §2) — or `*` for every
            authenticated caller. A delegated write resolves to the end
            user it names, so an application forwarding somebody gets
            that person's scope.
          example: human:tanaka@example.co.jp
        may_write:
          type: boolean
          description: >
            Grants writing as well as reading. Writing implies reading: a
            caller that could change a concept it cannot read would be
            writing blind, and the If-Match read it needs to do that
            safely would be the thing refused.
        may_admin:
          type: boolean
          description: >
            Grants editing the **rules under this prefix** — the grants
            for one subtree, delegated to whoever runs it, so that
            placing a boundary for one team is not an operation that can
            also remove every other team's (design doc 0124). Implies
            `may_write`, which implies reading.


            A caller holding it reads and replaces only the rules at or
            under the prefixes it names, matched on segment boundaries;
            everything else is invisible to them and survives their write
            untouched, and the `ETag` they are given covers what they can
            see. A rule they send outside those prefixes is a **403**
            rather than a rule quietly dropped.


            **Refused at the root.** "Who may edit the whole policy" is
            the one answer that cannot live inside the policy, because
            whoever holds it can grant themselves anything — name that
            principal in `OCHAKAI_ADMINS` instead (design doc 0109 §3).


            What it does not reach: a shallower rule that governs the
            same subtree belongs to whoever administers *that* prefix, so
            the effective access to a directory can be wider than the
            rules its own administrator can see.
        granted_at:
          type: string
          format: date-time
          description: Server-recorded; ignored on write.
        granted_by:
          type: string
          description: Server-recorded; ignored on write.
      required: [prefix, principal, may_write]
    Type:
      type: string
      description: >
        The OKF type vocabulary, verbatim — the built-ins (Metric,
        Attested Computation, Skill, Insight, Policy,
        Glossary Term, BigQuery Dataset, BigQuery Table,
        Reference) are recommendations,
        not a closed set, and no server behavior hangs off any of them
        (design doc 0071 §2). Any
        single-line value works as a type; OKF registers no taxonomy, so
        the spelling is the meaning and it round-trips unchanged. Matching
        is case-insensitive; the spelling you write is the one stored.

        "/" is allowed: SPEC §4.1 says type values are not registered
        centrally and a consumer "MUST tolerate unknown types
        gracefully", and §11 does not let an unknown type reject a
        bundle — so a namespaced type like `acme/Table` is legal OKF and
        is stored as written (design doc 0064). The 128-byte cap is
        ochakai's own defensive bound, not something SPEC derives. The
        pattern below is the loosest spelling a portable regex can
        carry: the server is stricter — it refuses every control
        character, not only CR and LF, and counts the cap in bytes, so
        multibyte values shorter than 128 characters can still be
        refused.
      examples: [Metric, Attested Computation, Skill, Insight, Policy, Glossary Term, BigQuery Dataset, BigQuery Table, Reference, Data Contract]
      pattern: "^[^\\r\\n]{1,128}$"
    Status:
      type: string
      description: >
        The lifecycle value, spelled as OKF SPEC §5.4 spells it: draft is
        "not yet reviewed, possibly incomplete", stable is "ready for
        consumption", deprecated is "kept for links and history, no longer
        current".
        It says nothing about whether anyone confirmed the concept — SPEC
        §5.3 puts that in `verified`, and ochakai keeps it in the
        verifications ledger, so a draft may be verified and a stable
        concept unverified (design doc 0075 §4.1). "Was never accepted" is
        likewise not a lifecycle value but a ruling, in `rejection`
        (design doc 0068 §4).
        A document that names no status is stable — SPEC §5.4's default.
        ochakai does not write a key its writer left out, so what comes
        back here is the value a reader reads, while the document keeps
        its silence (design doc 0075 §3).
      enum: [draft, stable, deprecated]
    Trust:
      type: string
      description: >
        The tier a consumer derives from the verification ledger, in OKF's
        own vocabulary (SPEC §5.3): unverified when nobody has confirmed
        the concept, machine-confirmed when something other than a person
        has, human-reviewed when a person vouched for it. Derived on read
        and never accepted from a payload — and independent of status,
        which says whether the concept may be consumed (design doc 0075
        §4.1).

        The ledger it is derived from is **this instance's own**: the
        confirmations recorded here through
        `POST /api/v1/review/{id}` with `ruling: verified`. SPEC §5.3
        would lead a reader to expect the document's own `verified` key to
        decide this; it does not. A document that arrives carrying one
        keeps it — under `received:`, as a claim its writer made — and it
        is never scored, because a claim of confirmation is not a
        confirmation this instance observed (design doc 0009). Import an
        exported bundle back into a different ochakai and every concept
        reads unverified there until somebody confirms it.
      enum: [unverified, machine-confirmed, human-reviewed]
    Verification:
      type: object
      description: >
        One recorded confirmation — an element of OKF's `verified` list
        (SPEC §5.2), and under §5.3 the only thing that makes a concept
        anything but unverified. Append-only and plural: re-checking a
        concept adds a row rather than replacing one, so the record answers
        "how often, and by whom" and not just "when last".
        Written by POST /api/v1/review/{id} with ruling: verified, never
        from a payload.
      properties:
        by: { $ref: "#/components/schemas/Actor" }
        at: { type: string, format: date-time }
      required: [by, at]
    Rejection:
      type: object
      description: >
        This instance's ruling that a concept was not accepted — the memory
        that stops an agent re-proposing knowledge a human already turned
        down. One live ruling per concept; POST /api/v1/review/{id} records
        it with ruling: rejected and lifts it with ruling: withdrawn.
        It is not a lifecycle value: a rejection is a judgment about the
        concept rather than a stage of it, and it could not round-trip as
        a status because export had to fold it onto deprecated, which
        asserts the opposite thing about the concept (design doc 0068 §4).
        A bundle does not carry it (design doc 0009).
      properties:
        by: { $ref: "#/components/schemas/Actor" }
        at: { type: string, format: date-time }
        note:
          description: >
            Why it was not accepted. The rejecter's words, distinct from
            the concept's own status_note, which belongs to whoever wrote
            the concept.
          type: string
      required: [by, at]
    Actor:
      type: object
      description: >
        Who acted. Resolved from the caller's Google identity, never from
        the request payload (design doc 0009).
      properties:
        kind:
          description: >
            The spellings OKF SPEC §7 defines (design doc 0065 §2).
            Anything that is not a person is a process — §5.3 derives
            trust from the human: prefix alone, so no finer distinction
            is load-bearing. Service accounts are processes.
          type: string
          enum: [human, process]
        name: { type: string }
        via:
          description: >
            The delegating caller, when an application forwarded an end
            user's identity with Ochakai-On-Behalf-Of (design doc
            0065 §3) — e.g. "process:app@project.iam.gserviceaccount.com" on
            a concept whose actor is the person who used that application.
            Absent when the caller acted as itself. Recorded rather than
            replaced: a write made through an application must stay
            distinguishable from one the person made directly.
          type: string
        producer:
          description: >
            The software that made this write, as the caller declared it
            with Ochakai-Producer — OKF SPEC §7's
            "<producer>/<version>" form, e.g. "insightflow/1.4.0" (design
            doc 0065 §4). Absent when the caller named none.
            It is the one field of an actor that is self-declared rather
            than observed from authentication, which is exactly why it
            sits beside kind/name instead of in them: read it as "what
            this caller says it was running", and read kind/name as who
            Google verified. Trust tier is unaffected — SPEC §5.3 derives
            it from the human: prefix alone.
          type: string
      required: [kind, name]
    Link:
      type: object
      description: >
        An edge to another concept, derived from a markdown link in the body.
        Links are untyped: OKF SPEC §5 leaves the kind of relationship to the
        surrounding prose.
      properties:
        target: { type: string, description: The target concept's id (its bundle path). }
        text:
          type: string
          description: >
            The anchor text the body used. Absent when the link carried none,
            in which case the target's last segment reads as the name.
      required: [target]
    Summary:
      type: object
      description: >
        The projection of one concept: enough to name it, order it, and
        decide whether to read it (design doc 0075 §3). It is derived
        from the document and never authoritative — the document is what
        the concept says, and this is an index over it. A client that needs
        a key not listed here reads the document; the projection carries
        what listing surfaces sort and filter by, and stops there.
      required: [id, type, status, trust, rejected, content_hash, created_at, updated_at]
      properties:
        id:
          type: string
          description: >
            The concept's bundle path — where it lives (the type says what
            it is): path segments separated by "/", the OKF concept ID
            (design docs 0075 §2, 0074 §3). OKF prescribes no character set,
            so only path safety constrains segments: no leading ".",
            no control characters, at most 128 bytes each (512 total).
            The final segment must not be "index" or "log"
            (OKF-reserved filenames). Stored NFC-normalized, as are
            link targets and file names (design doc 0074 §1.1).
          pattern: "^[^./][^/]{0,127}(/[^./][^/]{0,127})*$"
        type: { $ref: "#/components/schemas/Type" }
        title:
          type: string
          description: >
            The concept's own title, and absent when the document declared
            none — a reader derives one from the id's last segment (OKF
            SPEC §4.1: title is RECOMMENDED with no default, and "If
            omitted, consumers MAY derive a title from the filename";
            design doc 0074 §1). Not resolved here, unlike `status`, which
            SPEC §5.4 does give a normative default: filling that one in
            reports what the spec says the document means, while filling
            this one in would assert a value the document never declared
            (design doc 0064).
        description: { type: string }
        resource:
          type: string
          description: >
            Canonical URI of the underlying asset (OKF recommended key): the
            table/dataset URI, or for references the external source URL.
            Absent for abstract concepts.
        tags: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/Status" }
        stale_after:
          type: string
          format: date
          description: >
            Absolute date (YYYY-MM-DD) on and after which the concept is
            stale — OKF's lifecycle date (SPEC §5.5, design doc
            0069). A date rather than a TTL so staleness is a plain
            comparison against today. Advisory: nothing hides a stale
            concept and search ranking never reads it — a passed date means
            due for a re-check, not wrong. The one surface that reads it
            is sort=stale_after, the feed of concepts whose declared date
            has passed (design doc 0069 §2.2).
        trust:
          allOf: [{ $ref: "#/components/schemas/Trust" }]
          description: >
            Who has confirmed the concept, in OKF's own vocabulary (SPEC
            §5.3), derived from the verifications ledger. Independent of
            status: a draft may be human-reviewed and a stable concept
            unverified (design doc 0075 §4.1). Who confirmed
            it, and how often, is in observed.verified.
        verified_at:
          type: string
          format: date-time
          description: >
            When the newest confirmation was recorded, absent when there
            is none. A row carries it because it is what sort=verified_at
            ranks by — a reviewer reading that feed is reading these times.
        rejected:
          type: boolean
          description: >
            Whether a live rejection stands against the concept. The ruling
            itself — by whom, when, and why — is in observed.rejection.
        links:
          type: array
          items: { $ref: "#/components/schemas/Link" }
          description: >
            Derived from the markdown links in the document's body,
            recomputed on every write. OKF SPEC §6's two forms are read:
            bundle-absolute (/metrics/revenue.md) and relative
            (./revenue.md). http(s) URLs and non-.md files are not (the
            latter are files).
        content_hash:
          type: string
          description: >
            The concept's version: the hash of the document as stored, and
            the same value the ETag header carries (design doc 0075
            §3.2). Send it back as If-Match to write only if
            nothing changed meanwhile. Opaque — it covers the document
            alone, so a verification or a file leaves a held
            precondition valid, while a reformat moves it.
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: >
            When the row last moved — any write, a reformat included.
            When the *content* last changed is `observed.generated.at`
            (OKF SPEC §5.2): a write that changes the bytes without
            changing what they say moves this value and not that one
            (design doc 0064 §17).
    Generated:
      type: object
      description: >
        OKF's generated family (SPEC §5.2): who the content stands by, and
        when it last changed. `by` is not the creator — once somebody else
        edits a concept, the creator is no longer who the content stands by
        — and verifying moves neither value (design doc 0075 §3.2).
      properties:
        by: { $ref: "#/components/schemas/Actor" }
        at: { type: string, format: date-time }
      required: [by, at]
    Observed:
      type: object
      description: >
        What this instance saw happen to a concept, as against what the
        concept says. A bundle carries knowledge, and provenance is an
        observation this instance made (design doc 0009) — so it travels
        beside the document rather than inside it, and import never reads
        it back. Every value here is resolved from the caller's Google
        identity at the moment of the write, never from a payload: there
        is no request shape that can set any of them.
      properties:
        created_by: { $ref: "#/components/schemas/Actor" }
        generated: { $ref: "#/components/schemas/Generated" }
        verified:
          type: array
          items: { $ref: "#/components/schemas/Verification" }
          description: >
            Every recorded confirmation, oldest first. Absent means
            unverified, which is SPEC §5.3's own signal. Written by
            POST /api/v1/review/{id} with ruling: verified: this is an
            instance ledger, and
            import reads only whether a bundle's `verified` key was
            present (design docs 0009, 0075 §4.1).
        rejection:
          allOf: [{ $ref: "#/components/schemas/Rejection" }]
          description: >
            The live ruling, absent when there is none. Written by
            POST /api/v1/review/{id} with ruling: rejected, and cleared
            by ruling: withdrawn.
      required: [created_by, generated]
    View:
      type: object
      description: >
        A read of one concept: the document it is, the projection to read it
        by, and what this instance observed about it (design doc 0075
        §3). The document is the concept — the same shape an export
        writes, a PUT takes, and `ochakai get` prints — and `summary` is
        an index over it, so where the two could disagree the document is
        right.

        `id`, `document`, `summary` and `observed` are the whole of a
        read; `files`, `plan` and `notes` are there when there is
        something to say. A schema may not advertise a field the server
        does not write, which is checked rather than reviewed
        (`TestOpenAPISchemasMatchGoTypes`).
      required: [id, document, summary, observed]
      properties:
        id:
          type: string
          description: The concept's bundle path — the address this document was read from.
        document:
          type: string
          description: >
            The stored OKF document: YAML frontmatter, then markdown
            body — the bytes as they were written, normalized only for
            line endings, with the keys this instance owns (`generated`,
            `verified`) taken out and, when the document asserted any of
            them itself, kept under `received`. It is what content_hash is taken over
            (design doc 0075 §§3.1-3.2), so it can be
            edited and PUT back with nothing to strip, and the
            provenance those keys would have carried is in `observed`
            instead. Fetch the export form, server-owned keys included,
            with "Accept: text/markdown".
        summary: { $ref: "#/components/schemas/Summary" }
        observed: { $ref: "#/components/schemas/Observed" }
        files:
          type: array
          items: { $ref: "#/components/schemas/File" }
          description: >
            File metadata (no bytes — fetch them via
            /api/v1/bundle/{path}, which is also where they are written).
            Absent when the concept has none.
        linked_from:
          type: array
          items: { $ref: "#/components/schemas/Backlink" }
          description: >
            The concepts whose bodies link at this one — the one thing a
            concept's own document cannot say, because the insight that
            explains a metric points at the metric, not the other way
            round (design doc 0106). Rows in address order, capped at
            20; the complete, pageable reverse lookup is
            /api/v1/search?links_to=. Absent when nothing links here,
            and on the answer to a write.
        plan:
          type: string
          enum: [created, updated, unchanged]
          description: >
            What the write did, on the answer to a write: the id was
            free, the stored concept was replaced, or the bytes matched
            what was there and nothing was written. **Absent on a read**,
            which did none of the three.

            The same word `Ochakai-Plan` carries on a dry run and
            `Ochakai-Unchanged` reports after a real one. It is here as
            well because a header is the one part of an answer that
            `curl` does not print and a generated client does not hand
            back by default (design doc 0097); the headers stay because
            header names are inside the freeze (design doc 0082 §2).
        notes:
          type: array
          items: { type: string }
          description: >
            The values this write's document carried that the server read
            differently than they were written — an unrecognized status,
            a date it could not parse, a trust family kept as the
            document's own claim. One string per reinterpretation, in the
            order the parse produced them, saying what was written and
            what it was read as. A reinterpretation is never silent
            (design doc 0075 §3.1); this is where it is said (design doc
            0113), and the repeated `Ochakai-Note` header carries the
            same strings for a caller reading the document
            representation. **Absent on a read**, which parsed no
            document the caller sent, and absent when the write had
            nothing to report.
    File:
      type: object
      description: >
        A file beside a knowledge concept — a dashboard screenshot, an
        ER diagram, a seeds file (design doc 0075 §1).
        Metadata travels with the concept; bytes are a separate,
        deliberate fetch so agent context is never flooded with base64.

        **This is ochakai's, not OKF's.** SPEC v0.2 is markdown-centric:
        §3 calls a bundle "a directory tree of markdown files", §11's
        conformance clauses speak only of `.md` files, and non-markdown
        content is neither permitted nor forbidden — it is not addressed,
        and the spec gives it no name, no metadata fields and no rule for
        a consumer. So there is no OKF vocabulary this schema could be
        aligned to, and the words below are ochakai's own. Note that
        SPEC's `resource` (§4.1) is a different thing entirely — the
        external asset a concept *describes*, not a file stored beside
        it. Bundles ochakai writes stay readable by an OKF consumer: the
        concepts are conformant and these files are ordinary files in the
        tree, which the spec has nothing to say about either way — with
        one exception it does speak to, which is why a file's path may not
        end in `.md`. That suffix is where §3.1 says a concept document
        lives, and a file sitting at one made every export carrying it
        fail §11 (design doc 0100).
      properties:
        name: { type: string, description: Filename, unique within the concept. }
        media_type:
          type: string
          description: >
            Sniffed from the bytes, never taken from the client. Any type:
            a bundle carries what it carries (design doc 0075 §1), and
            what a browser may do with it is decided when it is served.
        size: { type: integer }
        sha256: { type: string, description: Content hash; files are content-addressed and immutable. }
        path:
          type: string
          description: >
            Where the file lives in the bundle — its address, and what an
            export writes it back as. A file written through this address
            is at `<id>/<name>`; one written at its own bundle path is
            there, which is how a foreign layout round-trips (design doc
            0075 §5). `name` is the last segment, beside it the way a
            concept keeps its id beside its path.
        created_by: { $ref: "#/components/schemas/Actor", readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
      required: [name, media_type, size, sha256, path, created_by, created_at]
    Usage:
      type: object
      properties:
        search_hits: { type: integer, description: Times the concept appeared in search results. }
        fetches: { type: integer, description: Times the concept was fetched individually. }
        worked: { type: integer, description: Outcome reports saying the concept led to a correct result. }
        failed: { type: integer, description: Outcome reports saying the concept led to a wrong or unusable result. }
        last_used_at: { type: string, format: date-time }
        recent:
          type: object
          description: >
            The same activity inside a fixed recent window, and what the
            `usage` and `failed` listings are ordered by (design doc
            0090). The counters above are lifetime and never decay, so
            ranking on them left a concept that was read a lot in a
            knowledge base's first month at the top of the promotion
            queue for as long as the deployment lived, and a long-ago
            repeat offender above the concept failing this week.


            The window travels with the counts because a count whose
            period is implicit is one a reader cannot check. Two counts
            and not four: `search_hits` is not demand — one is recorded
            for every id in every result set — and nothing ranks on
            `worked`.
          properties:
            days: { type: integer, description: How far back the two counts below reach. }
            fetches: { type: integer, description: Times the concept's body was delivered in the window. }
            failed: { type: integer, description: Outcome reports of failure in the window. }
          required: [days, fetches, failed]
      required: [search_hits, fetches, worked, failed, recent]
    Stats:
      description: >
        The instance-level view of the loop (design doc 0069 §5). State
        fields describe the base as it stands; flow fields cover the last
        `window_days`.
      type: object
      properties:
        at: { type: string, format: date-time, description: When the server computed this. }
        scope:
          type: array
          items: { type: string }
          description: >
            The subtrees these counts cover, **absent when they cover the
            whole bundle** and present whenever they do not — because the
            caller asked with `prefix`, or because an access policy grants
            them part of the bundle (design doc 0123). An empty array
            means the caller can see none of what is counted here, and
            every number below is zero for that reason rather than
            because nothing happened.


            Two of the numbers are the instance's however this is set,
            because neither can be scoped: `misses` have no concept id to
            scope by (which is why a scoped caller gets them withheld
            rather than narrowed), and `dropped` counts events the server
            lost before it knew what they were about.
        window_days: { type: integer, description: How far back the flow numbers reach. }
        sandbox:
          type: boolean
          description: >
            Present and true on a disposable public deployment (design
            doc 0087): anyone may write, nobody is identified, and the
            whole base is restored on a schedule. It travels with the
            loop's own numbers because that is what a client reads
            before deciding whether to trust them — or whether to
            curate anything here at all. Absent everywhere else.
        insecure_dev:
          type: boolean
          description: >
            Present and true on a deployment running with authentication
            off (`OCHAKAI_MODE=dev`). Design doc 0087's argument applied
            to the mode beside it: a deployment that does not say what it
            is takes what you write. What it takes here is different —
            nothing is erased, but no caller is authenticated and the
            identity recorded on a ruling is whatever was asked for, so
            "a human confirmed this" means nothing on such a base.

            `dev` tells its own readers not to deploy it, which is why
            this is worth carrying: the deployments that need telling are
            the ones that did it anyway. Absent everywhere else.
        files:
          type: object
          description: >
            Whether this deployment can hold file bytes at all, and — for
            a caller who could change that — the variable that would
            (design doc 0131). A deployment with no bucket stores markdown
            concepts only, and every read, write or listing of a file on
            one of those answers 501, so a face that offers a file there
            is offering a refusal: the bundled web UI reads this and stops
            offering it.


            The object is **absent on a server that predates it**, which
            is not the same answer as `enabled: false` — one is a
            deployment that cannot take files, the other is a server that
            was never asked. A client that branches on this reads the
            object's presence first.
          properties:
            enabled:
              type: boolean
              description: >
                Whether file bytes have somewhere to live
                (`OCHAKAI_GCS_BUCKET`, design doc 0075 §1).
            variable:
              type: string
              description: >
                The environment variable that would enable files,
                `OCHAKAI_GCS_BUCKET`. **Absent unless files are off and
                this caller holds the whole bundle** — the same test the
                rest of the administrator's operations take. The sentence
                is only useful to somebody who can act on it, and on a
                shared deployment it is noise for everybody else.
          required: [enabled]
        concepts:
          type: object
          description: What the base is made of. Deleted concepts are in none of it.
          properties:
            total: { type: integer, description: "State: live concepts." }
            status:
              type: object
              additionalProperties: { type: integer }
              description: >
                State: live concepts per lifecycle value, every value of the
                vocabulary present (0 included). A concept whose document
                names no status counts as OKF's default, `stable`, which is
                how every other surface reads it.
            trust:
              type: object
              additionalProperties: { type: integer }
              description: >
                State: live concepts per trust tier (SPEC §5.3), every tier
                present. This is the tally behind "is the confirmed share
                growing".
            rejected:
              type: integer
              description: >
                State: live concepts carrying this instance's rejection. They
                are counted in status and trust as well — a rejection is a
                ruling beside the lifecycle value, not one of them.
            created: { type: integer, description: "Flow: live concepts created in the window." }
          required: [total, status, trust, rejected, created]
        queues:
          allOf: [ { $ref: "#/components/schemas/QueueCounts" } ]
          description: >
            State: how much each review queue is holding right now (design
            doc 0069 §5 kept this place for the metrics beside it), and
            since 0069 §5 the only place it is answered — `prefix`
            scopes it like everything else here. When the question is only
            "is there anything", `ochakai stats` prints these three with
            the next step on each line, and its `--exit-code` is what a
            scheduled job goes red on.
        review:
          type: object
          description: The human side of the loop, as a flow — what is waiting is `queues`.
          properties:
            verifications:
              type: integer
              description: >
                Flow: verifications recorded in the window, counted from the
                ledger — re-verifying a concept counts each time. This is what
                answers "how much moved through review last week", which no
                queue depth can: a queue says what is left, never what went
                through.
            weekly:
              type: array
              description: >
                The same flow as a shape: eight buckets of seven days,
                oldest first, counted back from today rather than as
                calendar weeks — a calendar week would make the newest
                bucket a partial one whose dip is the calendar rather
                than the curator (design doc 0095).

                Verifications and not queue depth, because the ledger
                records every ruling with its time and **nothing
                snapshots how deep a queue was last month**. A trend
                rebuilt from revisions would be a number that looks
                right and is not.

                Absent on a base nobody has ruled on yet: eight zeroes
                read as "review stopped", and "review has not started"
                is a different thing to say. Its window is fixed and
                does not follow `days`.
              items:
                type: object
                properties:
                  from:
                    type: string
                    format: date
                    description: The bucket's first day.
                  verifications: { type: integer }
                required: [from, verifications]
          required: [verifications]
        outcomes:
          type: object
          description: "Flow: what callers reported back in the window (report_outcome)."
          properties:
            worked: { type: integer }
            failed: { type: integer }
            concepts_used:
              type: integer
              description: >
                Distinct concepts handed over in the window — delivered in
                full, not merely listed in a ranking. Appearing in search
                results is the ranker's opinion, not use, and counting it
                would make the coverage below look better the more results
                a search returned.
            concepts_reported:
              type: integer
              description: >
                How many of `concepts_used` came back with an outcome —
                the coverage of the loop's evidence edge.


                Without it the two counts above cannot be read.
                `report_outcome` is the one signal nobody is obliged to
                send, and an agent that never calls it leaves the
                re-verification feed empty — which is also what a healthy
                knowledge base looks like. The gap between these two
                numbers says which of the two a deployment is looking at.
          required: [worked, failed, concepts_used, concepts_reported]
        misses:
          type: object
          description: >
            Flow: the searches that found nothing — the questions this base
            could not answer, which is the list of what to write next.
          properties:
            recording:
              type: boolean
              description: >
                Whether this deployment keeps misses at all. False makes the
                two fields below meaningless rather than zero: a public
                deployment keeps none (it reads no identity either), and any
                deployment can turn recording off with
                OCHAKAI_RECORD_MISSES=false.
            withheld:
              type: boolean
              description: >
                Present and true when the caller reads part of the bundle
                (`scope` above) and these are the whole instance's, so
                they are not shown. A miss carries no concept id (design
                doc 0069), so there is nothing to narrow it by, and
                showing it unnarrowed would tell one team what every
                other team searched for. Like `recording: false` it makes
                the two fields below meaningless rather than zero; unlike
                it, the remedy is to ask an administrator rather than to
                change a setting (design doc 0123). Absent otherwise.
            count: { type: integer, description: Every miss in the window, including queries not listed below. }
            queries:
              type: array
              description: The most-asked unanswered questions, most first (at most 10).
              items:
                type: object
                properties:
                  query: { type: string, description: The query as it was typed (kept up to 500 bytes). }
                  count: { type: integer }
                  last_at: { type: string, format: date-time }
                required: [query, count, last_at]
          required: [recording, count, queries]
        embedding:
          type: object
          description: >
            State: how much of the base the vector half of search can
            actually see. A concept longer than the model's input window
            is embedded from its front and the rest is dropped (design
            doc 0089), and nothing about the result looks wrong — the
            concept has a vector, ranks, and comes back. It is simply
            unfindable by anything said in its second half.


            Read the two numbers together. `truncated` alone says how
            many; against `vectors` it says whether this is one long
            runbook or the shape of the corpus, which want different
            answers — split the concept, or move the deployment to a
            model with a wider window. Concepts, not files: an
            attachment's text is capped the same way and is not counted
            here.
          properties:
            enabled:
              type: boolean
              description: >
                False where no embedder is configured. Without it
                `vectors: 0` is ambiguous — no semantic search and an
                entirely unembedded corpus read the same and want
                different actions.
            vectors:
              type: integer
              description: >
                Live concepts holding a vector for the model in use.
                `concepts.total` minus this is what `ochakai reembed`
                has left to do.
            truncated:
              type: integer
              description: Of those, how many saw only the front of their concept.
          required: [enabled, vectors, truncated]
        dropped:
          type: object
          description: >
            Flow: observations the loop made and then lost inside the
            window — the footnote every other number here depends on.
            Usage is best-effort by decision (design doc 0029 §3.1): it
            buffers in memory, refuses events past a cap rather than
            growing without bound, and loses a batch whose write fails
            instead of keeping a retry queue. On Cloud Run an instance is
            killed on scale-to-zero and on every rollout, so this is not
            an exotic number.


            Zero is what makes the rest trustworthy: with anything else
            here, the counts above undercount by at least that much.
            Unscoped by `prefix`, for the reason misses are — a dropped
            batch is a number, and the ids that were in it are gone.
          properties:
            events:
              type: integer
              description: Search hits, fetches and outcome reports lost together.
            misses:
              type: integer
              description: Unanswered questions lost the same two ways.
          required: [events, misses]
      required: [at, window_days, concepts, queues, review, outcomes, misses, embedding, dropped]
    QueueCounts:
      type: object
      description: >
        The size of each queue a curator is meant to empty. Each one is a
        feed that already exists, and every count has a way to be driven
        to zero: rule on the draft, verify the concept that was reported
        wrong, edit the one whose expiry passed.


        A queue is named after the `sort` that lists it, so the count and
        the way to see what it counts are one word (design doc 0069 §5.2).
        `drafts` is the exception, and names itself, because no single
        sort lists it.
      properties:
        drafts:
          type: integer
          description: >
            Drafts waiting to be published or turned down — GET
            /api/v1/search?sort=usage&status=draft. It takes a filter as
            well as a sort, which is why this one keeps a name of its own
            (design doc 0069 §5.2). Verifying does not empty it:
            confirming and publishing are different acts, so a draft
            leaves when it is edited to another status or rejected
            (design doc 0069 §2).
        failed:
          type: integer
          description: >
            Concepts whose failure reports are still unanswered —
            sort=failed, the listing this count is keyed by (design doc
            0069 §5.2). Verifying takes one out.
        stale_after:
          type: integer
          description: >
            Concepts past the stale_after their author declared —
            sort=stale_after. Verifying does not clear this one: the date
            is the writer's declaration, so the concept leaves when someone
            edits it (design doc 0069 §2.2).
      required: [drafts, failed, stale_after]
    SearchHit:
      description: >
        One search or listing result: the projection plus what ranked it.
        **A hit does not carry the concept** (design doc 0067 §4) — a page
        of ten documents answering "which of these should I read" spends
        the caller's context on the nine it will not. The document is one
        fetch away by id.

        REST hits carry file metadata (filled in batch) so UIs can
        render image previews without a fetch per concept; MCP search
        results omit it to keep agent context lean (design doc 0067 §1).
      allOf:
        - $ref: "#/components/schemas/Summary"
        - type: object
          properties:
            score: { type: number }
            snippet:
              type: string
              description: >
                The passage of the body where the query's own words land,
                cut to a readable window and marked with … where it was
                cut. It answers "why did this match?", which title and
                description cannot: they say what somebody wrote about
                the concept as a whole, and a caller deciding which of
                ten hits to open was paying a fetch per row to find out.

                Absent when there is no passage to show — the words
                landed in the name or the description, where the hit
                already shows the match, or the concept was found by
                meaning rather than by text (the vector half), where the
                opening of the body would not be the reason it matched.
                Listings carry no snippet: they have no query.
            usage:
              allOf: [ { $ref: "#/components/schemas/Usage" } ]
              readOnly: true
              description: >
                Usage totals, present in the sort=usage listing (the draft
                review feed) and the sort=failed listing (the re-verification
                feed); absent for search results and the verified_at feed.
            files:
              type: array
              items: { $ref: "#/components/schemas/File" }
              readOnly: true
              description: >
                File metadata for this row — a file beside the
                concept rather than part of its projection, which is why it
                is here and not in Summary. REST only.
          required: [score]
    Backlink:
      type: object
      description: >
        One row of a read's `linked_from`: a concept whose body links at
        the one being read — the fields a caller needs to decide whether
        to spend a fetch on it, the description carrying the weight
        (design doc 0106). No score: the answer is a set, not a ranking,
        which is the links_to filter's own rule.
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/Type" }
        title:
          description: >
            The concept's own title, absent when the document declared none
            — a reader derives one from the id's last segment (OKF SPEC
            §4.1, design doc 0074 §1).
          type: string
        description: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        trust: { $ref: "#/components/schemas/Trust" }
      required: [id, type, status, trust]
    BundleListing:
      type: object
      description: >
        `index.md` as structure — one level of the tree, which is what a
        web UI's navigator needs and what the markdown says in prose
        (design doc 0075 §4.2). Two representations of one generated
        file, at one address; the JSON is not a second surface.

        Three kinds of thing sit in a directory and the listing carries
        all three (design doc 0075 §4.2): the subdirectories, the
        concepts, and the files — a file is an object in the bundle
        rather than a property of a concept (design doc 0075 §5), so a directory can
        hold one that no concept shows.
      properties:
        dirs:
          type: array
          items:
            type: object
            properties:
              name: { type: string, description: Next ID segment. }
              count:
                description: >
                  Concepts anywhere beneath. Concepts only: a directory
                  holding nothing but files is not a subdirectory here,
                  because OKF's listing is navigation between concept
                  documents and a mixed count would misdescribe every
                  directory that has both.
                type: integer
            required: [name, count]
        concepts:
          type: array
          items:
            type: object
            properties:
              type: { $ref: "#/components/schemas/Type" }
              id: { type: string }
              title: { type: string, description: "The concept's own title, absent when the document declared none — a reader derives one from the id's last segment (OKF SPEC §4.1, design doc 0074 §1)." }
              description: { type: string, description: The one-line summary, so a directory listing can render as an index page. }
              status: { $ref: "#/components/schemas/Status" }
              updated_at: { type: string, format: date-time }
            required: [type, id, status, updated_at]
        files:
          description: >
            The files sitting directly in this directory, in path order.
          type: array
          items:
            type: object
            properties:
              name: { type: string, description: The last path segment — what the directory holds it under. }
              path: { type: string, description: The object's bundle path, which is what it is addressed by. }
              media_type: { type: string, description: Sniffed from the bytes when it was written, never taken from the caller. }
              size: { type: integer, description: Bytes. }
              created_at: { type: string, format: date-time }
            required: [name, path, media_type, size, created_at]
        truncated:
          type: boolean
          description: >
            The concept or file list hit the 1000-per-page cap. It says
            what it has always said about the page it describes; what has
            changed is that `cursor` beside it is the way past the cap
            (design doc 0101). Removing it would be a removal from a
            response, which the freeze holds, so it stays until 1.0.
        cursor:
          type: string
          description: >
            Where the next page of this level resumes, absent on the last
            one — a listing gives no total, and the absence is the whole
            of "there is no more" (design doc 0068 §2.1). Opaque: hand
            back what arrived, with the same prefix. A cursor from another
            level is a 400 naming both, because resuming one directory
            from another's position would skip rows in both. The
            subdirectories are on the first page only.
    BundleLog:
      type: object
      description: >
        `log.md` as structure — the same update history the markdown
        publishes, newest first, bounded by `limit`. It is an instance
        ledger rather than knowledge: an import never reads it back, the
        same way it never reads back `generated` (design doc 0009).

        Each row names the object by its **path**: a revision is an event
        about an object (design doc 0075 §1), and a file has no concept
        id — a history keyed on the id would leave every attach and
        detach out of the one it belongs in.
      required: [changes]
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/Change" }
    Change:
      type: object
      description: >
        One line of a directory's update history: what happened to which
        object, when, and by whom. The document each revision holds is
        deliberately not here — a directory's history carrying every past
        version of every concept under it would be the knowledge base
        several times over. `?history` on the object is where those are.
      properties:
        path: { type: string, description: The object's bundle path. }
        title: { type: string, description: "The object's own title as it stands — absent when the document declared none, for a file, and for a concept since purged; a reader derives one from the path's last segment (OKF SPEC §4.1, design doc 0074 §1)." }
        change:
          type: string
          description: >
            What happened, as one word. **An open set: treat a value you
            do not know as an event you have nothing special to render
            for, and do not fail on it.** Today's rows carry `create`,
            `update`, `verify`, `reject`, `withdraw`, `delete`, `move`,
            `add_file`, `remove_file`, and that list is the ledger's
            vocabulary rather than the wire's promise — it has moved
            twice already (`unreject` became `withdraw`, `attach` and
            `detach` became `add_file` and `remove_file`, each with a
            migration rewriting the stored rows). The last two sit on
            historical rows only: they date from when a file event was a
            revision of its concept, and since a file became an object
            at its own path (design doc 0075 §5) a new file event is
            that path's own `create` or `delete`. A closed enum here
            would make the tenth word a breaking change, which after the
            freeze is a word that can never be added (design doc 0064
            §20.3). The current spelling is counted in docs/surface.md's
            VOCAB, where adding one is a decision that shows in a diff.
        changed_by: { $ref: "#/components/schemas/Actor" }
        changed_at: { type: string, format: date-time }
      required: [path, change, changed_by, changed_at]
    ObjectHistory:
      type: object
      description: >
        `?history` on a concept's own address: its revisions, newest
        first, each carrying the whole concept as it stood, as an OKF
        document — so a diff between two revisions is a text diff
        (design doc 0075 §4).
      required: [revisions]
      properties:
        revisions:
          type: array
          items: { $ref: "#/components/schemas/Revision" }
    Revision:
      type: object
      description: >
        One concept in a knowledge concept's change history: who changed it,
        how, when, and the whole concept as it stood, as an OKF document.
      properties:
        rev: { type: integer, description: 1-based, monotonically increasing per concept. }
        change:
          type: string
          description: >
            What happened, as one word. **An open set: treat a value you
            do not know as an event you have nothing special to render
            for, and do not fail on it.** Today's rows carry `create`,
            `update`, `verify`, `reject`, `withdraw`, `delete`, `move`,
            `add_file`, `remove_file`, and that list is the ledger's
            vocabulary rather than the wire's promise — it has moved
            twice already (`unreject` became `withdraw`, `attach` and
            `detach` became `add_file` and `remove_file`, each with a
            migration rewriting the stored rows). The last two sit on
            historical rows only: they date from when a file event was a
            revision of its concept, and since a file became an object
            at its own path (design doc 0075 §5) a new file event is
            that path's own `create` or `delete`. A closed enum here
            would make the tenth word a breaking change, which after the
            freeze is a word that can never be added (design doc 0064
            §20.3). The current spelling is counted in docs/surface.md's
            VOCAB, where adding one is a decision that shows in a diff.
        changed_by: { $ref: "#/components/schemas/Actor" }
        changed_at: { type: string, format: date-time }
        document:
          type: string
          description: >
            The concept as it stood after this change, as an OKF document
            (design doc 0075). It replaced a JSON snapshot of the
            server's own struct: a record whose shape depends on the
            reader knowing every past release is the distortion, not the
            fidelity, and it also means a diff between two revisions
            reads. The keys this instance owns are included — a revision
            records what the concept was, and who had confirmed it then is
            part of that.
      required: [rev, change, changed_by, changed_at, document]
