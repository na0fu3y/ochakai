openapi: 3.1.0
info:
  title: ochakai REST API
  description: >
    ochakai is a context provider for data agents: semantic models, metric
    definitions, verified golden queries, interpretation knowledge, glossary
    terms, dataset and table catalog entries, and references (mirrors of
    external material) in one knowledge base. The REST API is a superset
    of the MCP tools — the same operations plus bulk export, the
    human-facing browse/revisions/backlinks reads, and attachment writes —
    so users can build their own web UIs. ochakai executes no SQL and uses
    no LLM.
  version: 0.14.0
  license:
    name: MIT
servers:
  - url: /
# Authentication is Cloud Run IAM (Google identity), handled by the
# infrastructure before requests reach ochakai — there is no
# application-level auth scheme. ochakai reads the forwarded identity
# only to record provenance (design docs 0002/0003). An application on
# the delegator allowlist may forward the end user it acts for with
# X-Ochakai-On-Behalf-Of (design doc 0027) — the header is honored on
# every call; it is declared below (components/parameters/OnBehalfOf)
# on the operations that record provenance.
paths:
  /api/v1/knowledge:
    get:
      operationId: searchKnowledge
      summary: Search knowledge (lexical, plus hybrid vector search when configured)
      description: >
        Rejected entries are excluded unless the status filter explicitly
        includes rejected (so agents can check for already-rejected proposals).
        With sort=verified_at the endpoint lists entries by verification age
        (oldest first, never-verified last) instead of searching — the feed
        for golden query canary runs (docs/guides/golden-query-canary.md).
        With sort=usage it lists by demand (most search_hits first, never-used
        oldest-first at the bottom) and each hit carries its usage totals —
        the draft review/promotion feed.
        With sort=failed it lists entries whose failure reports
        (report_outcome failed) are still unanswered, worst first, and each
        hit carries its usage totals — the re-verification feed. An entry
        drops out once it is verified after its last failure report
        (POST /api/v1/verify/{id}), so a base that is kept up shows an
        empty feed.
        With sort=stale_after it lists entries whose author declared a
        stale_after that has now passed, most overdue first — the feed for
        knowledge dated by whoever wrote it (design doc 0037 §2.1).
        Entries whose expiry has not come due are not listed. Unlike the
        two feeds above, verifying does not clear this one: the date is
        the writer's declaration, so an entry leaves only when someone
        edits it to declare a new expiry (or removes the declaration).
        Exactly one of q and sort is required: combining them is a 400,
        and so is omitting both (searching needs a query to rank by).
        source is a filter rather than a mode, so it composes with either.
      parameters:
        - name: q
          in: query
          description: Search text. Required unless sort is set.
          schema: { type: string }
        - name: sort
          in: query
          description: Mutually exclusive with q.
          schema: { type: string, enum: [verified_at, usage, failed, stale_after] }
        - name: type
          in: query
          schema: { type: array, items: { $ref: "#/components/schemas/Type" } }
          explode: true
        - name: status
          in: query
          schema: { type: array, items: { $ref: "#/components/schemas/Status" } }
          explode: true
        - name: tag
          in: query
          schema: { type: array, items: { type: string } }
          explode: true
        - name: source
          in: query
          description: >
            Only entries citing this resource — the reverse of
            sources[].resource, for "this material changed, what derives
            from it?" (design doc 0037 §2.3). Matched exactly: no prefix
            or substring matching, and sources[].id is not consulted
            because it keys a document's own footnotes rather than
            identifying an artifact across entries. Single-valued, unlike
            tag. Composes with q and with any sort.
          schema: { type: string }
        - name: limit
          in: query
          description: >
            Searching: default 10, max 50. With any sort the feed reads
            more per page:
            default 100, max 1000. Out-of-range values fall back to the
            default; non-integer values are a 400.
          schema: { type: integer }
      responses:
        "200":
          description: >
            Scored hits, verified entries boosted. With sort=verified_at,
            hits are in verification-age order and carry score 0. With
            sort=usage or sort=failed, hits carry score 0 and each
            populates the usage object (demand order, resp. worst-failed
            first).
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits:
                    type: array
                    items: { $ref: "#/components/schemas/SearchHit" }
              examples:
                search:
                  summary: GET /api/v1/knowledge?q=monthly+revenue&limit=3
                  description: >
                    A hit is the whole entry plus its score, so the golden
                    query's SQL is already here — no second call to read it.
                    Attachment metadata rides along (filled in one batch),
                    which is what lets a UI render thumbnails from a search.
                  value:
                    hits:
                      - type: Golden Query
                        id: queries/monthly-revenue
                        description: Monthly net revenue for the last 12 complete months.
                        tags: [finance]
                        status: verified
                        created_by: { kind: human, name: tanaka@example.co.jp }
                        updated_by: { kind: human, name: tanaka@example.co.jp }
                        verified_by: { kind: human, name: sato@example.co.jp }
                        verified_at: "2026-07-10T01:52:16.774301Z"
                        links:
                          - { target: metrics/revenue, text: Revenue }
                        attrs:
                          question: How much revenue did we make each month last year?
                          sql: |
                            SELECT DATE_TRUNC(order_date, MONTH) AS month,
                                   SUM(net_amount) AS revenue
                            FROM `example-analytics.shop.orders`
                            WHERE status = 'completed'
                              AND order_date >= DATE_TRUNC(DATE_SUB(CURRENT_DATE(), INTERVAL 12 MONTH), MONTH)
                              AND order_date < DATE_TRUNC(CURRENT_DATE(), MONTH)
                            GROUP BY month
                            ORDER BY month
                        body: |
                          Answers "how much did we make each month last year?"
                          against [Revenue](/metrics/revenue.md). Completed
                          orders only; the month boundary is `order_date`, not
                          the settlement date.
                        created_at: "2026-06-09T07:41:02.110945Z"
                        updated_at: "2026-07-10T01:52:16.774301Z"
                        score: 1.35
                      - type: Metric
                        id: metrics/revenue
                        title: Revenue
                        description: Net revenue from completed orders, excluding tax and shipping.
                        resource: bigquery://example-analytics.shop.orders
                        tags: [finance, core]
                        status: verified
                        stale_after: "2026-12-31"
                        created_by: { kind: human, name: tanaka@example.co.jp }
                        updated_by: { kind: human, name: tanaka@example.co.jp }
                        verified_by: { kind: human, name: sato@example.co.jp }
                        verified_at: "2026-07-14T02:33:41.019778Z"
                        links:
                          - { target: glossary/completed-order, text: completed order }
                          - { target: tables/shop-orders, text: shop.orders }
                        attrs: { unit: JPY, grain: order }
                        body: |
                          Revenue is the sum of `net_amount` over every
                          [completed order](/glossary/completed-order.md) in
                          [shop.orders](/tables/shop-orders.md). Tax and
                          shipping are excluded.
                        attachments:
                          - name: revenue-2026h1.png
                            media_type: image/png
                            size: 48213
                            sha256: 9f2c1d0a7b3e5648c1d9f0a2b7e4c8d63f5a1b2c9e0d7a4f6b3c8e1d5a0f7b29
                            created_by: { kind: human, name: tanaka@example.co.jp }
                            created_at: "2026-06-02T04:20:11.663210Z"
                        created_at: "2026-06-02T04:11:38.201044Z"
                        updated_at: "2026-07-14T02:33:41.019778Z"
                        score: 0.48
                      - type: Insight
                        id: insights/revenue-seasonality
                        title: Reading revenue month over month
                        description: Why a December spike and a January drop are normal.
                        tags: [finance]
                        status: draft
                        stale_after: "2027-01-31"
                        created_by: { kind: agent, name: analyst@example.iam.gserviceaccount.com }
                        updated_by: { kind: agent, name: analyst@example.iam.gserviceaccount.com }
                        links:
                          - { target: metrics/revenue, text: Revenue }
                        body: |
                          [Revenue](/metrics/revenue.md) is seasonal: December
                          runs well above the trailing median and January falls
                          back below it. Comparing either month with the one
                          before it says nothing about the business — compare
                          year over year instead.
                        created_at: "2026-07-21T06:14:55.402881Z"
                        updated_at: "2026-07-21T06:14:55.402881Z"
                        score: 0.43
                usageFeed:
                  summary: GET /api/v1/knowledge?sort=usage&status=draft
                  description: >
                    The draft review feed. A listing ranks by demand rather
                    than by text, so every hit carries score 0 and the usage
                    totals that make the promotion case.
                  value:
                    hits:
                      - type: Insight
                        id: insights/revenue-seasonality
                        title: Reading revenue month over month
                        description: Why a December spike and a January drop are normal.
                        tags: [finance]
                        status: draft
                        stale_after: "2027-01-31"
                        created_by: { kind: agent, name: analyst@example.iam.gserviceaccount.com }
                        updated_by: { kind: agent, name: analyst@example.iam.gserviceaccount.com }
                        links:
                          - { target: metrics/revenue, text: Revenue }
                        body: |
                          [Revenue](/metrics/revenue.md) is seasonal: December
                          runs well above the trailing median and January falls
                          back below it.
                        created_at: "2026-07-21T06:14:55.402881Z"
                        updated_at: "2026-07-21T06:14:55.402881Z"
                        score: 0
                        usage:
                          search_hits: 74
                          fetches: 31
                          worked: 6
                          failed: 0
                          last_used_at: "2026-07-26T23:58:07.336114Z"
                      - type: Glossary Term
                        id: glossary/completed-order
                        description: An order that shipped and was not refunded within the return window.
                        status: draft
                        created_by: { kind: human, name: tanaka@example.co.jp }
                        updated_by: { kind: human, name: tanaka@example.co.jp }
                        body: |
                          `status = 'completed'` in
                          [shop.orders](/tables/shop-orders.md): shipped, paid,
                          and past the 14-day return window.
                        created_at: "2026-06-02T04:09:12.774903Z"
                        updated_at: "2026-06-02T04:09:12.774903Z"
                        score: 0
                        usage:
                          search_hits: 12
                          fetches: 4
                          worked: 1
                          failed: 0
                          last_used_at: "2026-07-25T02:41:19.008457Z"
        "400":
          description: Error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
              examples:
                queryAndSortTogether:
                  summary: q and sort are mutually exclusive
                  value:
                    error: sort=usage lists entries; it cannot be combined with a search query (q)
                noQuery:
                  summary: Neither q nor sort was given
                  value:
                    error: search needs a query; use sort=verified_at, usage, or failed to list entries without one
    post:
      operationId: createKnowledge
      summary: Create a knowledge entry
      description: >
        Entries default to draft. Anyone who can reach ochakai may set
        status=verified; verified_by records who did (provenance over
        authorization). A live entry with the same id is a 409 —
        including rejected ones — but creating over a soft-deleted entry
        revives it (its prior history stays in the revisions).
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Knowledge" }
            examples:
              goldenQuery:
                summary: A Golden Query — question and SQL in attrs
                description: >
                  question and sql are producer keys, so they belong in
                  attrs; the keys OKF v0.2 defines (sources, usage_window,
                  the computation contract) are envelope fields instead.
                  No title: the id's last segment names the entry (design
                  doc 0022). Links are not sent — the body's markdown link
                  to /metrics/revenue.md becomes one.
                value:
                  type: Golden Query
                  id: queries/monthly-revenue
                  description: Monthly net revenue for the last 12 complete months.
                  tags: [finance]
                  attrs:
                    question: How much revenue did we make each month last year?
                    sql: |
                      SELECT DATE_TRUNC(order_date, MONTH) AS month,
                             SUM(net_amount) AS revenue
                      FROM `example-analytics.shop.orders`
                      WHERE status = 'completed'
                        AND order_date >= DATE_TRUNC(DATE_SUB(CURRENT_DATE(), INTERVAL 12 MONTH), MONTH)
                        AND order_date < DATE_TRUNC(CURRENT_DATE(), MONTH)
                      GROUP BY month
                      ORDER BY month
                  body: |
                    Answers "how much did we make each month last year?"
                    against [Revenue](/metrics/revenue.md). Completed
                    orders only; the month boundary is `order_date`, not
                    the settlement date.
              insightCaveat:
                summary: An Insight — the caveat that keeps a metric from being misread
                description: >
                  stale_after dates the knowledge from the writer's side:
                  the seasonal claim is worth re-checking once next January
                  is in. sources cites the material it rests on.
                value:
                  type: Insight
                  id: insights/revenue-seasonality
                  title: Reading revenue month over month
                  description: Why a December spike and a January drop are normal.
                  tags: [finance]
                  stale_after: "2027-01-31"
                  sources:
                    - id: fy2025-review
                      resource: https://wiki.example.co.jp/finance/fy2025-review
                      title: FY2025 revenue review
                      author: human:sato@example.co.jp
                      last_modified: "2026-04-08"
                  body: |
                    [Revenue](/metrics/revenue.md) is seasonal: December runs
                    well above the trailing median and January falls back
                    below it. Comparing either month with the one before it
                    says nothing about the business[^fy2025-review].

                    Compare year over year, or against the same month's
                    three-year median. A month-over-month drop in January is
                    not a regression to investigate.

                    [^fy2025-review]: FY2025 revenue review.
              attestedComputation:
                summary: An Attested Computation — the contract as envelope fields
                description: >
                  runtime is required for this type and for no other (design
                  doc 0036 §3.4); executor.receipt names what a run must hand
                  back. ochakai records all of it and runs none of it.
                value:
                  type: Attested Computation
                  id: computations/monthly-revenue
                  description: Sanctioned monthly revenue run, with a checkable receipt.
                  runtime: bigquery
                  parameters:
                    - { name: year, type: integer, required: true }
                    - { name: currency, type: string }
                  computation: computations/monthly-revenue.sql
                  executor:
                    resource: references/skills/run-on-bigquery.md
                    receipt: [job_id, executed_sql, result]
                  attester:
                    resource: references/attesters/monthly-revenue.py
                  body: |
                    Runs the revenue figure the finance review quotes. Supply
                    the parameters; do not edit the computation — an edited
                    run is not the sanctioned one.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Knowledge" }
              examples:
                goldenQuery:
                  summary: The Golden Query above, as stored
                  description: >
                    Entries default to draft. created_by and updated_by come
                    from the caller's identity, never from the payload, and
                    links were derived from the body. The ETag response
                    header carries the same value as updated_at.
                  value:
                    type: Golden Query
                    id: queries/monthly-revenue
                    description: Monthly net revenue for the last 12 complete months.
                    tags: [finance]
                    status: draft
                    created_by: { kind: human, name: tanaka@example.co.jp }
                    updated_by: { kind: human, name: tanaka@example.co.jp }
                    links:
                      - { target: metrics/revenue, text: Revenue }
                    attrs:
                      question: How much revenue did we make each month last year?
                      sql: |
                        SELECT DATE_TRUNC(order_date, MONTH) AS month,
                               SUM(net_amount) AS revenue
                        FROM `example-analytics.shop.orders`
                        WHERE status = 'completed'
                          AND order_date >= DATE_TRUNC(DATE_SUB(CURRENT_DATE(), INTERVAL 12 MONTH), MONTH)
                          AND order_date < DATE_TRUNC(CURRENT_DATE(), MONTH)
                        GROUP BY month
                        ORDER BY month
                    body: |
                      Answers "how much did we make each month last year?"
                      against [Revenue](/metrics/revenue.md). Completed
                      orders only; the month boundary is `order_date`, not
                      the settlement date.
                    created_at: "2026-06-09T07:41:02.110945Z"
                    updated_at: "2026-06-09T07:41:02.110945Z"
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
        "400":
          description: Error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
              examples:
                envelopeKeyInAttrs:
                  summary: attrs carried a key OKF v0.2 defines
                  description: >
                    The key would have been dropped on export, where nothing
                    would ever read it again, so the write is refused instead
                    (design doc 0036 §3.5). Move the value to the top level
                    of the payload.
                  value:
                    error: 'attrs must not carry "sources": it is an OKF envelope field, so write it at the top level of the payload instead'
                missingRuntime:
                  summary: An Attested Computation without a runtime
                  value:
                    error: "an Attested Computation needs a runtime (e.g. bigquery, postgres, dbt, python): it is what tells a consumer how to read the parameters"
                sourceWithoutResource:
                  summary: A source that names no artifact
                  value:
                    error: sources[0] needs a resource (the artifact it cites); id and title alone do not name one
        "409":
          description: Error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
              examples:
                alreadyExists:
                  summary: A live entry already holds that id
                  description: >
                    Update it (PUT), or free the id with
                    DELETE ...?purge=true if the entry there is already
                    soft-deleted. Creating over a soft-deleted entry revives
                    it rather than conflicting.
                  value:
                    error: knowledge already exists
  /api/v1/browse:
    get:
      operationId: browseKnowledge
      summary: Browse one level of the ID hierarchy
      description: >
        An entry's id is its bundle path; this returns one level of that
        tree (design docs 0014, 0016): the subdirectories directly under
        prefix ("" or omitted is the root — the top-level segments),
        each with the count of entries beneath, plus the entries at that
        level as a light projection (no body). Rejected and deleted
        entries are excluded, as in search. Entries at one level cap at
        1000 with truncated=true. Browsing records no usage.
      parameters:
        - name: prefix
          in: query
          description: ID prefix ("a/b" or "a/b/"); omit for the root.
          schema: { type: string }
      responses:
        "200":
          description: One level of the tree.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dirs:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, description: Next ID segment. }
                        count: { type: integer, description: Entries anywhere beneath. }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { $ref: "#/components/schemas/Type" }
                        id: { type: string }
                        title: { type: string, description: "Absent when the id's last segment is the name (design doc 0022)." }
                        description: { type: string, description: The one-line summary, so a directory listing can render as an index page. }
                        status: { $ref: "#/components/schemas/Status" }
                        updated_at: { type: string, format: date-time }
                  truncated:
                    type: boolean
                    description: The entry list hit the 1000-per-level cap.
              examples:
                root:
                  summary: GET /api/v1/browse
                  description: The top-level segments of the ID hierarchy, with the entry count beneath each.
                  value:
                    dirs:
                      - { name: glossary, count: 18 }
                      - { name: insights, count: 24 }
                      - { name: metrics, count: 31 }
                      - { name: queries, count: 57 }
                      - { name: tables, count: 96 }
                level:
                  summary: GET /api/v1/browse?prefix=metrics
                  description: >
                    One level down. The projection carries no body — a
                    directory listing renders from the description.
                  value:
                    entries:
                      - type: Metric
                        id: metrics/average-order-value
                        description: Revenue divided by completed orders, over the same window.
                        status: verified
                        updated_at: "2026-07-02T05:26:44.712009Z"
                      - type: Metric
                        id: metrics/revenue
                        title: Revenue
                        description: Net revenue from completed orders, excluding tax and shipping.
                        status: verified
                        updated_at: "2026-07-14T02:33:41.019778Z"
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/context:
    get:
      operationId: getContext
      summary: The one-call read before answering a data question
      description: >
        Searches the knowledge base (verified entries rank higher), returns
        the full entries behind the top hits, and expands one hop through
        links so companion knowledge (the insight explaining a metric, the
        golden query answering the question) arrives in the same response.
        Rejected entries never appear. limit caps the primary entries
        (default 5, max 20); linked companions share a 2×limit total cap.

        Changed in 0.13.0 (design doc 0033): `hits` carries the ranking
        only — id, type, title, status, score. It used to repeat every
        top entry in full, so the knowledge arrived twice and the budget
        bound one copy of it. A client that read bodies out of `hits`
        reads them from `entries` instead, where they always were.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: type
          in: query
          schema: { type: array, items: { $ref: "#/components/schemas/Type" } }
          explode: true
        - name: status
          in: query
          schema: { type: array, items: { $ref: "#/components/schemas/Status" } }
          explode: true
        - name: tag
          in: query
          schema: { type: array, items: { type: string } }
          explode: true
        - name: limit
          in: query
          schema: { type: integer, default: 5, maximum: 20 }
        - name: min_score
          in: query
          description: >
            Drop hits scoring below this before expansion, for callers that
            inject the pack automatically and prefer nothing over junk.
            Scores are search-mode dependent and uncalibrated
            (matched-fragment weight plus boosts vs RRF rank fusion) —
            calibrate against your own corpus before use. Non-numeric
            values are a 400.
          schema: { type: number, default: 0 }
        - name: budget
          in: query
          description: >
            Cap the serialized bytes of the knowledge in the response: the
            entries delivered in full plus the outline rows naming the
            rest. Nothing else in the response carries a body — `hits` is
            the ranking only — so the cap cannot be defeated by a second
            copy of an entry it excluded. Entries past the
            cap are listed under `outline` instead — an entry is delivered
            whole or not at all, never truncated — and those rows count
            against the same cap, because naming what was left out is not
            free (an outline row carries a description). Packing is greedy,
            so one oversized entry high in the ranking does not starve the
            rest. The floor is the outline of everything that matched: a
            budget too small even for the names still gets them, since a
            caller cannot raise a budget for entries it never heard about.
            Defaults to 0 (no cap) here; the MCP get_context tool defaults
            it on, because an agent's context window is the scarce resource
            and an embedding host will not set it.
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: The ranking plus the full entries behind the top hits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits:
                    description: >
                      The ranking behind the pack, not a second copy of it:
                      the knowledge travels once, under `entries`. A hit
                      with no matching entry ranked below the pack's cut-off
                      — fetch it by id if the ranking suggests it is worth a
                      round trip.
                    type: array
                    items: { $ref: "#/components/schemas/ContextRank" }
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/Knowledge" }
                  outline:
                    description: >
                      Entries the budget dropped: named and sized, not
                      delivered. Fetch any of them by id. Absent when
                      nothing was dropped.
                    type: array
                    items: { $ref: "#/components/schemas/ContextOutline" }
                  truncated:
                    description: How many entries went to the outline.
                    type: integer
              examples:
                pack:
                  summary: GET /api/v1/context?q=monthly+revenue&limit=2&budget=4000
                  description: >
                    Two entries matched and two more arrived through their
                    links — the metric the query rests on, and the glossary
                    term the metric rests on. The budget could not afford the
                    fourth, so it is named under outline with what it would
                    have cost. `hits` is the ranking only: every body in this
                    response appears exactly once, under `entries`.
                  value:
                    hits:
                      - id: queries/monthly-revenue
                        type: Golden Query
                        title: monthly-revenue
                        status: verified
                        score: 1.35
                      - id: metrics/revenue
                        type: Metric
                        title: Revenue
                        status: verified
                        score: 0.48
                      - id: insights/revenue-seasonality
                        type: Insight
                        title: Reading revenue month over month
                        status: draft
                        score: 0.43
                    entries:
                      - type: Golden Query
                        id: queries/monthly-revenue
                        description: Monthly net revenue for the last 12 complete months.
                        tags: [finance]
                        status: verified
                        created_by: { kind: human, name: tanaka@example.co.jp }
                        updated_by: { kind: human, name: tanaka@example.co.jp }
