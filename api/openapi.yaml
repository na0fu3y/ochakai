        "400":
          description: Error.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
              examples:
                queryAndSortTogether:
                  summary: q and sort are mutually exclusive
                  value:
                    error: sort=usage lists entries; it cannot be combined with a search query (q)
                noQuery:
                  summary: Neither q nor sort was given
                  value:
                    error: search needs a query; use sort=verified_at|usage|failed|stale_after to list entries without one, or source=URI to list what cites a resource
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/bundle/{path}:
    get:
      operationId: getBundleFile
      summary: Read one of the files OKF reserves
      description: >
        The two filenames SPEC §3.1 reserves, generated from the bundle
        rather than stored in it (design doc 0046 §§3.7-3.8).

        `index.md` is one level of the tree — the subdirectories directly
        under the path, each with the count of entries beneath, plus the
        entries at that level (design docs 0014, 0016). Rejected and
        deleted entries are excluded, as in search; a level caps at 1000
        with truncated=true; listing records no usage.

        `log.md` is the update history under the path, newest first and
        grouped by date, as SPEC §9 writes one. It publishes an instance
        ledger: an import never reads it back, the same way it never
        reads back `generated` (design doc 0009). `limit` bounds it
        (default and maximum 1000).

        The representation follows Accept. `application/json` returns the
        listing or the revisions; anything else returns the file the path
        names. Two representations of one thing, at one address — the
        JSON is what a web UI's tree needs, not a second surface.

        PUT and DELETE are 405: a generated file is not one anybody
        writes. Paths other than the two reserved names are 404 for now —
        the rest of the bundle joins this address in a later change
        (0046 §3.5).
      parameters:
        - name: path
          in: path
          required: true
          description: >
            The reserved file's bundle path — "index.md" or "log.md" at
            the root, "metrics/index.md" below it. Slashes are real path
            separators.
          schema: { type: string }
        - name: limit
          in: query
          description: log.md only — maximum entries (default and max 1000).
          schema: { type: integer }
      responses:
        "200":
          description: The generated file, or its structured form.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            text/markdown:
              schema: { type: string }
              example: |
                # metrics

                * [Revenue](revenue.md) - Net revenue from completed orders.
                * [Churn](churn.md) - Monthly logo churn.
            application/json:
              schema:
                type: object
                properties:
                  dirs:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, description: Next ID segment. }
                        count: { type: integer, description: Entries anywhere beneath. }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { $ref: "#/components/schemas/Type" }
                        id: { type: string }
                        title: { type: string, description: "Absent when the id's last segment is the name (design doc 0022)." }
                        description: { type: string, description: The one-line summary, so a directory listing can render as an index page. }
                        status: { $ref: "#/components/schemas/Status" }
                        updated_at: { type: string, format: date-time }
                  truncated:
                    type: boolean
                    description: The entry list hit the 1000-per-level cap.
              examples:
                root:
                  summary: "GET /api/v1/bundle/index.md (Accept: application/json)"
                  description: The top-level segments of the ID hierarchy, with the entry count beneath each.
                  value:
                    dirs:
                      - { name: glossary, count: 18 }
                      - { name: insights, count: 24 }
                      - { name: metrics, count: 31 }
                      - { name: queries, count: 57 }
                      - { name: tables, count: 96 }
                level:
                  summary: "GET /api/v1/bundle/metrics/index.md (Accept: application/json)"
                  description: >
                    One level down. The projection carries no body — a
                    directory listing renders from the description.
                  value:
                    entries:
                      - type: Metric
                        id: metrics/average-order-value
                        description: Revenue divided by completed orders, over the same window.
                        status: stable
                        updated_at: "2026-07-02T05:26:44.712009Z"
                      - type: Metric
                        id: metrics/revenue
                        title: Revenue
                        description: Net revenue from completed orders, excluding tax and shipping.
                        status: stable
                        updated_at: "2026-07-14T02:33:41.019778Z"
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putBundleFile
      summary: Refused — the reserved files are generated
      description: >
        index.md and log.md are derived from the bundle (design doc 0046
        §§3.7-3.8), so neither is written. The same goes for DELETE.
      responses:
        "405":
          description: A generated file is not one anybody writes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
    delete:
      operationId: deleteBundleFile
      summary: Refused — the reserved files are generated
      description: See PUT.
      responses:
        "405":
          description: A generated file is not one anybody writes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
  /api/v1/context:
    get:
      operationId: getContext
      summary: The one-call read before answering a data question
      description: >
        Searches the knowledge base (verified entries rank higher), returns
        the full entries behind the top hits, and expands one hop through
        links so companion knowledge (the insight explaining a metric, the
        golden query answering the question) arrives in the same response.
        Rejected entries never appear. limit caps the primary entries
        (default 5, max 20); linked companions share a 2×limit total cap.

        Changed in 0.13.0 (design doc 0033): `hits` carries the ranking
        only — id, type, title, status, score. It used to repeat every
        top entry in full, so the knowledge arrived twice and the budget
        bound one copy of it. A client that read bodies out of `hits`
        reads them from `entries` instead, where they always were.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: type
          in: query
          schema: { type: array, items: { $ref: "#/components/schemas/Type" } }
          explode: true
        - name: status
          in: query
          schema: { type: array, items: { $ref: "#/components/schemas/Status" } }
          explode: true
        - name: trust
          in: query
          description: >
            Filter by OKF's trust tier (SPEC §5.3), repeatable and OR-ed;
            omit to leave the question unasked. There is no rejected
            parameter here: a context pack never carries knowledge
            somebody turned down.
          schema: { type: array, items: { $ref: "#/components/schemas/Trust" } }
          explode: true
        - name: fm.{key}
          in: query
          description: >
            Filter by any frontmatter key, exactly: `fm.owner=finance`
            finds the entries whose frontmatter says owner is finance,
            matching a scalar or a member of a list. Repeat with
            different keys to AND them.

            This is the filter that does not need a release. A key OKF
            adds in a later version, or one a producer invented, is
            askable the day somebody writes it — the whole frontmatter is
            indexed, not the subset ochakai happens to name (design doc
            0046 §3.11). Exact match and list membership are the only two
            comparisons: ranges and boolean expressions are the doorway
            to a query language, and what ochakai returns is knowledge
            rather than rows.
          schema: { type: string }
        - name: tag
          in: query
          schema: { type: array, items: { type: string } }
          explode: true
        - name: prefix
          in: query
          description: >
            Only entries addressed under this path, repeatable and OR-ed —
            the same subtree filter GET /api/v1/knowledge takes (design doc
            0041). It scopes the search that picks the hits, not the link
            expansion: an entry inside the scope that cites a glossary term
            outside it still arrives with the term, which is the reason
            this endpoint follows links at all (design doc 0041 §2.6).
          schema: { type: array, items: { type: string } }
          explode: true
          allowReserved: true
        - name: limit
          in: query
          schema: { type: integer, default: 5, maximum: 20 }
        - name: min_score
          in: query
          description: >
            Drop hits scoring below this before expansion, for callers that
            inject the pack automatically and prefer nothing over junk.
            Scores are search-mode dependent and uncalibrated
            (matched-fragment weight plus boosts vs RRF rank fusion) —
            calibrate against your own corpus before use. Non-numeric
            values are a 400.
          schema: { type: number, default: 0 }
        - name: budget
          in: query
          description: >
            Cap the serialized bytes of the knowledge in the response: the
            entries delivered in full plus the outline rows naming the
            rest. Nothing else in the response carries a body — `hits` is
            the ranking only — so the cap cannot be defeated by a second
            copy of an entry it excluded. Entries past the
            cap are listed under `outline` instead — an entry is delivered
            whole or not at all, never truncated — and those rows count
            against the same cap, because naming what was left out is not
            free (an outline row carries a description). Packing is greedy,
            so one oversized entry high in the ranking does not starve the
            rest. The floor is the outline of everything that matched: a
            budget too small even for the names still gets them, since a
            caller cannot raise a budget for entries it never heard about.
            Defaults to 0 (no cap) here; the MCP get_context tool defaults
            it on, because an agent's context window is the scarce resource
            and an embedding host will not set it.
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: The ranking plus the full entries behind the top hits.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits:
                    description: >
                      The ranking behind the pack, not a second copy of it:
                      the knowledge travels once, under `entries`. A hit
                      with no matching entry ranked below the pack's cut-off
                      — fetch it by id if the ranking suggests it is worth a
                      round trip.
                    type: array
                    items: { $ref: "#/components/schemas/ContextRank" }
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/View" }
                  outline:
                    description: >
                      Entries the budget dropped: named and sized, not
                      delivered. Fetch any of them by id. Absent when
                      nothing was dropped.
                    type: array
                    items: { $ref: "#/components/schemas/ContextOutline" }
                  truncated:
                    description: How many entries went to the outline.
                    type: integer
              examples:
                pack:
                  summary: GET /api/v1/context?q=monthly+revenue&limit=2&budget=4000
                  description: >
                    Two entries matched and one more arrived through their
                    links — the metric the query rests on. The budget could
                    not afford the glossary term the metric rests on, so it
                    is named under outline with what it would have cost.
                    `hits` is the ranking only: every document in this
                    response appears exactly once, under `entries`.
                  value:
                    hits:
                      - id: queries/monthly-revenue
                        type: Attested Computation
                        title: monthly-revenue
                        status: stable
                        trust: human-reviewed
                        score: 1.35
                      - id: metrics/revenue
                        type: Metric
                        title: Revenue
                        status: stable
                        trust: human-reviewed
                        score: 0.48
                      - id: insights/revenue-seasonality
                        type: Insight
                        title: Reading revenue month over month
                        status: draft
                        trust: unverified
                        score: 0.43
                    entries:
                      - id: queries/monthly-revenue
                        document: |
                          ---
                          type: Attested Computation
                          description: Monthly net revenue for the last 12 complete months.
                          tags:
                              - finance
                          status: stable
                          runtime: bigquery
                          question: How much revenue did we make each month last year?
                          ---

                          Answers the question above against
                          [Revenue](/metrics/revenue.md). Completed orders only;
                          the month boundary is `order_date`, not the settlement
                          date.

                          # Computation

                          ```sql
                          SELECT DATE_TRUNC(order_date, MONTH) AS month,
                                 SUM(net_amount) AS revenue
                          FROM `example-analytics.shop.orders`
                          WHERE status = 'completed'
                            AND order_date >= DATE_TRUNC(DATE_SUB(CURRENT_DATE(), INTERVAL 12 MONTH), MONTH)
                            AND order_date < DATE_TRUNC(CURRENT_DATE(), MONTH)
                          GROUP BY month
                          ORDER BY month
                          ```
                        summary:
                          id: queries/monthly-revenue
                          type: Attested Computation
                          title: monthly-revenue
                          description: Monthly net revenue for the last 12 complete months.
                          tags: [finance]
                          status: stable
                          trust: human-reviewed
                          verified_at: "2026-07-10T01:52:16.774301Z"
                          rejected: false
                          links:
                            - { target: metrics/revenue, text: Revenue }
