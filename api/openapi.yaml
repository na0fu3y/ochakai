    delete:
      operationId: deleteKnowledge
      summary: Soft-delete a knowledge entry (history retained)
      description: >
        Soft-deletes by default: the entry disappears from reads, its
        history stays, and creating the same id revives it. With
        `purge=true` the entry is hard-deleted instead — entry,
        revisions, usage, and attachment metadata erased, the id freed
        for a move. Two calls, deliberately: the first is reversible, the
        second is not. Purging a live entry is a 409; delete it first.
        Content-addressed attachment bytes are left in the blob store, as
        detaching leaves them; nothing reclaims them afterwards. The purge
        itself is recorded — who destroyed which id, and how much history
        went with it — in the one table a purge does not touch.
      parameters:
        - name: purge
          in: query
          description: >
            Hard-delete an already soft-deleted entry. `true` or `false`;
            anything else is a 400 rather than a soft delete, because a
            204 for a value meant as a purge would report an id freed
            that is not.
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/OnBehalfOf"
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/move:
    post:
      operationId: moveKnowledge
      summary: Move (rename) a knowledge entry to a new id
      description: >
        The id is the address (design doc 0017), so a move carries
        everything keyed by it along in one transaction — revisions,
        usage, attachments, embeddings — and rewrites inbound references
        (link targets in both bare and ochakai:// forms, and attrs.model)
        so nothing breaks (design doc 0021). The destination must be a
        fresh id: a live or soft-deleted entry there already owns that
        address and its history — free an id held by a deleted entry with
        DELETE ...?purge=true. Lives at its own top-level path for the
        same reason /usage and /revisions do — a suffix after the
        hierarchical id could be confused with an ID segment.
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  type: string
                  description: The entry's current id.
                to:
                  type: string
                  description: The new id (bundle path).
            examples:
              rename:
                summary: Move a metric one level deeper
                description: >
                  Everything keyed by the id follows — revisions, usage,
                  attachments, embeddings — and every entry linking to the
                  old id is rewritten to the new one.
                value:
                  from: metrics/revenue
                  to: metrics/finance/revenue
      responses:
        "200":
          description: The moved entry, now at its new id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Knowledge" }
              examples:
                moved:
                  summary: The entry at its new address
                  value:
                    type: Metric
                    id: metrics/finance/revenue
                    title: Revenue
                    description: Net revenue from completed orders, excluding tax and shipping.
                    resource: bigquery://example-analytics.shop.orders
                    tags: [finance, core]
