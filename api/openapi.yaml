          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/verify/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The entry's id; slashes are real path separators.
        schema: { type: string }
    post:
      operationId: verifyKnowledge
      summary: Record a verification against the entry as it stands
      description: >
        Appends the caller and the current time to the entry's
        verifications ledger, whether this is the first confirmation or
        the tenth re-check. Re-checking is why the endpoint exists: PUT
        writes nothing at all when the content is unchanged, so "checked
        again, still right" could not be recorded — and both review feeds
        (sort=verified_at, sort=failed) had no exit (design doc 0025 §6).
        It does not touch the document: the entry's status, updated_at and
        ETag all stay put, because confirming knowledge and publishing it
        are different acts (design doc 0043 §3.2). Promoting a draft to
        stable is a PUT.
        A rejection is cleared. Not an MCP tool: verification is the human
        ruling the write-back loop turns on. Lives at its own top-level
        path for the same reason /usage does — a suffix after the
        hierarchical id could be confused with an ID segment.
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
      responses:
        "200":
          description: The verified entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/View" }
              examples:
                confirmed:
                  summary: POST /api/v1/verify/insights/revenue-seasonality
                  description: >
                    A verification by the caller is appended to
                    observed.verified, and summary.verified flips. Nothing
                    else moves: the entry is still the draft its writer
                    published, the document is byte-for-byte what it was,
                    and content_hash (the ETag, and the version an editor
                    may be holding) is untouched.
                  value:
                    id: insights/revenue-seasonality
                    document: |
                      ---
                      type: Insight
                      title: Reading revenue month over month
                      description: Why a December spike and a January drop are normal.
                      tags:
                          - finance
                      status: draft
                      stale_after: "2027-01-31"
                      ---

                      [Revenue](/metrics/revenue.md) is seasonal: December runs
                      well above the trailing median and January falls back
                      below it.
                    summary:
                      id: insights/revenue-seasonality
                      type: Insight
                      title: Reading revenue month over month
                      description: Why a December spike and a January drop are normal.
                      tags: [finance]
                      status: draft
                      stale_after: "2027-01-31"
                      trust: human-reviewed
                      verified_at: "2026-07-27T00:41:12.905337Z"
                      rejected: false
                      links:
                        - { target: metrics/revenue, text: Revenue }
                      content_hash: 15c8e3097b6d2a41f0c85b3ed729a4f6108c5d3b7e2a094f6c1b8d503a7e2f94
                      created_at: "2026-07-21T06:14:55.402881Z"
                      updated_at: "2026-07-21T06:14:55.402881Z"
                    observed:
                      created_by: { kind: process, name: analyst@example.iam.gserviceaccount.com }
                      generated:
                        by: { kind: process, name: analyst@example.iam.gserviceaccount.com }
                        at: "2026-07-21T06:14:55.402881Z"
                      verified:
                        - by: { kind: human, name: tanaka@example.co.jp }
                          at: "2026-07-27T00:41:12.905337Z"
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/reject/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The entry's id; slashes are real path separators.
        schema: { type: string }
    post:
      operationId: rejectKnowledge
      summary: Record that an entry was reviewed and not accepted
      description: >
        Writes the caller, the time and the reason as the entry's live
        ruling, replacing any earlier one. Rejected entries drop out of
        searches that did not ask for them (rejected=true), which is how
        an agent checks whether a proposal was already turned down before
        making it again — the memory of no the write-back loop is built on
        (design doc 0001 §9.1).
        Like verify it is a ruling and not an edit: the document keeps its
        lifecycle status, its updated_at and its ETag (design doc 0043
        §3.3). Verifications are not cleared — somebody vouched for this
        and somebody later ruled against it is exactly the history worth
        keeping. Not an MCP tool.
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
      requestBody:
        required: false
        description: Omit the body entirely to reject without a stated reason.
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  description: Why it was not accepted, up to 2000 bytes.
            example: { note: "double-counts refunds; see policies/revenue-recognition" }
      responses:
        "200":
          description: The entry, carrying its new rejection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/View" }
              examples:
                rejected:
                  summary: POST /api/v1/reject/metrics/gross-revenue
                  description: >
                    The ruling is in observed.rejection, and summary.rejected
                    is how a row says so. The document is untouched — a
                    rejection is a judgment about the concept, not a stage
                    of it, and it could not round-trip as a status because
                    export would have to fold it onto deprecated, which
                    asserts the opposite thing about the entry (design doc
                    0043 §3.3).
                  value:
                    id: metrics/gross-revenue
                    document: |
                      ---
                      type: Metric
                      title: Gross revenue
                      description: Order totals before refunds.
                      status: draft
                      ---

                      The sum of `gross_amount` over every order in
                      [shop.orders](/tables/shop-orders.md).
                    summary:
                      id: metrics/gross-revenue
                      type: Metric
                      title: Gross revenue
                      description: Order totals before refunds.
                      status: draft
                      trust: unverified
                      rejected: true
                      links:
                        - { target: tables/shop-orders, text: shop.orders }
                      content_hash: 7be31c85d0a629f4b17c08e35da4962f0b8c71e34d0a95f627b1c8e034da95f7
                      created_at: "2026-07-24T02:18:09.441027Z"
                      updated_at: "2026-07-24T02:18:09.441027Z"
                    observed:
                      created_by: { kind: process, name: analyst@example.iam.gserviceaccount.com }
                      generated:
                        by: { kind: process, name: analyst@example.iam.gserviceaccount.com }
                        at: "2026-07-24T02:18:09.441027Z"
                      rejection:
                        by: { kind: human, name: sato@example.co.jp }
                        at: "2026-07-27T02:05:44.812390Z"
                        note: double-counts refunds; see policies/revenue-recognition
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: liftKnowledgeRejection
      summary: Withdraw a rejection
      description: >
        Deletes the live ruling, returning the entry to the ordinary pool.
        A 404 when the entry carries no rejection: lifting nothing is a
        mistake worth reporting rather than a silent success.
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
      responses:
        "200":
          description: The entry, with no rejection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/View" }
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/usage/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The entry's id; slashes are real path separators.
        schema: { type: string }
    get:
      operationId: getKnowledgeUsage
      summary: Usage totals for one knowledge entry
      description: >
        How often the entry was actually used: appeared in search results,
        fetched individually, and how it was reported to have worked. The measure of
        the write-back loop — evidence for promoting drafts, and a staleness
        signal for verified entries that stopped being used.
      responses:
        "200":
          description: Usage totals.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
              examples:
                totals:
                  summary: GET /api/v1/usage/queries/monthly-revenue
                  description: >
                    search_hits and fetches are recorded by reads;
                    worked and failed only by report_outcome. An entry never
                    reported on has both at zero — which is not the same
                    signal as one that failed.
                  value:
                    search_hits: 412
                    fetches: 168
                    worked: 23
                    failed: 2
                    last_used_at: "2026-07-26T23:58:07.336114Z"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: reportOutcome
      summary: Report an outcome (worked/failed) for a knowledge entry
      description: >
        The last edge of the write-back loop: after acting on knowledge
        (running a golden query, running SQL written from an entry), report whether
        the result was correct. Reports feed the entry's usage totals;
        failed counts against verified entries flag them for
        re-verification. The caller's identity is recorded with each
        report; the optional note travels with the raw event.
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [worked, failed]
                  description: worked = acting on the entry gave a correct result; failed = wrong or unusable.
                note:
                  type: string
                  maxLength: 2000
                  description: What was run, what went wrong. Recorded with the raw event (pruned with it after 180 days).
            examples:
              worked:
                summary: The golden query gave the right answer
                value:
                  outcome: worked
                  note: Ran it for FY2025; the total matched the finance close to the yen.
              failed:
                summary: It did not
                description: >
                  A failed report against a verified entry puts it on the
                  re-verification feed (sort=failed), where it stays until
                  someone verifies it again.
                value:
                  outcome: failed
                  note: >-
                    Double-counts orders split across two shipments since the
                    2026-07 fulfilment change.
      responses:
        "200":
          description: Updated usage totals.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
              examples:
                afterReport:
                  summary: The totals with this report counted
                  value:
                    search_hits: 412
                    fetches: 168
                    worked: 23
                    failed: 3
                    last_used_at: "2026-07-27T02:07:44.291508Z"
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/backlinks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The entry's id; slashes are real path separators.
        schema: { type: string }
    get:
      operationId: listKnowledgeBacklinks
      summary: Entries whose links point at this entry
      description: >
        The reverse edge of links, most recently updated first: the insight
        that explains a metric links to the metric, not the other way
        round. get_context already follows this edge when packing
        companions; here it is exposed directly so UIs can show
        "linked from" next to an entry's own links. An entry with no
        backlinks returns an empty list (the target entry itself is not
        checked for existence).
      parameters:
        - name: limit
          in: query
          description: >
            Default 20, max 100. Out-of-range values fall back to the
            default; non-integer values are a 400.
          schema: { type: integer }
      responses:
        "200":
          description: Live entries linking to this one, most recently updated first.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/Summary" }
              examples:
                linkedFrom:
                  summary: GET /api/v1/backlinks/metrics/revenue
                  description: >
                    The reverse edge: the insight and the golden query name
                    the metric in their bodies, so they link to it. The metric
                    does not link back — which is why a UI has to ask for this
                    side separately.
                  value:
                    entries:
                      - id: insights/revenue-seasonality
                        type: Insight
                        title: Reading revenue month over month
                        description: Why a December spike and a January drop are normal.
                        tags: [finance]
                        status: draft
                        stale_after: "2027-01-31"
                        trust: unverified
                        rejected: false
                        links:
                          - { target: metrics/revenue, text: Revenue }
                        content_hash: 15c8e3097b6d2a41f0c85b3ed729a4f6108c5d3b7e2a094f6c1b8d503a7e2f94
                        created_at: "2026-07-21T06:14:55.402881Z"
                        updated_at: "2026-07-21T06:14:55.402881Z"
                      - id: queries/monthly-revenue
                        type: Attested Computation
                        title: monthly-revenue
                        description: Monthly net revenue for the last 12 complete months.
                        tags: [finance]
                        status: stable
                        trust: human-reviewed
                        verified_at: "2026-07-10T01:52:16.774301Z"
                        rejected: false
                        links:
                          - { target: metrics/revenue, text: Revenue }
                        content_hash: 4d1f0a86c3b25e97d0a41f6b8c2e5307ab9d4f61c8e30257ba9f1d6c4e820b73
                        created_at: "2026-06-09T07:41:02.110945Z"
                        updated_at: "2026-07-10T01:52:16.774301Z"
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/attachments/{path}:
    parameters:
      - name: path
        in: path
        required: true
        description: >
          "{id}/{name}" — the entry's id (its bundle path) followed by
          the attachment filename. The final segment is always the
          filename; everything before it is the id
          (PUT /api/v1/attachments/insights/revenue-reading/weekly.png).
        schema: { type: string }
    put:
      operationId: putAttachment
      summary: Attach a file to a knowledge entry
      description: >
        Stores the raw request body as an attachment, replacing any
        attachment of the same name (kept as a revision). The media type
        is sniffed from the bytes — png, jpeg, webp, pdf, and plain
        text are accepted (never text/html or image/svg+xml: they can
        carry scripts), at most 5 MiB and 20 attachments per entry.
        Reference the file from the entry's markdown body
        (`![baseline](<id last segment>/weekly.png)` or
        `[seeds](<id last segment>/seeds.txt)`) so it is findable and
        survives OKF export/import (design docs 0008, 0013). Requires the
        server to have GCS configured (OCHAKAI_GCS_BUCKET); without it
        the request fails with 501.
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
        - name: okf_path
          in: query
          required: false
          description: >
            Bundle path a foreign OKF import carried this file at
            (clean, bundle-relative). Export writes the file back there
            so the original body links keep working. Omit for
            attachments born in ochakai.
          schema: { type: string }
      requestBody:
        required: true
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Attachment metadata (bytes are fetched with GET).
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
              examples:
                stored:
                  summary: PUT /api/v1/attachments/metrics/revenue/revenue-2026h1.png
                  description: >
                    The media type was sniffed from the bytes, not taken from
                    the request. sha256 is the content address and the ETag a
                    later GET answers If-None-Match with.
                  value:
                    name: revenue-2026h1.png
                    media_type: image/png
                    size: 48213
                    sha256: 9f2c1d0a7b3e5648c1d9f0a2b7e4c8d63f5a1b2c9e0d7a4f6b3c8e1d5a0f7b29
                    created_by: { kind: human, name: tanaka@example.co.jp }
                    created_at: "2026-06-02T04:20:11.663210Z"
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
    get:
      operationId: getAttachment
      summary: Fetch attachment bytes
      description: >
        Returns the file bytes with the stored (sniffed) media type; the
        ETag is the content's SHA-256, and a matching If-None-Match gets
        a 304 answered from metadata alone (no blob read, so repeat
        renders in a UI cost nothing). Cache-Control is private,
        no-cache: names are mutable (replace-by-name), so clients
        revalidate every time. Fetching the bytes records a usage event
        against the owning entry; a 304 revalidation does not.
      responses:
        "200":
          description: The attachment bytes.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "304":
          description: Not modified (If-None-Match matched the content hash).
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAttachment
      summary: Detach a file from a knowledge entry
      description: >
        Removes the attachment (kept as a revision; the content-addressed
        bytes remain referenced by history).
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
      responses:
        "204":
          description: Detached.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/export:
    get:
      operationId: exportOKF
      summary: Export the knowledge base as an OKF bundle
      description: >
        Streams a tar.gz of the whole knowledge base in Open Knowledge
        Format (markdown + YAML frontmatter, one concept per entry, with
        index.md files), attachment files included. Your knowledge is
        yours.


        Written as it is read — indexes first, then entries in batches,
        then one attachment at a time — so the server never holds the
        whole bundle in memory. Because the response starts before the
        last file is read, a failure mid-export can only truncate the
        stream: verify a backup by reading the archive, not by the status
        code. The server logs every such failure at error level, naming
        the file it stopped on.


        There is no matching import endpoint, and that is deliberate
        (design doc 0015 §3.2): importing a bundle is a loop over the
        endpoints already here, so a server-side version would add a
        second path to the same outcome without adding a capability.
        To write your own importer against any OKF bundle: walk the
        tar.gz, POST each `<id>.md` to /api/v1/knowledge (PUT to
        /api/v1/knowledge/{id} if it exists), and PUT each non-markdown
        file to /api/v1/attachments/{id}/{name}, attributing it to the
        entry whose directory it sits in or whose body links to it.
        `index.md` files are generated on export and are not entries.
        Frontmatter keys the server owns — `generated`, `verified`,
        `created_by`, `rejected_by`, `rejected_at`, and the pre-v0.2
        spellings `timestamp` / `verified_by` / `verified_at` — are
        ignored on write; provenance comes from the caller's identity
        (design docs 0009, 0036 §3.2). The one exception is that the
        presence of a `verified` key decides how OKF's `stable` status
        maps onto ochakai's (design doc 0036 §3.4). `ochakai import` is
        exactly this loop.
      parameters:
        - name: attachments
          in: query
          description: >
            `false` exports the markdown only. Attachment bytes live in
            GCS, so a periodic backup can copy them from there directly
            instead of pulling them through this endpoint. A value that
            is neither `true` nor `false` is a 400.
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: OKF bundle.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/reembed:
    post:
      operationId: reembedKnowledge
      summary: Embed entries that have no vector for the configured model
      description: >
        Vectors are written when an entry is written, so a knowledge base
        loaded before `OCHAKAI_VERTEX_PROJECT` was set has none, and
        hybrid search stays quietly lexical-only until every entry
        happens to be rewritten. Changing the embedding model has the
        same shape: the old vectors sit in a space nothing queries any
        more (design doc 0020). This fills the gap.


        Attachment vectors are covered too: only `attach` writes them, so
        a corpus loaded before semantic search — or one whose embedding
        tables were dropped to change dimensions — has files that are
        findable by name alone until this runs. Entries go first and
        attachments fill the rest of the pass.


        Bounded per call — repeat while `missing` is above zero, passing
        the previous response's `cursor` back each time; the CLI
        (`ochakai reembed`) does that for you. One item is one call to
        the embedding provider and the calls are sequential, so the
        default pass is sized to finish well inside a request timeout
        (Cloud Run's default is 300s); raise `limit` only if you know
        yours. A provider failure on one item is counted, not fatal. 501
        when semantic search is not configured.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 200, maximum: 5000 }
        - name: cursor
          in: query
          description: >
            Resume position from a previous response. Omit to start from
            the beginning. Without it, a pass whose every item the
            provider refuses returns the same window forever and the rest
            of the corpus is never attempted.
          schema: { type: string }
      responses:
        "200":
          description: What the pass did.
          headers:
            Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  embedded:
                    description: Knowledge entries embedded by this pass.
                    type: integer
                  attachments:
                    description: Attachments embedded by this pass.
                    type: integer
                  failed: { type: integer }
                  missing:
                    description: >
                      Entries and attachments still unembedded once the
                      pass was over — counted after the fact, so items
                      this pass failed on are included.
                    type: integer
                  cursor:
                    description: >
                      Where the next pass resumes. Absent once nothing is
                      missing; unchanged from the one sent in means the
                      corpus is exhausted and what remains only fails.
                    type: string
              examples:
                partial:
                  summary: A pass with work still left
                  description: >
                    missing is above zero, so call again with this cursor.
                    The cursor is opaque — it carries the entry and the
                    attachment position in one token; pass it back unchanged
                    rather than parsing it.
                  value:
                    embedded: 200
                    attachments: 0
                    failed: 0
                    missing: 613
                    cursor: "metrics/revenue\u0000"
                done:
                  summary: The last pass
                  description: Nothing is missing, so no cursor comes back.
                  value:
                    embedded: 13
                    attachments: 4
                    failed: 0
                    missing: 0
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/Error" }
components:
  headers:
    ETag:
      description: >
        The entry's version — the hash of the document as stored,
        quoted, and the same value as the body's summary.content_hash
        (design docs 0043 §3.4, 0046 §3.4). A client echoes it in
        If-Match on a later update to write only if nothing changed
        meanwhile (design doc 0030). It covers the document and nothing
        else, so verifying, rejecting or attaching a file all leave a
        held precondition valid — while reformatting the entry moves it,
        because the file did change (what the entry *says* did not, which
        is what observed.generated.at reports). Treat it as opaque.
      schema: { type: string }
    Note:
      description: >
        A value the server accepted but read differently than it was
        written — an unrecognized status, a date it could not parse.
        Repeatable, one per reinterpretation. A reinterpretation is never
        silent (design doc 0036 §3.4), and there is no room for it in a
        response whose body is the entry.
      schema: { type: string }
    ReadOnly:
      description: >
        Set to "true" on every /api/v1 response — reads, writes, and
        errors alike — when the deployment is read-only
        (OCHAKAI_READ_ONLY, design doc 0040 §2.3). It describes the
        deployment, not the outcome of the call. Absent means the
        deployment accepts writes, which is what every server predating
        the flag says. MCP announces read-only by not offering the write
        tools; REST has no such handshake, so it says so in a header, the
        way Ochakai-Unchanged reports that an update wrote nothing. A
        client reads it to stop offering writes that would only ever be
        refused with 403.
      schema: { type: string, enum: ["true"] }
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >
        Optimistic-concurrency precondition (design doc 0030): the
        entry's version, as a prior read or write returned it in the ETag
        response header (quotes optional; the JSON body's
        summary.content_hash field is the same value). Every response carrying an entry
        carries the header. The write happens only if the entry still has
        this version; an entry changed since it was read is a 412 and
        nothing is written. Absent or "*" means no precondition — last
        write wins.
        The version is opaque, so there is no format to reject: a value
        that never matched anything fails the precondition with a 412,
        which is what a merely stale one does too.
      schema: { type: string }
    OnBehalfOf:
      name: X-Ochakai-On-Behalf-Of
      in: header
      required: false
      description: >
        Delegated end-user identity (design doc 0027): "kind:identity",
        kind human or process, no whitespace in the identity, at most 320
        bytes — e.g. "human:tanaka@example.co.jp". An application on the
        delegator allowlist (OCHAKAI_DELEGATING_CALLERS) forwards who it
        is acting for; the forwarded identity is recorded as the actor
        and the caller is kept as Actor.via — never dropped. A caller
        not permitted to delegate is a 403 and a malformed value a 400 —
        an error, not a silent downgrade, and in the same JSON envelope
        as every other error here, so the message reaches the caller.
        Honored on every call; declared on the operations that record
        provenance.
      schema: { type: string, maxLength: 320 }
  responses:
    Error:
      description: Error.
      headers:
        Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    Forbidden:
      description: >
        Refused — the route exists and the request was understood, but
        this deployment declines it. Two things answer 403, and the
        message says which: a write against a read-only deployment
        (design doc 0040 §4 — 403 rather than 404, because the endpoint
        did not go away), and X-Ochakai-On-Behalf-Of from a caller that
        is not on the delegator allowlist (design doc 0027, which refuses
        rather than silently downgrading to the caller's own identity).
        The second reaches every operation, since the header is honored
        on every call; the first only the writes. Same JSON envelope as
        every other error here.
      headers:
        Ochakai-Read-Only: { $ref: "#/components/headers/ReadOnly" }
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
          examples:
            readOnly:
              summary: A write against a read-only deployment
              value:
                error: "this ochakai is read-only: it serves knowledge but does not change it"
            notADelegator:
              summary: X-Ochakai-On-Behalf-Of from a caller not permitted to delegate
              value:
                error: "auth: X-Ochakai-On-Behalf-Of: app@example.iam.gserviceaccount.com is not permitted to act on behalf of others (add it to OCHAKAI_DELEGATING_CALLERS)"
  schemas:
    Type:
      type: string
      description: >
        The OKF type vocabulary, verbatim — the built-ins (Metric,
        Attested Computation, Skill, Playbook, Insight, Policy,
        Glossary Term, BigQuery Dataset, BigQuery Table, API Endpoint,
        Reference) are recommendations,
        not a closed set, and no server behavior hangs off any of them
        (design doc 0038). Any
        single-line value works as a type; OKF registers no taxonomy, so
        the spelling is the meaning and it round-trips unchanged. Matching
        is case-insensitive; the spelling you write is the one stored.
      examples: [Metric, Attested Computation, Skill, Playbook, Insight, Policy, Glossary Term, BigQuery Dataset, BigQuery Table, API Endpoint, Reference, Data Contract]
      pattern: "^[^/\\r\\n]{1,128}$"
    Status:
      type: string
      description: >
        The lifecycle value, spelled as OKF SPEC §5.4 spells it: draft is
        "not yet reviewed, possibly incomplete", stable is "ready for
        consumption", deprecated is "kept for links and history, no longer
        current".
        It says nothing about whether anyone confirmed the entry — SPEC
        §5.3 puts that in `verified`, and ochakai keeps it in the
        verifications ledger, so a draft may be verified and a stable
        entry unverified (design doc 0043 §3.2). "Was never accepted" is
        likewise not a lifecycle value but a ruling, in `rejection`
        (§3.3).
        A document that names no status is stable — SPEC §5.4's default.
        ochakai does not write a key its writer left out, so what comes
        back here is the value a reader reads, while the document keeps
        its silence (design doc 0046 §3.9).
      enum: [draft, stable, deprecated]
    Trust:
      type: string
      description: >
        The tier a consumer derives from the verification ledger, in OKF's
        own vocabulary (SPEC §5.3): unverified when nobody has confirmed
        the entry, machine-confirmed when something other than a person
        has, human-reviewed when a person vouched for it. Derived on read
        and never accepted from a payload — and independent of status,
        which says whether the entry may be consumed (design doc 0046
        §3.10).
      enum: [unverified, machine-confirmed, human-reviewed]
    Verification:
      type: object
      description: >
        One recorded confirmation — an element of OKF's `verified` list
        (SPEC §5.2), and under §5.3 the only thing that makes an entry
        anything but unverified. Append-only and plural: re-checking an
        entry adds a row rather than replacing one, so the record answers
        "how often, and by whom" and not just "when last".
        Written by POST /api/v1/verify/{id}, never from a payload.
      properties:
        by: { $ref: "#/components/schemas/Actor" }
        at: { type: string, format: date-time }
    Rejection:
      type: object
      description: >
        This instance's ruling that an entry was not accepted — the memory
        that stops an agent re-proposing knowledge a human already turned
        down. One live ruling per entry; POST /api/v1/reject/{id} records
        it and DELETE lifts it.
        It is not a lifecycle value: a rejection is a judgment about the
        concept rather than a stage of it, and it could not round-trip as
        a status because export had to fold it onto deprecated, which
        asserts the opposite thing about the entry (design doc 0043 §3.3).
        A bundle does not carry it (design doc 0009).
      properties:
        by: { $ref: "#/components/schemas/Actor" }
        at: { type: string, format: date-time }
        note:
          description: >
            Why it was not accepted. The rejecter's words, distinct from
            the entry's own status_note, which belongs to whoever wrote
            the entry.
          type: string
    Actor:
      type: object
      description: >
        Who acted. Resolved from the caller's Google identity, never from
        the request payload (design doc 0009).
      properties:
        kind:
          description: >
            The spellings OKF SPEC §7 defines (design doc 0043 §3.8).
            Anything that is not a person is a process — §5.3 derives
            trust from the human: prefix alone, so no finer distinction
            is load-bearing. Service accounts are processes.
          type: string
          enum: [human, process]
        name: { type: string }
        via:
          description: >
            The delegating caller, when an application forwarded an end
            user's identity with X-Ochakai-On-Behalf-Of (design doc
            0027) — e.g. "process:app@project.iam.gserviceaccount.com" on
            an entry whose actor is the person who used that application.
            Absent when the caller acted as itself. Recorded rather than
            replaced: a write made through an application must stay
            distinguishable from one the person made directly.
          type: string
    Link:
      type: object
      description: >
        An edge to another entry, derived from a markdown link in the body.
        Links are untyped: OKF SPEC §5 leaves the kind of relationship to the
        surrounding prose.
      properties:
        target: { type: string, description: The target entry's id (its bundle path). }
        text:
          type: string
          description: >
            The anchor text the body used. Absent when the link carried none,
            in which case the target's last segment reads as the name.
    Summary:
      type: object
      description: >
        The projection of one entry: enough to name it, order it, and
        decide whether to read it (design doc 0043 §3.5). It is derived
        from the document and never authoritative — the document is what
        the entry says, and this is an index over it. A client that needs
        a key not listed here reads the document; the projection carries
        what listing surfaces sort and filter by, and stops there.
      required: [id, type, title, status, trust, rejected, content_hash, created_at, updated_at]
      properties:
        id:
          type: string
          description: >
            The entry's bundle path — where it lives (the type says what
            it is): path segments separated by "/", the OKF concept ID
            (design docs 0016, 0019). OKF prescribes no character set,
            so only path safety constrains segments: no leading ".",
            no control characters, at most 128 bytes each (512 total).
            The final segment must not be "index" or "log"
            (OKF-reserved filenames). Stored NFC-normalized, as are
            link targets and attachment names (design doc 0022).
          pattern: "^[^./][^/]{0,127}(/[^./][^/]{0,127})*$"
        type: { $ref: "#/components/schemas/Type" }
        title:
          type: string
          description: >
            The display name, already resolved: the entry's own title, or
            the id's last segment when it declared none (design doc
            0022). A row never has to work that fallback out for itself.
        description: { type: string }
        resource:
          type: string
          description: >
            Canonical URI of the underlying asset (OKF recommended key): the
            table/dataset URI, or for references the external source URL.
            Absent for abstract concepts.
        tags: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/Status" }
        stale_after:
          type: string
          format: date
          description: >
            Absolute date (YYYY-MM-DD) on and after which the entry is
            stale — OKF's lifecycle date (SPEC §5.5, design doc 0036
            §3.9). A date rather than a TTL so staleness is a plain
            comparison against today. Advisory: nothing hides a stale
            entry and search ranking never reads it — a passed date means
            due for a re-check, not wrong. The one surface that reads it
            is sort=stale_after, the feed of entries whose declared date
            has passed (design doc 0037 §2.1).
        trust:
          allOf: [{ $ref: "#/components/schemas/Trust" }]
          description: >
            Who has confirmed the entry, in OKF's own vocabulary (SPEC
            §5.3), derived from the verifications ledger. Independent of
            status: a draft may be human-reviewed and a stable entry
            unverified (design docs 0043 §3.2, 0046 §3.10). Who confirmed
            it, and how often, is in observed.verified.
        verified_at:
          type: string
          format: date-time
          description: >
            When the newest confirmation was recorded, absent when there
            is none. A row carries it because it is what sort=verified_at
            ranks by — a reviewer reading that feed is reading these times.
        rejected:
          type: boolean
          description: >
            Whether a live rejection stands against the entry. The ruling
            itself — by whom, when, and why — is in observed.rejection.
        links:
          type: array
          items: { $ref: "#/components/schemas/Link" }
          description: >
            Derived from the markdown links in the document's body,
            recomputed on every write. OKF SPEC §6's two forms are read:
            bundle-absolute (/metrics/revenue.md) and relative
            (./revenue.md). http(s) URLs and non-.md files are not (the
            latter are attachments).
        content_hash:
          type: string
          description: >
            The entry's version: the hash of the document as stored, and
            the same value the ETag header carries (design docs 0043
            §3.4, 0046 §3.4). Send it back as If-Match to write only if
            nothing changed meanwhile. Opaque — it covers the document
            alone, so a verification or an attachment leaves a held
            precondition valid, while a reformat moves it.
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: >
            When the content last changed — the same instant as
            observed.generated.at, which is the OKF spelling of it.
    Generated:
      type: object
      description: >
        OKF's generated family (SPEC §5.2): who the content stands by, and
        when it last changed. `by` is not the creator — once somebody else
        edits an entry, the creator is no longer who the content stands by
        — and verifying moves neither value (design doc 0036 §3.3).
      properties:
        by: { $ref: "#/components/schemas/Actor" }
        at: { type: string, format: date-time }
    Observed:
      type: object
      description: >
        What this instance saw happen to an entry, as against what the
        entry says. A bundle carries knowledge, and provenance is an
        observation this instance made (design doc 0009) — so it travels
        beside the document rather than inside it, and import never reads
        it back. Every value here is resolved from the caller's Google
        identity at the moment of the write, never from a payload: there
        is no request shape that can set any of them.
      properties:
        created_by: { $ref: "#/components/schemas/Actor" }
        generated: { $ref: "#/components/schemas/Generated" }
        verified:
          type: array
          items: { $ref: "#/components/schemas/Verification" }
          description: >
            Every recorded confirmation, oldest first. Absent means
            unverified, which is SPEC §5.3's own signal. Written by
            POST /api/v1/verify/{id}: this is an instance ledger, and
            import reads only whether a bundle's `verified` key was
            present (design docs 0009, 0043 §3.2).
        rejection:
          allOf: [{ $ref: "#/components/schemas/Rejection" }]
          description: >
            The live ruling, absent when there is none. Written by
            POST /api/v1/reject/{id} and cleared by DELETE.
    View:
      type: object
      description: >
        A read of one entry: the document it is, the projection to read it
        by, and what this instance observed about it (design doc 0043
        §3.5). The document is the entry — the same shape an export
        writes, a PUT takes, and `ochakai get` prints — and `summary` is
        an index over it, so where the two could disagree the document is
        right.
      required: [id, document, summary, observed]
      properties:
        id:
          type: string
          description: The entry's bundle path — the address this document was read from.
        document:
          type: string
          description: >
            The stored OKF document: YAML frontmatter, then markdown
            body — the bytes as they were written, normalized only for
            line endings, with the keys this instance owns (`generated`,
            `verified`) taken out. It is what content_hash is taken over
            (design docs 0043 §3.4, 0046 §§2.2, 3.4), so it can be
            edited and PUT back with nothing to strip, and the
            provenance those keys would have carried is in `observed`
            instead. Fetch the export form, server-owned keys included,
            with "Accept: text/markdown".
        summary: { $ref: "#/components/schemas/Summary" }
        observed: { $ref: "#/components/schemas/Observed" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
          description: >
            Attachment metadata (no bytes — fetch them via
            /api/v1/attachments/{id}/{name}). Managed through the
            attachment endpoints. Absent when the entry has none.
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        trust:
          allOf: [{ $ref: "#/components/schemas/Trust" }]
          readOnly: true
          description: >
            The trust tier derived from `verifications` (SPEC §5.3),
            carried so a caller reading a listing gets the same answer as
            one reading the ledger.
        content_changed_at:
          type: string
          format: date-time
          readOnly: true
          description: >
            When what the entry says last changed — OKF's generated.at
            (SPEC §5.2). Distinct from updated_at, which is when the row
            was last written: reformatting a document (reordering its
            frontmatter, adding a comment) changes the file and moves the
            ETag, while what the entry says stays put (design doc 0046
            §3.4).
    Attachment:
      type: object
      description: >
        A file attached to a knowledge entry — a dashboard screenshot, an
        ER diagram, a seeds file (design docs 0008, 0013). Metadata
        travels with the entry; bytes are a separate, deliberate fetch so
        agent context is never flooded with base64.
      properties:
        name: { type: string, description: Filename, unique within the entry. }
        media_type: { type: string, enum: [image/png, image/jpeg, image/webp, application/pdf, text/plain] }
        size: { type: integer }
        sha256: { type: string, description: Content hash; attachments are content-addressed and immutable. }
        okf_path:
          type: string
          description: >
            Bundle path a foreign OKF import carried this file at; export
            writes it back there so body links keep working. Absent for
            attachments born in ochakai (exported to "<id>/<name>").
        created_by: { $ref: "#/components/schemas/Actor", readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
    Usage:
      type: object
      properties:
        search_hits: { type: integer, description: Times the entry appeared in search results. }
        fetches: { type: integer, description: Times the entry was fetched individually. }
        worked: { type: integer, description: Outcome reports saying the entry led to a correct result. }
        failed: { type: integer, description: Outcome reports saying the entry led to a wrong or unusable result. }
        last_used_at: { type: string, format: date-time }
    SearchHit:
      description: >
        One search or listing result: the projection plus what ranked it.
        A hit no longer carries the entry. Search used to return whole
        entries on the reasoning that there they are the answer rather
        than a duplicate of one (design doc 0033) — true while an entry
        was a bag of fields, and false once it is a document: a page of
        results that shipped ten documents to answer "which of these
        should I read" spends the caller's context on the nine it will
        not. The document is one fetch away by id, and GET
        /api/v1/context is the call that returns entries.

        REST hits carry attachment metadata (filled in batch) so UIs can
        render image previews without a fetch per entry; MCP search
        results omit it to keep agent context lean (design doc 0015).
      allOf:
        - $ref: "#/components/schemas/Summary"
        - type: object
          properties:
            score: { type: number }
            usage:
              allOf: [ { $ref: "#/components/schemas/Usage" } ]
              readOnly: true
              description: >
                Usage totals, present in the sort=usage listing (the draft
                review feed) and the sort=failed listing (the re-verification
                feed); absent for search results and the verified_at feed.
            attachments:
              type: array
              items: { $ref: "#/components/schemas/Attachment" }
              readOnly: true
              description: >
                Attachment metadata for this row — a file beside the
                entry rather than part of its projection, which is why it
                is here and not in Summary. REST only.
    ContextRank:
      type: object
      description: >
        One hit's place in the ranking behind a context pack. The knowledge
        itself travels once, under `entries` — a rank that repeated it would
        double the response and leave the byte budget governing one of the
        copies (design doc 0033). Search results keep their full hits: there
        the entries are the answer, not a duplicate of one.
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/Type" }
        title:
          description: The display title — the entry's own, or its filename.
          type: string
        status: { $ref: "#/components/schemas/Status" }
        verified:
          type: boolean
          description: >
            Whether anybody confirmed the entry — the ledger's answer,
            which the lifecycle status no longer carries (design doc 0043
            §3.2). A caller deciding whether to spend a round trip on an
            id below the pack's cut-off wants it.
        score: { type: number }
    ContextOutline:
      type: object
      description: >
        An entry a context pack could not afford to deliver in full:
        enough to decide whether to spend a round trip fetching it by id,
        and nothing more.
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/Type" }
        title:
          description: The display title — the entry's own, or its filename.
          type: string
        description: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        bytes:
          description: What the full entry would have cost.
          type: integer
    Revision:
      type: object
      description: >
        One entry in a knowledge entry's change history: who changed it,
        how, when, and the whole entry as it stood, as an OKF document.
      properties:
        rev: { type: integer, description: 1-based, monotonically increasing per entry. }
        change: { type: string, enum: [create, update, verify, reject, unreject, delete, move, attach, detach] }
        changed_by: { $ref: "#/components/schemas/Actor" }
        changed_at: { type: string, format: date-time }
        document:
          type: string
          description: >
            The entry as it stood after this change, as an OKF document
            (design doc 0043 §3.9). It replaced a JSON snapshot of the
            server's own struct: a record whose shape depends on the
            reader knowing every past release is the distortion, not the
            fidelity, and it also means a diff between two revisions
            reads. The keys this instance owns are included — a revision
            records what the entry was, and who had confirmed it then is
            part of that.
