name: ci
on:
  push:
    branches: [main]
  pull_request:
  # govulncheck is the one job that answers a question the repository does
  # not ask: whether somebody else published a vulnerability against a
  # dependency this tree already pinned. That answer changes on days
  # nothing is committed here, so it is also on a clock — the same shape
  # scorecard.yaml already uses, and the reason every other job below
  # declines a scheduled run.
  schedule:
    - cron: "17 3 * * 2"
# Read-only, and nothing below asks for more: no job here pushes, comments
# or publishes. `persist-credentials: false` on every checkout is the
# other half — without it the job's token is left in `.git/config`, where
# any later step (a build script, a tool run from the tree) can read it.
# The two together are what makes a compromised step in this file cost
# nothing.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # A scheduled run is govulncheck's alone; this job answers only to a
    # commit.
    if: github.event_name != 'schedule'
    # Two majors, because the store is the part of ochakai a PostgreSQL
    # release can change underneath: migrations 0036, 0043 and 0044 stand
    # on what `to_tsvector` makes of Japanese, and
    # TestWhatPostgresCanIndexAboveTheBMP exists because that answer
    # moves. 17 is what Cloud SQL runs and what deploy/ names, so it is
    # the major that must be right; 18 is here so that the day an
    # operator can choose it, the answer is already known rather than
    # found by them.
    #
    # What that test actually reads is not only PostgreSQL. Above the BMP
    # the default parser asks the C library whether a character is a
    # letter, so the answer belongs to the image's glibc as much as to
    # the server: on glibc 2.39 the extension-I characters Unicode 17
    # added are letters and the test fails, on bookworm's 2.36 they are
    # not and it passes. Both plain tags below resolve to bookworm today
    # — pg17 is pg17-bookworm and pg18 is pg18-bookworm — which is what
    # makes this matrix vary one thing. If upstream ever repoints one of
    # them at trixie, that test is the one that will say so, and its
    # message already explains what to do.
    #
    # fail-fast is off for the same reason the matrix is here: a break on
    # one major is a fact about that major, not a reason to stop testing
    # the other.
    strategy:
      fail-fast: false
      matrix:
        postgres: [pg17, pg18]
    services:
      postgres:
        image: pgvector/pgvector:${{ matrix.postgres }}
        env:
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
          POSTGRES_DB: t
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U t"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # see the note above `permissions`
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # setup-go's built-in cache keys on go.sum alone and is shared
          # by every job, so the first job to finish freezes it and this
          # job's build cache — race-instrumented dependencies, vet facts
          # — never gets saved. Cache explicitly instead, per job.
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: test-${{ matrix.postgres }}-go-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          # The run_id makes the key unique per run, so a restore is
          # always a restore-keys prefix hit on the newest entry below it.
          restore-keys: |
            test-${{ matrix.postgres }}-go-${{ hashFiles('go.sum') }}-
            test-${{ matrix.postgres }}-go-
      # gofmt, go vet, go fix -diff, go test -race, and the CGO_ENABLED=0
      # build. Run through the script contributors run so the two cannot
      # drift.
      - run: scripts/check core
        env:
          OCHAKAI_TEST_DATABASE_URL: postgres://t:t@localhost:55433/t?sslmode=disable
      # Save only from main. A cache saved by a pull request run is
      # scoped to that pull request's merge ref and can only be restored
      # by re-runs of the same pull request, while every branch can
      # restore main's — so saving here too would spend ~700 MB of the
      # repository's 10 GB on an entry almost nobody reads, and eviction
      # is by least recent access, which would start dropping the main
      # entries these jobs actually depend on.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && github.ref == 'refs/heads/main'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: test-${{ matrix.postgres }}-go-${{ hashFiles('go.sum') }}-${{ github.run_id }}
  lint:
    runs-on: ubuntu-latest
    # A scheduled run is govulncheck's alone; this job answers only to a
    # commit.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # see the note above `permissions`
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # same shared-key problem as in the test job
      # golangci-lint keeps its own analysis cache, which the action
      # below handles; this is the Go module and build cache it type
      # checks us against.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: lint-go-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            lint-go-${{ hashFiles('go.sum') }}-
            lint-go-
      # Pinned, unlike govulncheck: a new govulncheck release failing CI
      # means a new vulnerability, but a new linter release failing CI
      # only means a new check.
      #
      # Via the action rather than `go run`, which built the linter and
      # every analyzer it bundles from source on each cold cache — about
      # three minutes, and the reason this job's cache was 586 MB. The
      # action installs a released binary instead. `args` is explicit
      # because the default set of packages is not documented.
      #
      # `scripts/check lint` reads the version below out of this file, so
      # this is the one place it is written.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          args: ./...
          skip-save-cache: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && github.ref == 'refs/heads/main'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: lint-go-${{ hashFiles('go.sum') }}-${{ github.run_id }}
  # The web UI's own tests. The unit half needs nothing but Node; the
  # browser smoke needs a page to load, which means a database, a server
  # with something in it, and the `ochakai ui` proxy in front — so the
  # job stands the whole thing up rather than mocking a knowledge base
  # the page would then be tested against instead of the real one.
  webui:
    runs-on: ubuntu-latest
    # A scheduled run is govulncheck's alone; this job answers only to a
    # commit.
    if: github.event_name != 'schedule'
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
          POSTGRES_DB: t
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U t"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # see the note above `permissions`
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # same shared-key problem as in the test job
      # Named, because this job is the one place a Node version decides
      # anything: `scripts/check ui` passes a glob to `node --test`, and
      # the smoke below drives Chrome over the DevTools Protocol with
      # Node's own global WebSocket. Both are recent enough that the
      # runner image's default has already moved under them once. 24 is
      # the line under long-term support; there is no package.json to say
      # it in, so it is said here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # The unit half first: it is the part that fails for a reason in
      # the code rather than a reason in the plumbing.
      - run: scripts/check ui
      - run: go build -o /tmp/ochakai ./cmd/ochakai
      # dev mode because the proxy has no Google identity here; the page
      # under test does not know the difference (design doc 0006).
      - name: stand up ochakai and the UI proxy
        env:
          OCHAKAI_DATABASE_URL: postgres://t:t@localhost:55433/t?sslmode=disable
          OCHAKAI_EMBEDDINGS: "off"
          OCHAKAI_MODE: dev
        run: |
          /tmp/ochakai serve &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/health > /dev/null && break
            sleep 1
          done
          /tmp/ochakai import examples/demo --url http://127.0.0.1:8080
          # The review page draws its trend only for a base somebody has
          # ruled on: eight zeroes would read as "review stopped", so the
          # sparkline is absent instead (design doc 0095), and the smoke
          # asserts the shape. An import does not rule on what it writes
          # (design doc 0009 §3.2) — so the ruling is made here, the way
          # a curator makes it, rather than as a side effect of loading
          # the corpus.
          /tmp/ochakai verify metrics/revenue --url http://127.0.0.1:8080
          OCHAKAI_URL=http://127.0.0.1:8080 /tmp/ochakai ui --port 8098 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8098/ > /dev/null && exit 0
            sleep 1
          done
          echo "the UI proxy never answered" >&2
          exit 1
      # Chrome is preinstalled on the runner image. REQUIRED turns the
      # smoke's "no browser / no server" skip into a failure: here, a skip
      # is a green run that tested nothing.
      - run: node internal/webui/jstest/smoke.mjs http://127.0.0.1:8098
        env:
          OCHAKAI_TEST_SMOKE_REQUIRED: "1"

  # The workflows themselves, and `dependabot.yml` beside them — zizmor
  # collects what GitHub reads, and letting it choose is what keeps this
  # and `scripts/check actions` looking at one set. Every other check in
  # this repository reads Go, YAML that describes the API, or the
  # repository's settings; these files are the one thing that decides what
  # runs with which token, and nothing else read them.
  #
  # It reports nothing today, which is the condition design doc 0035
  # §3.1 puts on a check before it may exist: the properties zizmor
  # audits are ones this repository already keeps by hand — actions
  # pinned by commit SHA, `persist-credentials: false` on every checkout,
  # the narrowest `permissions`, and no untrusted value reaching a `run:`
  # through an expression. It reported one thing on the way in, and the
  # fix is in `dependabot.yml`: a version update now waits out a cooldown.
  # What this buys from here on is that the next file added cannot quietly
  # drop one of them.
  #
  # `persona` stays at its default. At `pedantic` there are eighteen more
  # findings, and the ones that carry weight say the `services:` image is
  # not pinned by digest — deliberate: the Dockerfile pins its bases by
  # digest *because* dependabot reads the tag-and-digest pair and opens
  # the pull request that moves them, and nothing reads a service image
  # that way, so a digest here would be a pin that goes stale unread.
  #
  # `online-audits: false` so this answers from the tree alone: the same
  # run offline is what `scripts/check actions` does locally, and a check
  # whose verdict depends on a third party's availability is one whose
  # red does not mean what it says.
  #
  # Annotations rather than SARIF: uploading to code scanning needs
  # `security-events: write`, and the note above `permissions` at the top
  # of this file is a promise that no job here asks for more than read.
  # CodeQL and Scorecard upload from their own files, where that
  # permission is the point.
  actions:
    runs-on: ubuntu-latest
    # A scheduled run is govulncheck's alone; this job answers only to a
    # commit.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # see the note above `permissions`
      # Pinned, for the reason golangci-lint is and govulncheck is not: a
      # new release failing CI here would mean a new audit, not a new
      # problem. `scripts/check actions` reads the version below out of
      # this file, so this is the one place it is written.
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: 1.29.0
          online-audits: false
          advanced-security: false
          annotations: true
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # see the note above `permissions`
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  # The quick start is the first five minutes of every reader's experience
  # with ochakai, and nothing else here runs it: the unit tests never
  # start deploy/compose.yaml, and nothing curls the API it stands up.
  # This job runs README.md's own steps verbatim.
  quickstart:
    runs-on: ubuntu-latest
    # A scheduled run is govulncheck's alone; this job answers only to a
    # commit.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # see the note above `permissions`
      # --build: the compose file also names a published `image:`, and
      # without --build compose is free to reuse that instead of building
      # the commit under test. The point of this job is to catch a break
      # in this commit's code or compose file, not to re-test a release.
      - run: docker compose -f deploy/compose.yaml up -d --build
      # `ochakai` has no healthcheck (only `db` does — see the compose
      # file), so wait for the port to answer instead of `docker compose
      # up --wait`. Migration runs before the server starts listening
      # (cmd/ochakai/main.go's setup() then serve()), so a /health that
      # answers means search is ready too.
      - name: wait for ochakai to come up
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health > /dev/null && exit 0
            sleep 1
          done
          echo "ochakai never answered /health" >&2
          exit 1
      - run: docker compose -f deploy/compose.yaml exec -T ochakai /ochakai import /examples/demo
      - name: search finds what was just imported
        run: |
          hits=$(curl -sf 'http://localhost:8080/api/v1/search?q=revenue' | jq '.hits | length')
          [ "$hits" -gt 0 ] || { echo "search?q=revenue returned no hits after import" >&2; exit 1; }
      - if: failure()
        run: docker compose -f deploy/compose.yaml logs
