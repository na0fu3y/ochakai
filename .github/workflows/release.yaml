# Publishes ghcr.io/na0fu3y/ochakai on version tags with SBOM and SLSA
# provenance attestation, and attaches prebuilt binaries to the GitHub
# release. Actions are pinned by commit SHA; images can be verified with
# `gh attestation verify oci://ghcr.io/na0fu3y/ochakai:<tag> -R na0fu3y/ochakai`,
# archives with `gh attestation verify <file> -R na0fu3y/ochakai`.
name: release
on:
  push:
    tags: ["v*"]
# Read-only by default, so a job added below starts with no write
# permission it did not ask for. Each job declares what it needs.
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push the image to GHCR
      id-token: write
      attestations: write
    steps:
      # persist-credentials: false on both jobs' checkouts. Neither pushes
      # with git — this one talks to GHCR with the registry login below,
      # and `binaries` uses `gh`, which reads GH_TOKEN from the
      # environment — so the token left in `.git/config` would be readable
      # by every later step and used by none of them. That matters most in
      # `binaries`, which runs goreleaser over the tree with
      # `contents: write` in scope.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
  # Independent of `publish`: the image and the archives are separate
  # artifacts, and a registry outage should not cost us the binaries.
  binaries:
    runs-on: ubuntu-latest
    permissions:
      # Deliberately not the same set as `publish`: this job needs to
      # write release assets, but has no business with packages.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # goreleaser derives the version from the tag and walks the
          # history to find the previous one; a shallow clone has
          # neither.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Same shared-key problem as in ci.yaml, and a release runs
          # once per tag — there is nothing to warm.
          cache: false
      # goreleaser shells out to syft for the archives' SBOMs (the
      # `sboms:` block in .goreleaser.yaml); this puts it on PATH.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # The config declares `version: 2`; keep the tool on that
          # major so a v3 release cannot silently change the output.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The MCP bundle: one zip a desktop app installs in a click, built
      # out of the binaries goreleaser just produced. Attached with `gh`
      # rather than by goreleaser, which has no bundle format and would
      # need a custom publisher for one file.
      - name: Pack and attach the MCP bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          scripts/mcpb "$TAG"
          gh release upload "$TAG" dist/*.mcpb --clobber
      # goreleaser's own changelog generation is disabled (the notes are
      # written by hand), so a release it creates has an empty body and
      # the Releases page shows a bare tag until someone edits it. The
      # notes already exist by then: this repo's habit is that the
      # annotated tag's message *is* the release notes. Copy it over.
      # A release drafted with its body before the tag was pushed keeps
      # that body — `keep-existing` leaves it alone, and so does this.
      - name: Fill an empty release body from the tag message
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$(gh release view "$TAG" --json body --jq .body)" ]; then
            echo "$TAG already has a release body; leaving it alone"
            exit 0
          fi
          if [ "$(git tag -l --format='%(objecttype)' "$TAG")" != tag ]; then
            echo "::warning::$TAG is not annotated, so it carries no message to copy"
            exit 0
          fi
          # Line 1 is the title ("ochakai X.Y.Z") and line 2 is blank.
          git tag -l --format='%(contents)' "$TAG" | tail -n +3 > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::warning::$TAG's message is a title with nothing under it"
            exit 0
          fi
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
      # The image carries provenance; the archives people actually
      # download should too.
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.mcpb
            dist/checksums.txt
      # The same attestations, beside the archives rather than only in
      # GitHub's attestation store. This adds no guarantee — `gh
      # attestation verify` already reads the store — it adds a
      # *reachable* one, for the two readers that cannot: an OSS review
      # walking release assets (OpenSSF Scorecard's Signed-Releases looks
      # for a `.intoto.jsonl`, and scored this repository 0 while every
      # artifact above was attested), and anyone verifying without
      # reaching github.com, who now has `gh attestation verify <file>
      # --bundle <this>` offline.
      #
      # `.intoto.jsonl` is what the file is rather than a name chosen to
      # be found: the action appends one JSON bundle per line as it
      # attests each subject, and emits the eight above as one file.
      #
      # Scorecard averages over the last five releases, so this moves the
      # score across five tags rather than at the next one.
      - name: Attach the attestation bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # ochakai_X.Y.Z, the spelling every other asset uses — the tag
          # without its leading v, the way scripts/mcpb names the bundle.
          name="ochakai_${TAG#v}.intoto.jsonl"
          cp "$BUNDLE" "$RUNNER_TEMP/$name"
          gh release upload "$TAG" "$RUNNER_TEMP/$name" --clobber
      # Publishing is last, because a published release is immutable
      # here: GitHub answers 422 to an asset upload against one, and
      # everything above this line is an addition to what goreleaser
      # created. v0.21.0 is what that costs when the order is wrong —
      # the bundle upload failed, and `set -e` took the notes and the
      # attestations down with it, leaving a bare tag on the Releases
      # page. goreleaser leaves a draft (`release.draft` in
      # .goreleaser.yaml); this is the step that makes it a release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
